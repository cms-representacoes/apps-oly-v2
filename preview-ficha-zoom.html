<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha no Zoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
  :root{
    --primary:#7c3aed; --vw-painel:#f8fafc; --vw-painel-borda:#e2e8f0;
    --vw-texto:#0f172a; --vw-fraco:#64748b; --vw-linha:#e2e8f0; --vw-pdv:#7c3aed;
    --vw-chip:#fff; --tec:#0f766e; --tec-bg:#f0fdfa; --tec-linha:#99f6e4;
    --fundo:#0b0e14; --foto:#eef1f6;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fundo);color:#e2e8f0;
    font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:24px 18px 50px}
  .topo{max-width:1080px;margin:0 auto 16px}
  .topo h1{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.02em}
  .topo p{margin:0;font-size:13.5px;color:#94a3b8;line-height:1.5;max-width:78ch}
  .topo b{color:#c4b5fd}
  .barra{max-width:1080px;margin:0 auto 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .barra label{font-size:12px;color:#94a3b8;font-weight:700}
  .barra select{background:#151a24;color:#e2e8f0;border:1px solid #273043;border-radius:9px;
    padding:7px 11px;font-size:13px;font-weight:700;font-family:inherit;max-width:330px}
  .barra .cont{font-size:12px;color:#64748b;margin-left:auto}
  .barra button{background:#151a24;color:#c4b5fd;border:1px solid #273043;border-radius:9px;
    padding:7px 11px;font-size:12px;font-weight:800;font-family:inherit;cursor:pointer}

  .zoom{max-width:1080px;margin:0 auto;display:flex;gap:14px;background:#fff;border-radius:18px;
    padding:14px;align-items:stretch}
  .foto{flex:1;min-height:430px;border-radius:14px;background:var(--foto);
    display:grid;place-items:center;color:#9aa4b5;font-size:12.5px;font-weight:700}
  .painel{flex:none;width:250px;display:flex;flex-direction:column;gap:11px;padding:14px;
    background:var(--vw-painel);border:1px solid var(--vw-painel-borda);border-radius:16px;
    color:var(--vw-texto);max-height:76vh}
  .rolo{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:11px}
  .cab{display:flex;align-items:flex-start;gap:8px}
  .cab .info{flex:1 1 auto;min-width:0}
  .tit{font-weight:800;font-size:15px;line-height:1.25}
  .pdv{color:var(--vw-pdv);font-weight:800;font-size:20px;line-height:1.2}
  .x{flex:none;width:28px;height:28px;border-radius:999px;border:1px solid var(--vw-linha);
    background:var(--vw-chip);color:var(--vw-fraco);font-size:13px;cursor:pointer}
  .artcor{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}
  .artcor .fraco{opacity:.6;font-weight:600}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    background:var(--vw-chip);border:1px solid var(--vw-linha);font-size:11px;font-weight:700}
  .rotulo{font-size:11px;font-weight:700;color:var(--vw-fraco)}
  .thumbs{display:flex;gap:6px}
  .thumbs i{width:34px;height:34px;border-radius:9px;background:#e9edf3;border:1px solid var(--vw-linha);display:block}
  .thumbs i.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}

  .ficha{border-top:1px dashed var(--vw-linha);padding-top:11px;display:flex;flex-direction:column;gap:9px}
  .ficha h3{margin:0;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--vw-fraco)}
  /* dados: linha a linha, rótulo à esquerda e valor à direita */
  .linhas{display:flex;flex-direction:column;background:var(--vw-chip);border:1px solid var(--vw-linha);
    border-radius:10px;overflow:hidden}
  .lin{display:flex;align-items:baseline;gap:8px;padding:6px 10px;font-size:11.5px}
  .lin + .lin{border-top:1px solid var(--vw-linha)}
  .lin span{color:var(--vw-fraco);font-size:10px;font-weight:800;text-transform:uppercase;
    letter-spacing:.05em;flex:none;width:68px}
  .lin b{font-weight:700;line-height:1.35}
  /* tecnologias: uma por linha, resumidas */
  .tecs{display:flex;flex-direction:column;gap:5px}
  .tec{display:flex;gap:8px;align-items:baseline;border:1px solid var(--tec-linha);
    background:var(--tec-bg);border-radius:9px;padding:6px 9px}
  .tec b{flex:none;font-size:10.5px;font-weight:800;color:var(--tec);letter-spacing:.02em;
    text-transform:uppercase}
  .tec p{margin:0;font-size:11px;line-height:1.35;color:#334155}
  .tec.empilha{flex-direction:column;gap:2px}
  .vazio{font-size:11.5px;color:var(--vw-fraco);font-style:italic}
  .acoes{display:flex;gap:8px;flex:none;padding-top:9px;border-top:1px solid var(--vw-linha)}
  .acao{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;
    border-radius:12px;padding:10px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit}
  .acao.grade{background:var(--primary)}
  .acao.sacola{background:#111827}
  @media(max-width:820px){ .zoom{flex-direction:column} .painel{width:100%;max-height:none} .foto{min-height:240px} }
</style>
</head>
<body>
  <div class="topo">
    <h1>A ficha dentro do zoom</h1>
    <p>Os dados vêm primeiro; as tecnologias, depois — cada uma numa linha, com
       <b>resumo no lugar do texto oficial</b>, que tinha 170 caracteres e tomava o painel.
       Os botões ficam presos no rodapé: só a ficha rola.</p>
  </div>
  <div class="barra">
    <label for="prod">Produto:</label>
    <select id="prod"></select>
    <button id="btnTexto">ver o texto oficial</button>
    <span class="cont" id="cont"></span>
  </div>
  <div class="zoom">
    <div class="foto">a foto do produto fica aqui</div>
    <div class="painel" id="painel"></div>
  </div>

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let oficial = false;

const sel = document.getElementById('prod');
sel.innerHTML = FICHAS.map((f,i) =>
  '<option value="'+i+'">'+esc(f.nome||f.artigo)+' — '+f.tecnologias.length+' tec</option>').join('');
sel.onchange = () => desenhar(+sel.value);
document.getElementById('btnTexto').onclick = e => {
  oficial = !oficial;
  e.target.textContent = oficial ? 'ver o resumo' : 'ver o texto oficial';
  desenhar(+sel.value);
};

function desenhar(i){
  const f = FICHAS[i] || FICHAS[0];
  const dados = [['Origem',f.origem],['Gênero',f.genero],['Tamanhos',f.tamanhos],['Composição',f.composicao]]
    .filter(x=>x[1]).map(x=>'<div class="lin"><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>').join('');
  const tecs = f.tecnologias.length
    ? f.tecnologias.map(t => '<div class="tec'+(oficial?' empilha':'')+'"><b>'+esc(t.nome)+'</b>' +
        '<p>'+esc(oficial ? t.texto : t.resumo)+'</p></div>').join('')
    : '<div class="vazio">Este produto não traz tecnologia no catálogo.</div>';
  document.getElementById('painel').innerHTML =
    '<div class="rolo">' +
    '<div class="cab"><div class="info"><div class="tit">'+esc(f.nome)+'</div>' +
    '<div class="pdv">'+esc(f.pdv)+'</div></div><button class="x">✕</button></div>' +
    '<div class="artcor"><span class="fraco">Art.</span> '+esc(f.artigo)+
    ' <span class="chip">🎨 PT/PRT</span></div>' +
    '<div class="rotulo">Cores · 1 de 2</div>' +
    '<div class="thumbs"><i class="on"></i><i></i></div>' +
    '<div class="ficha"><div class="linhas">'+dados+'</div>' +
    '<h3>Tecnologias</h3><div class="tecs">'+tecs+'</div></div>' +
    '</div>' +
    '<div class="acoes"><button class="acao grade">▧ Grade</button>' +
    '<button class="acao sacola">🛍 Sacola</button></div>';
  const r = document.querySelector('.rolo');
  document.getElementById('cont').textContent =
    FICHAS.length + ' fichas · ' + f.tecnologias.length + ' tecnologias' +
    (r.scrollHeight > r.clientHeight + 2 ? ' · ainda rola' : ' · coube inteira');
}
const maisTec = FICHAS.reduce((a,f,i,arr)=> f.tecnologias.length > arr[a].tecnologias.length ? i : a, 0);
sel.value = String(maisTec);
desenhar(maisTec);
</script>
