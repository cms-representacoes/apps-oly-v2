<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prévia · Encomendas com problema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --page:#E8EBF1; --card:#FFFFFF; --card-2:#F8FAFC; --sunk:#F1F4F8;
    --line:#E5E7EB; --line-soft:#EDF0F4; --line-strong:#D6DAE1;
    --ink:#0F172A; --muted:#6B7280; --faint:#94A3B8;
    --accent:#0D9488; --accent-ink:#0F766E; --accent-rgb:13,148,136;
    --cart:#2563EB; --fat:#16A34A;
    --grave:#DC2626; --grave-bg:#FEF2F2;
    --alto:#EA580C;  --alto-bg:#FFF1E7;
    --medio:#D97706; --medio-bg:#FFF4E0;
    --leve:#A16207;  --leve-bg:#FEF9E7;
    --roxo:#7C3AED;  --roxo-bg:#F3EEFF;
    --r:18px;
    --sombra:0 1px 2px rgba(15,23,42,.04), 0 10px 28px -16px rgba(15,23,42,.18);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:var(--page); color:var(--ink); -webkit-font-smoothing:antialiased; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  [hidden]{ display:none !important; }
  .num{ font-variant-numeric:tabular-nums; }
  :focus-visible{ outline:2px solid rgba(var(--accent-rgb),.55); outline-offset:2px; }

  .pagina{ max-width:1400px; margin:0 auto; padding:14px 20px 90px; display:flex; flex-direction:column; gap:14px; }
  .aviso-previa{ align-self:flex-start; font-size:11px; font-weight:700; color:var(--accent-ink);
    background:rgba(var(--accent-rgb),.1); border-radius:999px; padding:4px 11px; }

  /* cabeçalho: a mesma faixa verde do RFV e das Entradas e saídas */
  .cab{ display:flex; align-items:center; gap:14px; padding:12px 16px; border-radius:var(--r);
    background:linear-gradient(120deg,#0F766E,#0D9488 60%,#14A89A); color:#fff; box-shadow:var(--sombra); flex-wrap:wrap; }
  .voltar{ width:38px; height:38px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:#fff; flex:none; }
  .cab h1{ margin:0; font-size:18px; font-weight:800; letter-spacing:-.01em; }
  .cab small{ display:block; font-size:11px; font-weight:600; opacity:.85; margin-top:2px; }
  .busca{ flex:1 1 280px; max-width:460px; display:flex; align-items:center; gap:9px; height:40px; padding:0 14px;
    border-radius:999px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28); }
  .busca input{ flex:1; min-width:0; border:0; background:transparent; font:inherit; font-size:14px; color:#fff; outline:none; }
  .busca input::placeholder{ color:rgba(255,255,255,.75); }

  /* fichas: uma por tipo de problema, e é por elas que se troca de aba */
  .fichas{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
  .ficha{ text-align:left; border:1px solid var(--line); background:var(--card); border-radius:var(--r); box-shadow:var(--sombra);
    padding:13px 15px; display:flex; gap:12px; align-items:flex-start; min-width:0; position:relative;
    transition:border-color .15s, box-shadow .15s; }
  .ficha:hover{ border-color:var(--line-strong); }
  .ficha.on{ border-color:var(--c); box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 16%,transparent), var(--sombra); }
  .ficha .ic{ width:40px; height:40px; border-radius:12px; flex:none; display:grid; place-items:center; font-size:16px;
    background:var(--cb); color:var(--c); }
  .ficha .tx{ min-width:0; }
  .ficha .t, .ficha .v, .ficha .s{ display:block; }
  .ficha .t{ font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  .ficha .v{ font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.15; color:var(--c); }
  .ficha .v small{ font-size:12px; color:var(--muted); font-weight:700; margin-left:4px; }
  .ficha .s{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .ficha .s b{ color:var(--ink); }
  .ficha.novo::after{ content:'precisa do script'; position:absolute; top:10px; right:12px; font-size:9.5px; font-weight:800;
    color:var(--roxo); background:var(--roxo-bg); padding:2px 7px; border-radius:999px; }

  .explica{ font-size:13px; color:var(--muted); line-height:1.5; margin:0; padding:0 4px; }
  .explica b{ color:var(--ink); }

  /* barra: gravidade, agrupamento e busca rápida */
  .barra{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pilula{ height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--card);
    font-size:12.5px; font-weight:700; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .pilula .n{ font-size:11px; font-weight:800; color:var(--muted); }
  .pilula .pt{ width:8px; height:8px; border-radius:50%; background:var(--c, var(--faint)); }
  .pilula.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .pilula.on .n{ color:rgba(255,255,255,.7); }
  .seg{ display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px; margin-left:auto; }
  .seg button{ border:0; background:transparent; height:30px; padding:0 13px; border-radius:999px; font-size:12px; font-weight:700; color:var(--muted); }
  .seg button.on{ background:var(--accent); color:#fff; }
  .divisor{ width:1px; height:22px; background:var(--line-strong); }

  /* tabela */
  .quadro{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sombra); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  thead th{ background:linear-gradient(120deg,#0F766E,#0D9488); color:#fff; font-size:10.5px; font-weight:800;
    letter-spacing:.07em; text-transform:uppercase; text-align:left; padding:11px 12px; white-space:nowrap; }
  thead th.n{ text-align:right; }
  tbody td{ padding:9px 12px; border-top:1px solid var(--line-soft); font-size:13px; vertical-align:middle; }
  tbody tr:hover td{ background:var(--card-2); }
  td.n{ text-align:right; font-weight:800; }
  .foto{ width:48px; height:48px; border-radius:12px; border:1px solid var(--line); background:#fff; overflow:hidden; display:grid; place-items:center; }
  .foto img{ width:100%; height:100%; object-fit:contain; }
  .prod b{ display:block; font-weight:700; }
  .prod small, .cli small{ color:var(--faint); font-size:11.5px; }
  .cli b{ font-weight:700; }
  .gci{ color:var(--muted); font-size:12.5px; }
  .atraso{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; padding:4px 10px; border-radius:999px;
    color:var(--c); background:var(--cb); white-space:nowrap; }
  .data{ font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .data s{ color:var(--faint); }
  .acoes{ display:flex; gap:6px; justify-content:flex-end; }
  .ac{ width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--muted); display:grid; place-items:center; font-size:13px; }
  .ac:hover{ color:var(--accent-ink); border-color:rgba(var(--accent-rgb),.4); }
  .faltam{ font-size:11.5px; color:var(--roxo); font-weight:700; }

  /* agrupado: um cartão por cliente (ou preposto) */
  .grupos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; }
  .grupo{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sombra); padding:14px 16px; min-width:0; }
  .grupo header{ display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
  .grupo h3{ margin:0; font-size:14.5px; font-weight:800; }
  .grupo header small{ color:var(--faint); font-size:11.5px; }
  .grupo .tot{ margin-left:auto; text-align:right; flex:none; }
  .grupo .tot b{ display:block; font-size:18px; font-weight:800; color:var(--cart); }
  .grupo .tot span{ font-size:11px; color:var(--muted); }
  .grupo ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .grupo li{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
  .grupo li .foto{ width:34px; height:34px; border-radius:9px; }
  .grupo li .nm{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grupo li .nm small{ color:var(--faint); }
  .grupo .mais{ font-size:12px; color:var(--accent-ink); font-weight:700; margin-top:8px; }
  .whats{ margin-top:10px; width:100%; height:34px; border-radius:10px; border:1px solid #BBF7D0; background:#F0FDF4; color:#15803D;
    font-size:12.5px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px; }

  .rodape{ text-align:center; font-size:12px; color:var(--muted); padding:10px; }
  .vazio{ padding:40px; text-align:center; color:var(--muted); }

  /* tablet e celular: fichas em duas colunas e a tabela vira cartões */
  @media (max-width:1100px){
    .fichas{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    .seg{ margin-left:0; }
  }
  @media (max-width:900px){
    .pagina{ padding:10px 12px 90px; }
    thead{ display:none; }
    table, tbody{ display:block; }
    tbody tr{ display:grid; grid-template-columns:48px 1fr auto; gap:2px 12px; padding:12px 14px; border-top:1px solid var(--line-soft); }
    tbody tr:first-child{ border-top:0; }
    tbody td{ border:0; padding:0; }
    td.c-foto{ grid-row:1 / span 3; }
    td.c-prod{ grid-column:2; }
    td.c-n{ grid-column:3; grid-row:1; }
    td.c-cli{ grid-column:2 / span 2; }
    td.c-gci, td.c-cor{ display:none; }
    td.c-data{ grid-column:2; }
    td.c-atraso{ grid-column:3; grid-row:2 / span 2; align-self:end; text-align:right; }
    td.c-acoes{ grid-column:1 / span 3; margin-top:6px; }
    .acoes{ justify-content:flex-start; }
    .grupos{ grid-template-columns:1fr; }
  }
  @media (min-width:600px) and (max-width:900px){
    tbody{ display:grid; grid-template-columns:1fr 1fr; }
    tbody tr, tbody tr:first-child{ border-top:1px solid var(--line-soft); }
    tbody tr:nth-child(odd){ border-right:1px solid var(--line-soft); }
    tbody tr:nth-child(-n+2){ border-top:0; }
  }
  @media (max-width:560px){
    .fichas{ gap:8px; }
    .ficha{ padding:11px 12px; gap:9px; }
    .ficha .ic{ width:32px; height:32px; font-size:13px; border-radius:10px; }
    .ficha .v{ font-size:19px; }
    .ficha .s{ font-size:10.5px; }
    .ficha.novo::after{ display:none; }
    .cab h1{ font-size:16px; }
    .barra{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -12px; padding:0 12px; }
    .barra::-webkit-scrollbar{ display:none; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>

const IMG = 'https://cms-representacoes.github.io/apps-oly-v2/imagens_olympikus/';
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const nf = n => Number(n || 0).toLocaleString('pt-BR');

const dia = n => { const d = new Date(n * 86400000); return `${String(d.getUTCDate()).padStart(2,'0')}/${MESES[d.getUTCMonth()]}`; };

    sub: l => `<b>${nf(l.filter(x => x.adiou > 15).length)}</b> adiadas mais de 15 dias`,
    explica:'A previsão <b>mudou para mais tarde</b> desde que a encomenda entrou na carteira. Ainda não venceu, mas o cliente foi prometido para uma data que não vai acontecer. <b>Só dá para saber comparando as bases dos dias</b>: o script diário teria de guardar a primeira previsão, como já faz com as entradas e saídas.' },
  qbr: { rot:'Caixa quebrada', ic:'fa-box-open', c:'var(--roxo)', cb:'var(--roxo-bg)', lista:D.quebradas,
    sub: () => 'calçado fora de caixa fechada',
    explica:'Calçado em carteira com número de pares que <b>não fecha caixa</b> (múltiplo de 6). Costuma ser cancelamento parcial ou pedido digitado errado, e a fábrica pode não atender a sobra.' },
  sem: { rot:'Saiu sem nota', ic:'fa-right-from-bracket', c:'var(--alto)', cb:'var(--alto-bg)', lista:D.semNota, total:D.semNotaTotal,
    sub: () => 'no mês, sem marcação na Detalhada',
    explica:'Saíram da carteira <b>sem nota fiscal</b> e ninguém marcou transferência nem cancelamento na Detalhada. Vem das Entradas e saídas. Marcando aqui, o relatório passa a mostrar para onde foi.' },
};

const E = { tipo:'atr', grav:'', agrupar:'lista', busca:'' };

function pintarFichas(){
  document.getElementById('fichas').innerHTML = Object.entries(TIPOS).map(([id, t]) => {
    const enc = t.total ? t.total.enc : t.lista.length;
    const pares = t.total ? t.total.pares : soma(t.lista);
    return `<button class="ficha ${E.tipo === id ? 'on' : ''} ${t.novo ? 'novo' : ''}" data-tipo="${id}" style="--c:${t.c};--cb:${t.cb}">
      <span class="ic"><i class="fa-solid ${t.ic}"></i></span>
      <span class="tx"><span class="t">${t.rot}</span>
        <span class="v num">${nf(enc)}<small>${nf(pares)} pares</small></span>
        <span class="s">${t.sub(t.lista)}</span></span></button>`;
  }).join('');
}

function filtrada(){
  const t = TIPOS[E.tipo], q = norm(E.busca);
  return t.lista.filter(x => (!E.grav || E.tipo !== 'atr' || gravDe(x.dias).id === E.grav) &&
    (!q || norm([x.nome, x.ref, x.cor, x.cli, x.cliCod, x.gci, x.prep].join(' ')).includes(q)));
}

function pintarBarra(){
  const t = TIPOS[E.tipo];
  let h = '';
  if (E.tipo === 'atr'){
    h += `<button class="pilula ${E.grav ? '' : 'on'}" data-grav="">Todas <span class="n">${nf(t.lista.length)}</span></button>`;
    h += GRAV.map(g => {
      const n = t.lista.filter(x => gravDe(x.dias).id === g.id).length;
      return `<button class="pilula ${E.grav === g.id ? 'on' : ''}" data-grav="${g.id}" style="--c:${g.c}">
        <span class="pt"></span>${g.rot} <span class="n">${nf(n)}</span></button>`;
    }).join('');
  }
  h += `<div class="seg" role="radiogroup">${[['lista','Lista'],['cliente','Por cliente'],['preposto','Por preposto']]
    .map(([id, r]) => `<button class="${E.agrupar === id ? 'on' : ''}" data-agr="${id}">${r}</button>`).join('')}</div>`;
  document.getElementById('barra').innerHTML = h;
  document.getElementById('explica').innerHTML = t.explica;
}

function celulaProblema(x){
  if (E.tipo === 'atr'){
    const g = gravDe(x.dias);
    return `<span class="atraso" style="--c:${g.c};--cb:${g.cb}"><i class="fa-solid fa-clock"></i>${x.dias} ${x.dias === 1 ? 'dia' : 'dias'}</span>`;
  }
  if (E.tipo === 'adi') return `<span class="atraso" style="--c:var(--medio);--cb:var(--medio-bg)">+${x.adiou} dias</span>`;
  if (E.tipo === 'qbr'){ const f = 6 - (x.cart % 6); return `<span class="faltam">faltam ${f} p/ fechar</span>`; }
  return `<span class="atraso" style="--c:var(--alto);--cb:var(--alto-bg)">saiu ${dia(x.saiu)}</span>`;
}
function celulaData(x){
  if (E.tipo === 'adi') return `<span class="data"><s>${dia(x.era)}</s> → ${dia(x.prev)}</span>`;
  return `<span class="data">prev. ${x.prev >= 0 ? dia(x.prev) : '—'}</span>`;
}
const ROT_PROB = { atr:'Atraso', adi:'Adiou', qbr:'Caixa', sem:'Saída' };

function tabela(l){
  const acoes = E.tipo === 'sem'
    ? `<button class="ac" title="Marcar como transferência"><i class="fa-solid fa-right-left"></i></button>
       <button class="ac" title="Marcar como cancelamento"><i class="fa-solid fa-ban"></i></button>`
    : `<button class="ac" title="Abrir na lista da Detalhada"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
       <button class="ac" title="Marcar para cancelar"><i class="fa-solid fa-ban"></i></button>
       <button class="ac" title="Copiar GCI"><i class="fa-regular fa-copy"></i></button>`;
  return `<div class="quadro"><table>
    <thead><tr><th></th><th>Produto</th><th>Cor</th><th>GCI</th><th>Cliente</th><th>${E.tipo === 'adi' ? 'Previsão' : 'Prev. fat.'}</th>
      <th>${ROT_PROB[E.tipo]}</th><th class="n">Pares</th><th></th></tr></thead>
    <tbody>${l.slice(0, 150).map(x => `<tr>
      <td class="c-foto">${foto(x)}</td>
      <td class="c-prod prod"><b>${esc(x.nome)}</b><small>${esc(x.ref)}</small></td>
      <td class="c-cor">${esc(x.cor)}</td>
      <td class="c-gci gci">${esc(x.gci)}</td>
      <td class="c-cli cli"><b>${esc(x.cli)}</b> <small>· ${esc(x.prep)}</small></td>
      <td class="c-data">${celulaData(x)}</td>
      <td class="c-atraso">${celulaProblema(x)}</td>
      <td class="c-n n num" style="color:var(--cart)">${nf(x.cart)}</td>
      <td class="c-acoes"><div class="acoes">${acoes}</div></td></tr>`).join('')}</tbody></table></div>
    <p class="rodape">${l.length > 150 ? `Mostrando 150 de ${nf(l.length)} · ` : ''}${nf(l.length)} encomendas · ${nf(soma(l))} pares</p>`;
}

function grupos(l, chave){
  const m = new Map();
  for (const x of l){
    const k = chave === 'cliente' ? x.cliCod : x.prep;
    if (!m.has(k)) m.set(k, { nome: chave === 'cliente' ? x.cli : x.prep, sub: chave === 'cliente' ? `${x.cliCod} · ${x.prep}` : '', itens: [] });
    m.get(k).itens.push(x);
  }
  const gs = [...m.values()].sort((a, b) => soma(b.itens) - soma(a.itens));
  return `<div class="grupos">${gs.map(g => {
    const pior = E.tipo === 'atr' ? Math.max(...g.itens.map(x => x.dias)) : 0;
    return `<article class="grupo">
      <header><div><h3>${esc(g.nome)}</h3><small>${esc(g.sub || nf(new Set(g.itens.map(x => x.cliCod)).size) + ' clientes')}</small></div>
        <div class="tot"><b class="num">${nf(soma(g.itens))}</b><span>${nf(g.itens.length)} encomendas${pior ? ` · até ${pior} dias` : ''}</span></div></header>
      <ul>${g.itens.slice(0, 5).map(x => `<li>${foto(x)}<span class="nm"><b>${esc(x.nome)}</b> <small>${esc(x.cor)} · ${nf(x.cart)} pares</small></span>${celulaProblema(x)}</li>`).join('')}</ul>
      ${g.itens.length > 5 ? `<div class="mais">+ ${g.itens.length - 5} encomendas</div>` : ''}
      ${chave === 'cliente' && E.tipo === 'atr' ? '<button class="whats"><i class="fa-brands fa-whatsapp"></i> Copiar resumo para o cliente</button>' : ''}
    </article>`;
  }).join('')}</div>`;
}

function pintar(){
  pintarFichas(); pintarBarra();
  const l = filtrada();
  document.getElementById('subtitulo').textContent = `Base de 16/set · ${TIPOS[E.tipo].rot.toLowerCase()}`;
  document.getElementById('tela').innerHTML = !l.length ? '<div class="quadro vazio">Nada aqui com esse filtro</div>'
    : E.agrupar === 'lista' ? tabela(l) : grupos(l, E.agrupar);
}

document.addEventListener('click', e => {
  const f = e.target.closest('[data-tipo]'); if (f){ E.tipo = f.dataset.tipo; E.grav = ''; pintar(); return; }
  const g = e.target.closest('[data-grav]'); if (g){ E.grav = g.dataset.grav; pintar(); return; }
  const a = e.target.closest('[data-agr]'); if (a){ E.agrupar = a.dataset.agr; pintar(); }
});
document.getElementById('busca').addEventListener('input', e => { E.busca = e.target.value; pintar(); });
pintar();
</script>
</body>
</html>
