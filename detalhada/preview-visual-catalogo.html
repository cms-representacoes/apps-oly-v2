<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prévia · Detalhada no visual do Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  /* ── tokens: os do Catálogo Digital; a cor da marca troca pela paleta ── */
  :root{
    --bg:#E8EBF1; --card:#FFFFFF; --text:#0F172A; --muted:#6B7280; --faint:#94A3B8;
    --border:#E5E7EB; --border-strong:#D6DAE1; --sunk:#F8FAFC;
    --primary:#0D9488; --primary-rgb:13,148,136; --primary-ink:#0F766E;
    --logo:linear-gradient(135deg,#14B8A6,#0F766E);
    --carteira:#2563EB; --carteira-bg:#EFF4FF;
    --faturado:#16A34A; --faturado-bg:#ECFDF3;
    --atencao:#D97706;  --atencao-bg:#FFF7E8;
    --erro:#DC2626;     --erro-bg:#FEF2F2;
    --r-card:18px; --r-row:14px;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 10px 28px -16px rgba(15,23,42,.18);
    --act-h:38px;
  }
  :root[data-cor="catalogo"]{
    --primary:#7C3AED; --primary-rgb:124,58,237; --primary-ink:#6D28D9;
    --logo:linear-gradient(135deg,#8B5CF6,#6D28D9);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ font-family:'Plus Jakarta Sans', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  [hidden]{ display:none !important; }
  .num{ font-variant-numeric:tabular-nums; }
  :focus-visible{ outline:2px solid rgba(var(--primary-rgb),.55); outline-offset:2px; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }

  /* ── cabeçalho ── */
  .topo{ position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); }
  .topo-in{ max-width:1680px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:14px; }
  .marca{ display:flex; align-items:center; gap:10px; flex:none; }
  .logo{ width:44px; height:44px; border-radius:14px; background:var(--logo); color:#fff; display:flex; align-items:center;
    justify-content:center; font-weight:800; font-size:13px; letter-spacing:-.02em; box-shadow:0 6px 14px -6px rgba(var(--primary-rgb),.6); }
  .marca small{ display:block; font-size:10.5px; font-weight:600; color:var(--muted); line-height:1.1; }
  .marca b{ display:block; font-size:17px; font-weight:800; line-height:1.15; letter-spacing:-.01em; }
  .busca{ flex:1 1 auto; min-width:0; max-width:560px; display:flex; align-items:center; gap:8px; height:42px; padding:0 14px;
    border-radius:999px; background:var(--bg); border:1px solid var(--border); color:var(--muted); }
  .busca input{ flex:1; min-width:0; border:0; background:transparent; font:inherit; font-size:14px; color:var(--text); outline:none; }
  .acoes-topo{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .btn{ height:var(--act-h); display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:0 14px;
    border-radius:999px; background:#fff; border:1px solid var(--border); font-size:13px; font-weight:700; white-space:nowrap;
    transition:background .15s, border-color .15s, transform .15s; }
  .btn i{ color:var(--primary); font-size:14px; }
  .btn:hover{ background:var(--sunk); border-color:var(--border-strong); }
  .btn:active{ transform:translateY(1px); }
  .btn.icone{ width:var(--act-h); padding:0; }

  /* ── conteúdo ── */
  .pagina{ max-width:1680px; margin:0 auto; padding:18px 20px 90px; display:flex; flex-direction:column; gap:16px; }

  .kpis{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
  .kpi{ background:var(--card); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--shadow);
    padding:14px 16px; display:flex; align-items:center; gap:12px; min-width:0; }
  .kpi .ic{ width:40px; height:40px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .kpi .t{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .kpi .v{ font-size:24px; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
  .kpi .v small{ font-size:12px; font-weight:700; color:var(--muted); margin-left:3px; }
  .k-cart .ic{ background:var(--carteira-bg); color:var(--carteira); } .k-cart .v{ color:var(--carteira); }
  .k-fat .ic{ background:var(--faturado-bg); color:var(--faturado); }  .k-fat .v{ color:var(--faturado); }
  .k-conv .ic{ background:var(--atencao-bg); color:var(--atencao); }
  .k-neutro .ic{ background:rgba(var(--primary-rgb),.10); color:var(--primary); }

  .barra{ display:flex; align-items:center; gap:10px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; padding:2px; margin:-2px; }
  .barra::-webkit-scrollbar{ display:none; }
  .seg{ display:inline-flex; gap:6px; flex:none; }
  .seg button{ height:var(--act-h); padding:0 16px; border-radius:999px; border:1px solid var(--border); background:#fff;
    font-size:13px; font-weight:800; color:var(--text); }
  .seg button.on{ background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 6px 14px -8px rgba(var(--primary-rgb),.8); }
  .divisor{ width:1px; height:24px; background:var(--border); flex:none; }
  .filtro .ch{ font-size:10px; color:var(--faint); margin-left:2px; }
  .filtro .mais{ font-size:11px; font-weight:800; color:var(--primary); background:rgba(var(--primary-rgb),.1); border-radius:999px; padding:1px 7px; }

  .barra .ordem{ margin-left:auto; flex:none; }

  /* ── lista de produtos ── */
  .cols, .prod-main{ display:grid; align-items:center; column-gap:14px;
    grid-template-columns:60px minmax(180px,2.2fr) 1fr 1fr .9fr .8fr .8fr 1fr 1fr 40px; }
  /* títulos das colunas: numa barra do mesmo formato dos cartões, na cor da
     marca, presa logo abaixo do topo enquanto a lista rola */
  .cols{ position:sticky; top:calc(var(--topo-h,64px) + 8px); z-index:10;
    min-height:44px; padding:0 18px; border-radius:14px; border:1px solid rgba(var(--primary-rgb),.28);
    background:transparent; isolation:isolate;
    box-shadow:0 8px 18px -14px rgba(var(--primary-rgb),.55);
    font-size:11px; font-weight:800; color:var(--primary-ink); text-transform:uppercase; letter-spacing:.07em; }
  /* faixa da cor da página atrás da barra: os cartões que passam por baixo
     não aparecem nos cantos arredondados nem no vão até o topo */
  .cols::before{ content:""; position:absolute; left:-6px; right:-6px; top:-10px; bottom:-6px; background:var(--bg); z-index:-1; }
  .cols::after{ content:""; position:absolute; inset:-1px; border-radius:inherit; z-index:-1;
    border:1px solid rgba(var(--primary-rgb),.30);
    background:var(--card); }
  .cols span:nth-child(n+6){ text-align:center; }
  .lista{ display:flex; flex-direction:column; gap:10px; }
  .prod{ background:var(--card); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--shadow);
    overflow:hidden; transition:border-color .15s, box-shadow .15s; }
  .prod:hover{ border-color:var(--border-strong); }
  .prod.aberto{ border-color:rgba(var(--primary-rgb),.45); box-shadow:0 0 0 3px rgba(var(--primary-rgb),.10), var(--shadow); }
  .prod-main{ padding:10px 18px; cursor:pointer; }
  .thumb{ width:60px; height:60px; border-radius:14px; background:#fff; border:1px solid var(--border); overflow:hidden;
    display:flex; align-items:center; justify-content:center; color:var(--faint); }
  .thumb img{ width:100%; height:100%; object-fit:contain; }
  .p-nome{ font-size:15px; font-weight:800; letter-spacing:-.01em; line-height:1.25; }
  .p-sub{ display:none; }
  .chip{ display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 9px; border-radius:999px; font-size:11.5px; font-weight:700;
    white-space:nowrap; background:var(--sunk); border:1px solid var(--border); color:var(--text); }
  .chip i{ font-size:10px; color:var(--primary); }
  .chip.cor{ background:#fff; }
  .chip.art{ color:var(--muted); }
  .chip.art b{ color:var(--text); font-weight:800; }
  .chip.mes{ background:var(--atencao-bg); border-color:transparent; color:#92400E; }
  .chip.mes i{ color:var(--atencao); }
  .c-num{ text-align:center; font-size:15px; font-weight:700; }
  .c-num.fraco{ color:var(--muted); }
  .c-cart{ text-align:center; font-size:17px; font-weight:800; color:var(--carteira); }
  .c-fat{ text-align:center; font-size:17px; font-weight:800; color:var(--faturado); }
  .zero{ color:#CBD2DC !important; font-weight:700 !important; }
  .abrir{ width:36px; height:36px; border-radius:999px; border:1px solid var(--border); background:#fff; display:flex;
    align-items:center; justify-content:center; color:var(--muted); transition:transform .2s, background .15s; justify-self:end; }
  .prod.aberto .abrir{ transform:rotate(180deg); background:rgba(var(--primary-rgb),.1); color:var(--primary); border-color:transparent; }

  /* encomendas */
  .enc-area{ border-top:1px solid var(--border); background:rgba(var(--primary-rgb),.045); padding:12px 18px 16px; }
  .enc-topo{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .enc-topo .chip{ background:#fff; }
  .enc-topo .dica{ margin-left:auto; font-size:12px; color:var(--muted); font-weight:600; }
  .enc-cols, .enc-main{ display:grid; align-items:center; column-gap:12px;
    grid-template-columns:84px minmax(160px,2fr) 1fr 1fr 1fr .9fr .9fr .9fr 104px 30px; }
  .enc-cols{ min-height:34px; padding:0 14px; margin-bottom:6px; border-radius:12px; background:#fff;
    border:1px solid rgba(var(--primary-rgb),.22); font-size:10.5px; font-weight:800; color:var(--primary-ink);
    text-transform:uppercase; letter-spacing:.07em; }
  .enc-cols span:nth-child(n+6):nth-child(-n+8){ text-align:center; }
  .enc-lista{ display:flex; flex-direction:column; gap:6px; }
  .enc{ background:#fff; border:1px solid var(--border); border-radius:var(--r-row); overflow:hidden; }
  .enc.aberta{ border-color:rgba(var(--primary-rgb),.4); }
  .enc.faturada{ background:#FCFDFC; }
  .enc-main{ padding:9px 14px; cursor:pointer; font-size:13px; }
  .enc.sem-abrir .enc-main{ cursor:default; }
  .e-cod{ font-size:12px; font-weight:700; color:var(--muted); }
  /* o nome encolhe com reticências; a etiqueta da grade fica sempre inteira */
  .e-cli{ display:flex; align-items:center; min-width:0; font-weight:800; font-size:13.5px; }
  .e-cli .nm{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .e-cli .tem-grade{ flex:none; }
  .e-sub{ display:none; }
  .e-gci{ display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--carteira); }
  .e-gci .copiar{ width:24px; height:24px; border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--muted); font-size:10px; }
  .e-mut{ color:var(--muted); font-weight:600; }
  .e-pares{ text-align:center; font-weight:800; }
  .e-pares small{ font-weight:600; color:var(--muted); font-size:11px; }
  .e-cart{ color:var(--carteira); } .e-fat{ color:var(--faturado); }
  .e-quando{ text-align:center; }
  .chip.dia{ height:22px; font-size:11px; background:var(--atencao-bg); border-color:transparent; color:#92400E; }
  .chip.dia.ok{ background:var(--faturado-bg); color:#166534; }
  .estado{ display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:999px; font-size:11.5px; font-weight:800; }
  .estado .pt{ width:7px; height:7px; border-radius:50%; background:currentColor; }
  .st-manter{ background:var(--faturado-bg); color:#15803D; }
  .st-transferir{ background:var(--carteira-bg); color:#1D4ED8; }
  .st-repassar{ background:var(--atencao-bg); color:#B45309; }
  .st-cancelar{ background:var(--erro-bg); color:#B91C1C; }
  .st-fat{ background:var(--sunk); color:var(--muted); }
  .e-seta{ width:28px; height:28px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:11px; transition:transform .2s; justify-self:end; }
  .enc.aberta .e-seta{ transform:rotate(180deg); color:var(--primary); background:rgba(var(--primary-rgb),.1); border-color:transparent; }

  .enc-det{ border-top:1px dashed var(--border); padding:12px 14px 14px; display:grid; gap:12px;
    grid-template-columns:minmax(0,1fr) auto; align-items:start; background:linear-gradient(180deg,rgba(var(--primary-rgb),.03),transparent); }
  .det-info{ display:flex; flex-wrap:wrap; gap:8px; }
  .det-item{ background:#fff; border:1px solid var(--border); border-radius:12px; padding:7px 11px; min-width:96px; }
  .det-item span{ display:block; font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .det-item b{ display:block; font-size:13px; font-weight:800; margin-top:1px; }
  /* grade: as mesmas caixinhas da grade do catálogo — tamanho em cima, pares embaixo */
  .det-grade{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .det-grade .rot, .det-acoes .rot{ font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .gr-caixas{ display:flex; flex-wrap:wrap; gap:8px 14px; }
  .gr-caixa{ display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .gr-tams{ display:flex; gap:4px; flex-wrap:wrap; }
  .gr-t{ width:40px; border-radius:10px; border:1px solid var(--border); background:#fff; text-align:center; padding:3px 0 4px; }
  .gr-t span{ display:block; font-size:10px; font-weight:800; color:var(--primary); line-height:1.2; }
  .gr-t b{ display:block; font-size:14px; font-weight:800; line-height:1.15; }
  .gr-cx{ font-size:11.5px; font-weight:800; color:var(--primary-ink); background:rgba(var(--primary-rgb),.10); border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .gr-cx.solto{ color:var(--muted); background:var(--sunk); border:1px solid var(--border); }
  .tem-grade{ display:inline-flex; align-items:center; gap:4px; margin-left:8px; font-size:10.5px; font-weight:800; color:var(--primary);
    background:rgba(var(--primary-rgb),.10); border-radius:999px; padding:2px 7px; vertical-align:2px; }
  .det-acoes{ display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .det-acoes .rot{ font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .acoes-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .pill{ height:34px; padding:0 13px; border-radius:999px; border:1px solid var(--border); background:#fff; font-size:12.5px; font-weight:800;
    display:inline-flex; align-items:center; gap:6px; }
  .pill i{ font-size:12px; }
  .pill.a-manter i{ color:var(--faturado); } .pill.a-transferir i{ color:var(--carteira); }
  .pill.a-repassar i{ color:var(--atencao); } .pill.a-cancelar i{ color:var(--erro); }
  .pill.on.a-manter{ background:var(--faturado); border-color:var(--faturado); color:#fff; }
  .pill.on.a-transferir{ background:var(--carteira); border-color:var(--carteira); color:#fff; }
  .pill.on.a-repassar{ background:var(--atencao); border-color:var(--atencao); color:#fff; }
  .pill.on.a-cancelar{ background:var(--erro); border-color:var(--erro); color:#fff; }
  .pill.on i{ color:#fff; }
  .det-fat{ font-size:12px; color:var(--muted); font-weight:600; align-self:center; }

  /* ── paleta (canto, discreta) ── */
  .paleta{ position:fixed; left:14px; bottom:14px; z-index:40; display:flex; align-items:center; gap:6px; padding:5px 6px 5px 10px;
    border-radius:999px; background:rgba(255,255,255,.9); backdrop-filter:blur(8px); border:1px solid var(--border);
    box-shadow:0 8px 24px -14px rgba(15,23,42,.35); opacity:.78; transition:opacity .15s; }
  .paleta:hover, .paleta:focus-within{ opacity:1; }
  .paleta > i{ font-size:11px; color:var(--muted); margin-right:2px; }
  .paleta button{ display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 9px 0 4px; border-radius:999px;
    border:1px solid transparent; background:transparent; font-size:11px; font-weight:700; color:var(--muted); }
  .paleta button .sw{ width:20px; height:20px; border-radius:50%; box-shadow:inset 0 0 0 2px rgba(255,255,255,.7); }
  .paleta button.on{ background:#fff; border-color:var(--border); color:var(--text); }
  .paleta button .hex{ font-weight:600; color:var(--faint); }
  .paleta .nome{ max-width:0; overflow:hidden; white-space:nowrap; transition:max-width .2s; display:inline-flex; gap:4px; }
  .paleta:hover .nome, .paleta:focus-within .nome{ max-width:160px; }
  .paleta button{ padding:0 4px; }
  .paleta:hover button, .paleta:focus-within button{ padding:0 9px 0 4px; }
  .toast{ position:fixed; left:50%; bottom:18px; transform:translate(-50%,20px); opacity:0; z-index:50; background:#0F172A; color:#fff;
    font-size:12.5px; font-weight:700; padding:9px 14px; border-radius:999px; transition:all .2s; pointer-events:none; white-space:nowrap; }
  .toast.on{ opacity:1; transform:translate(-50%,0); }

  /* ── tablet: sem colunas; linha compacta ── */
  @media (max-width:1099.98px){
    .cols, .enc-cols{ display:none; }
    .prod-main{ grid-template-columns:56px minmax(0,1fr) auto 36px; column-gap:12px; padding:10px 14px; }
    .thumb{ width:56px; height:56px; }
    .prod-main .d-col{ display:none; }
    .p-sub{ display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
    .p-nums{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
    .p-nums .c-cart{ font-size:17px; }
    .p-nums small{ font-size:11px; color:var(--muted); font-weight:600; }
    .enc-area{ padding:10px 12px 14px; }
    .enc-main{ grid-template-columns:minmax(0,1fr) auto 28px; column-gap:10px; padding:9px 12px; }
    .enc-main .d-col{ display:none; }
    .e-sub{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:3px; font-size:11.5px; color:var(--muted); font-weight:600; }
    .e-dir{ display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
    .enc-det{ grid-template-columns:1fr; }
    .kpis{ grid-template-columns:repeat(5,minmax(140px,1fr)); overflow-x:auto; scrollbar-width:none; scroll-snap-type:x mandatory; }
    .kpis::-webkit-scrollbar{ display:none; }
    .kpi{ scroll-snap-align:start; }
    .acoes-topo .btn .txt{ display:none; }
    .acoes-topo .btn{ width:var(--act-h); padding:0; }
  }
  @media (min-width:1100px){ .p-nums, .e-dir{ display:none; } }

  /* ── celular ── */
  @media (max-width:639.98px){
    .topo-in{ flex-wrap:wrap; padding:10px 14px; gap:10px; }
    .logo{ width:40px; height:40px; border-radius:12px; }
    .marca b{ font-size:16px; }
    :root{ --act-h:38px; }
    .acoes-topo{ gap:6px; flex:1 1 0; min-width:0; margin-left:0; overflow-x:auto; scrollbar-width:none; padding:2px; }
    .acoes-topo::-webkit-scrollbar{ display:none; }
    .acoes-topo .btn{ flex:none; }
    .marca small{ display:none; }
    .busca{ order:3; flex-basis:100%; max-width:none; height:40px; }
    .pagina{ padding:12px 14px 90px; gap:12px; }
    .kpis{ grid-template-columns:repeat(5,minmax(46%,1fr)); gap:8px; }
    .kpi{ padding:11px 12px; gap:10px; border-radius:16px; }
    .kpi .ic{ width:34px; height:34px; border-radius:10px; font-size:14px; }
    .kpi .v{ font-size:20px; }
    .seg button{ padding:0 14px; }
    .filtro .txt-longo{ display:none; }
    .prod{ border-radius:16px; }
    .prod-main{ grid-template-columns:52px minmax(0,1fr) auto 32px; padding:10px 12px; column-gap:10px; }
    .thumb{ width:52px; height:52px; border-radius:12px; }
    .p-nome{ font-size:14px; }
    .abrir{ width:32px; height:32px; }
    .chip{ height:22px; font-size:10.5px; padding:0 7px; }
    .enc-area{ padding:8px 8px 12px; }
    .enc-topo .dica{ display:none; }
    .gr-t{ width:36px; }
    .acoes-pills{ display:grid; grid-template-columns:1fr 1fr; }
    .pill{ justify-content:center; }

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const nf = n => Number(n || 0).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const dia = d => { if (d == null || d < 0 || d > 1e8) return ''; const t = new Date(d * 86400000); return String(t.getUTCDate()).padStart(2,'0') + '/' + MESES[t.getUTCMonth()]; };
const mes = d => { if (d == null || d < 0 || d > 1e8) return ''; const t = new Date(d * 86400000); const m = MESES[t.getUTCMonth()]; return m[0].toUpperCase() + m.slice(1) + '/' + String(t.getUTCFullYear()).slice(2); };
const ESTADO = { MANTER:['st-manter','Manter'], TRANSFERIR:['st-transferir','Transferir'], REPASSAR:['st-repassar','Repassar'], CANCELAR:['st-cancelar','Cancelar'] };
const ACOES = [['MANTER','a-manter','fa-circle-check','Manter'], ['TRANSFERIR','a-transferir','fa-right-left','Transferir'],
               ['REPASSAR','a-repassar','fa-share-from-square','Repassar'], ['CANCELAR','a-cancelar','fa-ban','Cancelar']];
const ST = { aba:'carteira', abertos:new Set([1]), encAbertas:new Set(['1:0']), acoes:{} };

function pintarKpis(){
  const k = DADOS.kpis[ST.aba];
  const conv = (k.conversao * 100).toLocaleString('pt-BR', { minimumFractionDigits:1, maximumFractionDigits:1 }) + '%';
  document.getElementById('kpis').innerHTML = [
    ['k-cart','fa-box-open','Carteira', nf(k.carteira), 'pares'],
    ['k-fat','fa-circle-check','Faturado', nf(k.faturado), 'pares'],
    ['k-conv','fa-percent','Conversão', conv, ''],
    ['k-neutro','fa-shoe-prints','Produtos', nf(k.produtos), ''],
    ['k-neutro','fa-store','Clientes', nf(k.clientes), '']
  ].map(([c, ic, t, v, u]) => `<div class="kpi ${c}"><span class="ic"><i class="fa-solid ${ic}"></i></span>
      <div style="min-width:0"><div class="t">${t}</div><div class="v num">${v}${u ? `<small>${u}</small>` : ''}</div></div></div>`).join('');
}

function gradeDe(p, l){
  if(!l.gci || !DADOS.grades) return null;
  return DADOS.grades[[l.gci, p.ref, String(p.cor).toUpperCase()].join('|')] || null;
}
function gradeHtml(g){
  const tams = t => `<span class="gr-tams">${Object.entries(t).map(([k, v]) => `<span class="gr-t"><span>${esc(k)}</span><b class="num">${v}</b></span>`).join('')}</span>`;
  const caixas = Array.isArray(g.caixas) && g.caixas.length ? g.caixas : [{ tam:g.tam, pares:g.total, solto:true }];
  return `<div class="gr-caixas">${caixas.map(c => {
    const n = Number(c.caixas) || 1;
    const rot = c.solto ? `${nf(c.pares)} pares avulsos` : `${n} ${n > 1 ? 'caixas' : 'caixa'}`;
    return `<span class="gr-caixa">${tams(c.tam)}<span class="gr-cx ${c.solto ? 'solto' : ''}">${rot}</span></span>`;
  }).join('')}</div>`;
}

const linhasDaAba = p => p.linhas.filter(l => ST.aba === 'tudo' || (ST.aba === 'carteira' ? l.cart > 0 : l.fat > 0));

function encHtml(p, pi, l, li){
  const id = pi + ':' + li;
  const aberta = ST.encAbertas.has(id);
  const emCart = l.cart > 0;
  const acao = ST.acoes[id] || 'MANTER';
  const [stc, stt] = emCart ? ESTADO[acao] : ['st-fat', 'Faturado'];
  const quando = emCart ? dia(l.prev) : dia(l.dfat);
  const dataChip = quando ? `<span class="chip dia ${emCart ? '' : 'ok'}"><i class="fa-solid ${emCart ? 'fa-calendar-day' : 'fa-circle-check'}"></i>${quando}</span>` : '<span class="e-mut">—</span>';
  const ocNf = l.oc || (l.nf ? 'NF ' + l.nf : '—');
  const pares = emCart ? l.cart : l.fat;
  // faturada sem grade não tem o que abrir: fica sem seta e sem clique
  const abre = emCart || !!gradeDe(p, l);
  return `<div class="enc ${aberta && abre ? 'aberta' : ''} ${emCart ? '' : 'faturada'} ${abre ? '' : 'sem-abrir'}" data-enc="${id}">
    <div class="enc-main" ${abre ? `role="button" tabindex="0" aria-expanded="${aberta}"` : ''}>
      <span class="e-cod d-col num">${esc(l.cod)}</span>
      <div style="min-width:0">
        <div class="e-cli"><span class="nm">${esc(l.cli)}</span>${gradeDe(p, l) ? '<span class="tem-grade"><i class="fa-solid fa-table-cells"></i>Grade</span>' : ''}</div>
        <div class="e-sub"><span class="num">${esc(l.cod)}</span>${l.gci ? `<span>· GCI <b class="num" style="color:var(--carteira)">${l.gci}</b></span>` : ''}<span>· ${esc(l.prep)}</span></div>
      </div>
      <span class="d-col">${l.gci ? `<span class="e-gci num"><button class="copiar" title="Copiar GCI" data-copiar><i class="fa-regular fa-copy"></i></button>${l.gci}</span>` : '<span class="e-mut">—</span>'}</span>
      <span class="d-col e-mut num">${esc(ocNf)}</span>
      <span class="d-col e-mut">${esc(l.prep)}</span>
      <span class="d-col e-pares e-cart num">${l.cart ? nf(l.cart) + ' <small>pares</small>' : '<span class="zero">—</span>'}</span>
      <span class="d-col e-pares e-fat num">${l.fat ? nf(l.fat) + ' <small>pares</small>' : '<span class="zero">—</span>'}</span>
      <span class="d-col e-quando">${dataChip}</span>
      <span class="d-col"><span class="estado ${stc}"><span class="pt"></span>${stt}</span></span>
      <div class="e-dir"><span class="e-pares ${emCart ? 'e-cart' : 'e-fat'} num">${nf(pares)} <small>pares</small></span>${dataChip}</div>
      ${abre ? '<span class="e-seta"><i class="fa-solid fa-chevron-down"></i></span>' : '<span></span>'}
    </div>
    ${aberta && abre ? `<div class="enc-det">
      ${gradeDe(p, l) ? `<div class="det-grade"><span class="rot">Grade</span>${gradeHtml(gradeDe(p, l))}</div>` : '<div></div>'}
      ${emCart ? `<div class="det-acoes"><span class="rot">Ação da encomenda</span><div class="acoes-pills">
        ${ACOES.map(([a, c, ic, t]) => `<button class="pill ${c} ${acao === a ? 'on' : ''}" data-acao="${a}"><i class="fa-solid ${ic}"></i>${t}</button>`).join('')}
      </div></div>` : ''}
    </div>` : ''}
  </div>`;
}

function prodHtml(p, pi){
  const v = p.vis[ST.aba];
  const aberto = ST.abertos.has(pi);
  const linhas = linhasDaAba(p);
  const prev = mes(p.prev);
  return `<article class="prod ${aberto ? 'aberto' : ''}" data-prod="${pi}">
    <div class="prod-main" role="button" tabindex="0" aria-expanded="${aberto}">
      <div class="thumb"><img src="../imagens_olympikus/${esc(p.foto)}.jpg" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fa-solid fa-image'}))"></div>
      <div style="min-width:0">
        <div class="p-nome">${esc(p.nome)}</div>

          <span class="chip cor"><i class="fa-solid fa-palette"></i>${esc(p.cor)}</span>
          ${prev ? `<span class="chip mes"><i class="fa-regular fa-calendar"></i>${prev}</span>` : ''}
          <span class="chip art num">${nf(v.clientes)} cli · ${nf(v.encomendas)} enc</span>
        </div>
      </div>
      <span class="d-col"><span class="chip cor"><i class="fa-solid fa-palette"></i>${esc(p.cor)}</span></span>

      <span class="d-col">${prev ? `<span class="chip mes"><i class="fa-regular fa-calendar"></i>${prev}</span>` : '—'}</span>
      <span class="d-col c-num num">${nf(v.clientes)}</span>
      <span class="d-col c-num fraco num">${nf(v.encomendas)}</span>
      <span class="d-col c-cart num ${v.carteira ? '' : 'zero'}">${nf(v.carteira)}</span>
      <span class="d-col c-fat num ${v.faturado ? '' : 'zero'}">${nf(v.faturado)}</span>
      <div class="p-nums">
        ${ST.aba === 'faturado' ? `<span class="c-fat num">${nf(v.faturado)}</span><small>faturado</small>`
          : `<span class="c-cart num ${v.carteira ? '' : 'zero'}">${nf(v.carteira)}</span><small>${v.faturado && ST.aba === 'tudo' ? nf(v.faturado) + ' fat.' : 'em carteira'}</small>`}
      </div>
      <span class="abrir"><i class="fa-solid fa-chevron-down"></i></span>
    </div>
    ${aberto ? `<div class="enc-area">
      <div class="enc-topo">
        <span class="chip num"><i class="fa-solid fa-receipt"></i>${nf(v.encomendas)} encomendas</span>
        <span class="chip num"><i class="fa-solid fa-store"></i>${nf(v.clientes)} clientes</span>
        <span class="chip art num">Art. <b>${esc(p.ref)}</b></span>
        <span class="dica">Toque numa encomenda para ver os detalhes e as ações</span>
      </div>
      <div class="enc-cols" aria-hidden="true"><span>Código</span><span>Cliente</span><span>GCI</span><span>OC / NF</span><span>Preposto</span>
        <span>Carteira</span><span>Faturado</span><span>Prev. / fat.</span><span>Situação</span><span></span></div>
      <div class="enc-lista">${linhas.length ? linhas.map(l => encHtml(p, pi, l, p.linhas.indexOf(l))).join('')
        : '<div class="e-mut" style="padding:10px 4px">Nenhuma encomenda nesta aba.</div>'}</div>
      ${linhas.length < v.encomendas ? `<div class="e-mut num" style="padding:10px 4px 0;font-size:12px">Mostrando ${linhas.length} de ${nf(v.encomendas)} encomendas nesta prévia.</div>` : ''}
    </div>` : ''}
  </article>`;
}

function pintarLista(){
  const lista = DADOS.produtos.map((p, i) => [p, i]).filter(([p]) => p.vis[ST.aba].encomendas > 0);
  document.getElementById('lista').innerHTML = lista.map(([p, i]) => prodHtml(p, i)).join('');
}
function pintar(){ pintarKpis(); pintarLista(); }

let _t;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(_t); _t = setTimeout(() => t.classList.remove('on'), 1800); }

document.getElementById('abas').addEventListener('click', e => {
  const b = e.target.closest('[data-aba]'); if(!b) return;
  ST.aba = b.dataset.aba;
  document.querySelectorAll('#abas button').forEach(x => x.classList.toggle('on', x === b));
  pintar();
});
document.getElementById('lista').addEventListener('click', e => {
  if(e.target.closest('[data-copiar]')){ e.stopPropagation(); toast('GCI copiado (prévia)'); return; }
  const ac = e.target.closest('[data-acao]');
  if(ac){ const id = ac.closest('[data-enc]').dataset.enc; ST.acoes[id] = ac.dataset.acao; pintarLista(); toast('Prévia: nada é gravado'); return; }
  const em = e.target.closest('.enc:not(.sem-abrir) .enc-main');
  if(em){ const id = em.closest('[data-enc]').dataset.enc; ST.encAbertas.has(id) ? ST.encAbertas.delete(id) : ST.encAbertas.add(id); pintarLista(); return; }
  const pm = e.target.closest('.prod-main');
  if(pm){ const i = Number(pm.closest('[data-prod]').dataset.prod); ST.abertos.has(i) ? ST.abertos.delete(i) : ST.abertos.add(i); pintarLista(); }
});
document.getElementById('lista').addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('.enc-main, .prod-main')){ e.preventDefault(); e.target.click(); }
});
document.querySelector('.paleta').addEventListener('click', e => {
  const b = e.target.closest('[data-cor]'); if(!b) return;
  document.documentElement.dataset.cor = b.dataset.cor;
  document.querySelectorAll('.paleta button').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('.topo .btn, .barra .filtro, .barra .btn.icone').forEach(b => b.addEventListener('click', () => toast('Prévia: esse botão só mostra o visual')));
const medirTopo = () => document.documentElement.style.setProperty('--topo-h', document.querySelector('.topo').offsetHeight + 'px');
medirTopo(); addEventListener('resize', medirTopo);
pintar();
</script>
</body>
</html>
