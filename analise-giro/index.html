async function abrirCliente(id){
  guardar('cliente', id);
  $('tabela').innerHTML = '<div class="empty">Carregando…</div>';
  try{
    const r = await fetch(`dados/${encodeURIComponent(id)}.json` + bust(), { cache:'no-cache' });
    E.base = await r.json();
  }catch(_){
    $('tabela').innerHTML = '<div class="empty">Não foi possível carregar os dados deste cliente.</div>';
    return;
  }
  E.sel = null; E.marca = ''; E.genero = ''; E.rolou = false; E.comCart = false; E.soAlerta = false;
  // abre sempre pela venda do mês mais recente, do maior para o menor
  E.ordem = { k:'v:' + E.base.meses[E.base.meses.length - 1], dir:-1 };
  E.cart = null; E.cartInfo = null; E.cartErro = false; E.faixaSel.clear(); E.pdvSel.clear(); E.faixas = {};
  E.base.produtos.forEach(p => { p.c = null; });
  E.linhas = E.base.produtos;
  const c = E.base.cliente;
  pintarBotaoMarca();
  $('eyebrow').textContent = `· ${c.lojas} ${c.lojas === 1 ? 'loja' : 'lojas'} · vendedor ${c.vendedor}`;
  $('tituloCod').textContent = ' - ' + c.codigo;
  $('tituloNome').textContent = c.nome;
  document.title = `${c.nome} ${MARCAS_CFG[MARCA].curto} · Análise de Giro`;
  const generos = [...new Set(E.base.produtos.map(p => p.genero).filter(Boolean))].sort();
  $('genero').innerHTML = '<option value="">Todos os gêneros</option>' +
    generos.map(g => `<option value="${esc(g)}">${esc(g.charAt(0) + g.slice(1).toLowerCase())}</option>`).join('');
  // a carteira guardada no aparelho entra já na primeira pintura: a tabela
  // aparece uma vez só, completa, em vez de redesenhar quando ela chega
  E.obs = (await cacheLer('obs:' + c.id)) || {};
  const guardado = await cacheLer('cart:' + c.id);
  if(E.base.cliente.id !== c.id) return;
  if(cartValida(guardado, c, E.base.ano)){
    E.cart = guardado.itens; E.faixas = guardado.faixas || {}; E.cartInfo = guardado;
    juntarCarteira();
  }
  rodape();
  pintar();
  medirCab();
  pintarClientes();
  carregarLojas(c);
  carregarCarteira(c, guardado);
}

/* ── loja a loja: quais produtos têm dado ────────────────────────────── */
/* A tela por loja é um arquivo à parte, gerado do banco do cliente. A AG só
   precisa saber quem está lá dentro, para não mandar ninguém abrir uma tela
   vazia — o arquivo chega depois da tabela, sem segurar a pintura. */
async function carregarLojas(c){
  E.lojasK = null; E.lojasFalta = {}; E.lojasNao = false;
  try{
    const r = await fetch(`dados/lojas-${encodeURIComponent(c.id)}.json` + bust(), { cache:'no-cache' });
    if(!r.ok) throw new Error('sem arquivo de lojas');
    const d = await r.json();
    if(!E.base || E.base.cliente.id !== c.id) return;
    E.lojasK = new Set((d.produtos || []).map(p => p.k));
    E.lojasFalta = d.faltando || {};
  }catch(_){
    if(!E.base || E.base.cliente.id !== c.id) return;
    E.lojasK = null; E.lojasNao = true;
  }
  pintar();
}

/* ── carteira (Detalhada) ────────────────────────────────────────────── */
/* A carteira vem da Detalhada, que o script diário publica no worker: assim
   ela está sempre em dia, sem depender de regerar o plano. A base tem 3 MB,
   então o aparelho guarda só o recorte do cliente e pergunta ao worker se a
   base mudou (o resumo tem poucos bytes) antes de baixar de novo. */
const WORKER_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev/';
const DET_VERSAO = 1;   // ordem dos campos da linha da Detalhada (v1)
const DC = { CLI:1, MARCA:2, REF:5, COR:6, GCI:7, NF:8, PREV:10, CART:11, FAT:12, DFAT:13, FAIXA:14 };
// marca da Detalhada → marca do plano. UA fica de fora: o plano é Olympikus.
const MARCA_DET = MARCAS_CFG[MARCA].det;
// "PTO/PT", "PTO_PT" e "PTO / PT" são a mesma cor
const chaveCor = c => norm(c).replace(/\s*[\/_]\s*/g, '/').trim();

async function chamarWorker(action, ms){
  for(let tentativa = 1; tentativa <= 2; tentativa++){
    const corta = new AbortController();
    const t = setTimeout(() => corta.abort(), ms);
    try{
      const r = await fetch(WORKER_URL, { method:'PATCH', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ action }), signal: corta.signal });
      if(!r.ok) throw new Error('worker ' + r.status);
      return await r.json();
    }catch(e){
      // o worker às vezes responde 503 ao montar a base inteira; é passageiro
      if(tentativa === 2) throw e;
      await new Promise(ok => setTimeout(ok, 1500));
    }finally{ clearTimeout(t); }
  }
}

function abrirDB(){
  return new Promise((ok, falha) => {
    const r = indexedDB.open('analise-giro', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result);
    r.onerror = () => falha(r.error);
  });
}
async function cacheLer(chave){
  try{
    const db = await abrirDB();
    return await new Promise(ok => {
      const q = db.transaction('kv').objectStore('kv').get(chave);
      q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null);
    });
  }catch(_){ return null; }
}
async function cacheSalvar(chave, valor){
  try{
    const db = await abrirDB();
    db.transaction('kv', 'readwrite').objectStore('kv').put(valor, chave);
  }catch(_){}
}

// Pedido por referência + cor e mês do ano: f = já faturado, a = em aberto.
// O mês é o da previsão de faturamento, que é como a planilha organiza.
function extrairCarteira(base, codigos, ano){
  const clis = new Set();
  base.dic.cli.forEach((c, i) => { if(codigos.includes(String(c[0]))) clis.add(i); });
  const itens = {};
  // A faixa (CORRE, MEIA OLY, CONF_FEM…) é do produto, não do cliente: vale
  // a linha de qualquer um, e assim cobre mais artigos.
  const faixas = {};
  const temFaixa = Array.isArray(base.dic.faixa) && base.dic.faixa.length;
  for(const l of base.l){
    if(temFaixa){
      const i = l[DC.FAIXA];
      if(i != null && i >= 0){
        const ref = (base.dic.ref[l[DC.REF]] || [''])[0];
        if(ref && !faixas[ref]) faixas[ref] = base.dic.faixa[i];
      }
    }
    if(!clis.has(l[DC.CLI])) continue;
    const marca = MARCA_DET[base.dic.marca[l[DC.MARCA]]];
    if(!marca) continue;
    const dia = l[DC.PREV] >= 0 ? l[DC.PREV] : l[DC.DFAT];
    if(dia < 0) continue;
    const d = new Date(dia * 864e5);
    if(d.getUTCFullYear() !== ano) continue;
    const mes = `${ano}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`;
    const [ref, desc] = base.dic.ref[l[DC.REF]] || ['', ''];
    const cor = String(base.dic.cor[l[DC.COR]] || '').toUpperCase();
    const k = ref + '|' + chaveCor(cor);
    const it = itens[k] || (itens[k] = { ref, cor, desc, marca, m:{} });
    const x = it.m[mes] || (it.m[mes] = { f:0, a:0, n:[] });
    // guarda também de onde vem cada pedaço: nota e data no faturado, GCI e
    // previsão no que está em aberto. É o que o balão da célula mostra.
    if(l[DC.CART] > 0){
      x.a += l[DC.CART];
      x.n.push({ t:'a', q:l[DC.CART], gci:l[DC.GCI] || 0, d:l[DC.PREV] });
    }else if(l[DC.FAT] > 0){
      x.f += l[DC.FAT];
      x.n.push({ t:'f', q:l[DC.FAT], nf:l[DC.NF] || 0, d:l[DC.DFAT] });
    }
  }
  return { itens, faixas };
}

const temAberto = p => !!p.c && Object.values(p.c).some(x => x.a > 0);

/* ── o faturado já chegou ao estoque do cliente? ─────────────────────
   O plano traz venda e estoque de cada mês, e daí sai o que entrou:
       entrada = estoque do mês − estoque do mês anterior + venda do mês
   (é a mesma conta de "Entradas e saídas" da Detalhada). Somando as
   entradas do mês do faturamento em diante e comparando com o que foi
   faturado, dá para dizer se a mercadoria chegou. Metade já conta como
   chegou: devolução, ajuste de inventário e faturamento partido entre dois
   meses fariam um limiar cheio errar quase sempre. */
const PARTE_CHEGOU = 0.5;
function entradasDe(p){
  if(!p._ent){
    const meses = E.base.meses;
    p._ent = {};
    let antes = null;
    meses.forEach(m => {
      const x = p.m[m] || {};
      const e = x.e || 0, v = x.v || 0;
      // no primeiro mês não há estoque anterior: o que estava lá conta como
      // já estando na casa, não como entrada
      p._ent[m] = antes === null ? 0 : (e - antes + v);
      antes = e;
    });
  }
  return p._ent;
}
// devolve { chegou, entrou, mes } para o que foi faturado naquele mês
function chegadaDe(p, mes, faturado){
  // dois motivos diferentes para não dar para conferir: o produto não existe
  // no plano (linha que só veio da carteira) ou o mês ainda não foi lançado
  if(!faturado || p.soCart) return { chegou:false, entrou:0, mes:null, motivo: p.soCart ? 'produto' : null };
  const meses = E.base.meses;
  const i = meses.indexOf(mes);
  if(i < 0) return { chegou:false, entrou:0, mes:null, motivo:'mes' };
  const ent = entradasDe(p);
  const alvo = faturado * PARTE_CHEGOU;
  let soma = 0, quando = null;
  for(let j = i; j < meses.length; j++){
    soma += Math.max(0, ent[meses[j]] || 0);
    if(!quando && soma >= alvo) quando = meses[j];
  }
  return { chegou: soma >= alvo, entrou: Math.round(soma), mes: quando, motivo:null };
}

/* ── OBS ─────────────────────────────────────────────────────────────
   A OBS do mês mais recente pode ser escrita aqui. A da planilha continua
   valendo enquanto ninguém escrever por cima; o que é escrito fica no
   aparelho (IndexedDB) e leva um ponto ao lado, para não se confundir com
   o que veio do plano de contas. */
const obsDoPlano = (p, mes) => (p.m[mes] || {}).o || (p.soCart ? 'CARTEIRA' : '');
const obsEditada = p => E.obs[p.k];
function obsEfetiva(p, mes){
  const e = obsEditada(p);
  return e === undefined ? obsDoPlano(p, mes) : e;
}
async function guardarObs(cli){
  try{ await cacheSalvar('obs:' + cli, { ...E.obs }); }catch(_){}
}

// Casa a carteira com os produtos do plano. O que tem pedido em aberto e não
// está no plano entra como linha nova ("só carteira"); se o artigo já existe
// em outra cor, herda dele descrição, gênero, PDV e marca.
const SEM_FAIXA = 'Sem faixa';
function juntarCarteira(){
  const B = E.base;
  const faixaDe = cod => (E.faixas || {})[cod] || SEM_FAIXA;
  const porChave = new Map(), porCodigo = new Map();
  B.produtos.forEach(p => {
    p.c = null;
    p.faixa = faixaDe(p.codigo);
    porChave.set(p.codigo + '|' + chaveCor(p.cor), p);
    if(!porCodigo.has(p.codigo)) porCodigo.set(p.codigo, p);
  });
  const novos = [];
  Object.values(E.cart || {}).forEach(it => {
    const k = it.ref + '|' + chaveCor(it.cor);
    const p = porChave.get(k);
    if(p){ p.c = it.m; return; }
    if(!Object.values(it.m).some(x => x.a > 0)) return;
    const irmao = porCodigo.get(it.ref);
    novos.push({ k:'cart:' + k, marca: irmao ? irmao.marca : it.marca, codigo: it.ref,
      descricao: irmao ? irmao.descricao : it.desc, cor: it.cor, genero: irmao ? irmao.genero : '',
      grupo:'', pdv: irmao ? irmao.pdv : null, codCliente:'', m:{}, c: it.m, soCart:true,
      faixa: faixaDe(it.ref) });
  });
  E.linhas = B.produtos.concat(novos);
}

const codigosDe = cli => ((cli.codigos && cli.codigos.length) ? cli.codigos : [cli.codigo]).map(String);
// Versão do recorte guardado. Mudou o que se extrai da Detalhada (faixa,
// notas fiscais), sobe este número: o que está no aparelho é refeito, em vez
// de ficar valendo um recorte sem a informação nova.
const CART_V = 3;
// o recorte guardado só vale para os mesmos códigos, o mesmo ano e a versão
const cartValida = (g, cli, ano) => !!g && g.v === CART_V && g.codigos === codigosDe(cli).join(',') && g.ano === ano;
const UM_DIA = 864e5;
const RESERVA = '../detalhada/dados/detalhada.json';

// A carteira guardada já entra na primeira pintura (quem chama instala antes
// de pintar); aqui só se confere, em segundo plano, se há base mais nova.
async function carregarCarteira(cli, guardado){
  const codigos = codigosDe(cli);
  const ano = E.base.ano;
  const chave = 'cart:' + cli.id;
  const valido = cartValida(guardado, cli, ano);
  const instalar = pacote => {
    if(!E.base || E.base.cliente.id !== cli.id) return;   // trocou de cliente no meio
    const w = $('tabela');
    const noFim = !E.cart || w.scrollLeft + w.clientWidth >= w.scrollWidth - 8;
    E.cart = pacote.itens; E.faixas = pacote.faixas || {}; E.cartInfo = pacote; E.cartErro = false;
    juntarCarteira();
    if(noFim) E.rolou = false;
    pintar(); rodape();
  };
  try{
    const info = await chamarWorker('getDetalhadaInfo', 8000);
    if(!info || !info.gerado) throw new Error('sem base publicada');
    if(valido && guardado.gerado === info.gerado) return;
    const base = await chamarWorker('getDetalhada', 45000);
    if(!base || base.v !== DET_VERSAO || !Array.isArray(base.l)) throw new Error('base inválida');
    const pacote = { v:CART_V, gerado: base.gerado || info.gerado, codigos: codigos.join(','), ano,
                     ...extrairCarteira(base, codigos, ano), salvoEm: Date.now() };
    cacheSalvar(chave, pacote);
    instalar(pacote);
  }catch(e){
    console.warn('carteira: worker indisponível, tentando a cópia do repositório', e);
    // Reserva: a cópia da Detalhada que fica no repositório. Envelhece, mas
    // é melhor que nada — e é o que funciona fora do site publicado (o
    // worker só atende o github.io). Só entra se for mais nova que o cache.
    // São 3 MB: antes de baixar, uma pergunta de cabeçalho (HEAD) diz se a
    // cópia mudou; sem ela, o limite é um dia.
    try{
      let marca = null;
      try{
        const h = await fetch(RESERVA, { method:'HEAD', cache:'no-cache' });
        if(h.ok) marca = h.headers.get('etag') || h.headers.get('last-modified');
      }catch(_){}
      if(valido && (marca ? guardado.marcaReserva === marca
                          : Date.now() - (guardado.salvoEm || 0) < UM_DIA)) return;
      const r = await fetch(RESERVA, { cache:'no-cache' });
      const base = r.ok ? await r.json() : null;
      if(!base || base.v !== DET_VERSAO || !Array.isArray(base.l)) throw new Error('reserva inválida');
      if(valido && String(guardado.gerado) >= String(base.gerado)){
        // conferido: não há nada mais novo nessa cópia
        cacheSalvar(chave, { ...guardado, salvoEm: Date.now(), marcaReserva: marca });
        return;
      }
      const pacote = { v:CART_V, gerado: base.gerado, codigos: codigos.join(','), ano,
                       ...extrairCarteira(base, codigos, ano), reserva:true,
                       salvoEm: Date.now(), marcaReserva: marca };
      cacheSalvar(chave, pacote);
      instalar(pacote);
    }catch(e2){
      console.warn('carteira: Detalhada indisponível', e2);
      if(!valido && E.base && E.base.cliente.id === cli.id){ E.cartErro = true; rodape(); }
    }
  }
}

function rodape(){
  const B = E.base; if(!B) return;
  const quando = d => `${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })}`;
  const cart = E.cartInfo ? ` · Carteira: Detalhada de ${quando(new Date(E.cartInfo.gerado))}${E.cartInfo.reserva ? ' (cópia de reserva)' : ''}`
             : E.cartErro ? ' · Carteira indisponível agora (Detalhada fora do ar)'
             : ' · Carregando a carteira…';
  $('rodape').innerHTML = `Fonte: ${esc(B.fonte)} · atualizado em ${quando(new Date(B.atualizadoEm))}${esc(cart)}.` +
    `<span class="det"> Cobertura = estoque ÷ venda do mês, em meses. ` +
    `Carteira: verde forte = em aberto, verde leve = faturado sem chegar, ` +
    `azul = faturado e já no estoque, âmbar = faturamento parcial. ` +
    `Clique na célula para ver as notas.</span>`;
}

/* ── filtros ─────────────────────────────────────────────────────────── */
$('busca').oninput = () => {
  E.busca = $('busca').value;
  $('buscaWrap').classList.toggle('tem', !!E.busca);
  pintar();
};
$('busca').addEventListener('keydown', e => { if(e.key === 'Escape'){ $('busca').value = ''; $('busca').oninput(); } });
$('buscaLimpa').onclick = () => { $('busca').value = ''; $('busca').oninput(); $('busca').focus(); };
$('genero').onchange = e => { E.genero = e.target.value; pintar(); };

/* Busca exata. Duas ou mais palavras valem como expressão: elas têm de vir
   emendadas, na ordem, em algum campo do produto. É o que separa o "CORRE 5"
   da "BERMUDA CORRE FOCO 5 M" — nela as duas palavras existem, mas longe uma
   da outra. Número curto só casa inteiro, então "corre 5" não traz o Corre 4
   nem o Corre 50 Anos. A vírgula refina: o que vem depois filtra dentro do
   resultado ("corre 5, pto" = Corre 5 nas cores PTO). */
const SEP_GROSSO = /[\s,;:()+]+/;
const SEP_FINO = /[\s\/\-_.,;:()+]+/;
// Cada campo vira uma lista de palavras, e a cor entra também inteira
// ("PTO/CH"), para "pto/ch" casar com ela e não com o CHallenger.
function palavrasDe(p){
  if(!p._c){
    const corte = t => norm(t).split(SEP_FINO).filter(Boolean);
    p._c = [corte(p.descricao), corte(p.cor), corte(p.codigo), corte(p.codCliente),
            [norm(p.cor).trim()].filter(Boolean)];
    p._d = p._c[0];
  }
  return p;
}
// um termo casa com uma palavra: número curto só inteiro, o resto pelo começo
const casaPalavra = (w, t) => /^\d{1,3}$/.test(t) ? w === t : w.startsWith(t);
// a expressão inteira tem de caber emendada numa das listas
function casaGrupo(p, termos){
  if(termos.length === 1){
    const t = termos[0];
    return p._c.some(lista => lista.some(w => casaPalavra(w, t)));
  }
  return p._c.some(lista => {
    for(let i = 0; i + termos.length <= lista.length; i++)
      if(termos.every((t, j) => casaPalavra(lista[i + j], t))) return true;
    return false;
  });
}
// a vírgula separa os grupos; dentro do grupo, os espaços
function gruposDaBusca(txt){
  return norm(txt).split(/[,;]+/)
    .map(g => g.split(SEP_GROSSO).filter(Boolean))
    .filter(g => g.length);
}
const casaBusca = (p, grupos) => (palavrasDe(p), grupos.every(g => casaGrupo(p, g)));

function filtrados(){
  const grupos = gruposDaBusca(E.busca);
  return E.linhas.filter(p => {
    if(E.comCart && !temAberto(p)) return false;
    if(E.faixaSel.size && !E.faixaSel.has(valorFaixa(p))) return false;
    if(E.pdvSel.size && !E.pdvSel.has(valorPdv(p))) return false;
    if(E.soAlerta && !pedeAcao(p)) return false;
    if(E.marca && p.marca !== E.marca) return false;
    if(E.genero && p.genero !== E.genero) return false;
    if(grupos.length && !casaBusca(p, grupos)) return false;
    return true;
  });
}

/* ── pintura ─────────────────────────────────────────────────────────── */
function pintar(){
  const B = E.base;
  const meses = B.meses;
  const ult = meses[meses.length - 1];
  let lista = filtrados();

  // chips de marca, com a contagem do que os outros filtros deixam — a
  // busca também conta: com "corre 5" na busca, o número é o dos corre 5
  const gruposChip = gruposDaBusca(E.busca);
  const naBusca = p => !gruposChip.length || casaBusca(p, gruposChip);
  const naFaixa = p => (!E.faixaSel.size || E.faixaSel.has(valorFaixa(p))) &&
                       (!E.pdvSel.size || E.pdvSel.has(valorPdv(p)));
  const semMarca = E.linhas.filter(p => (!E.genero || p.genero === E.genero) && (!E.comCart || temAberto(p)) && naFaixa(p) && naBusca(p));
  const marcas = [...new Set(E.linhas.map(p => p.marca))].sort();
  $('marcas').innerHTML = `<button class="chip${E.marca ? '' : ' on'}" data-marca="">Todas<span class="n">${nf(semMarca.length)}</span></button>` +
    marcas.map(m => `<button class="chip${E.marca === m ? ' on' : ''}" data-marca="${esc(m)}">${esc(MARCAS[m] || m)}` +
      `<span class="n">${nf(semMarca.filter(p => p.marca === m).length)}</span></button>`).join('') +
    (E.cart ? (() => {
      // o número do chip é o que ainda não faturou, em pares — não a
      // quantidade de produtos
      const comCart = E.linhas.filter(p => (!E.genero || p.genero === E.genero) && (!E.marca || p.marca === E.marca) && temAberto(p) && naFaixa(p) && naBusca(p));
      const pares = comCart.reduce((s, p) => s + Object.values(p.c || {}).reduce((t, x) => t + x.a, 0), 0);
      return `<button class="chip kchip${E.comCart ? ' on' : ''}" id="chipCart" ` +
        `title="${nf(pares)} pares ainda não faturados, em ${nf(comCart.length)} produtos">Em aberto<span class="n">${nf(pares)}</span></button>`;
    })() : '');
  $('marcas').querySelectorAll('[data-marca]').forEach(b => b.onclick = () => { E.marca = b.dataset.marca; pintar(); });
  if($('chipCart')) $('chipCart').onclick = () => { E.comCart = !E.comCart; pintar(); };
  pintarFiltros();

  // carteira do ano: meses por semestre. O 1º semestre recolhe numa coluna
  // (1S26) — por padrão quando já passou; a escolha da pessoa é lembrada.
  const ano2 = String(B.ano).slice(2);
  const mesesAno = Array.from({ length:12 }, (_, i) => `${B.ano}-${String(i + 1).padStart(2, '0')}`);
  const S1 = mesesAno.slice(0, 6), S2 = mesesAno.slice(6);
  const hoje = new Date();
  const s1Passou = hoje.getFullYear() > B.ano || (hoje.getFullYear() === B.ano && hoje.getMonth() >= 6);
  const s1Aberto = E.s1 === null ? !s1Passou : E.s1 === '1';
  const kTot = (p, ms) => ms.reduce((s, m) => { const x = (p.c || {})[m]; return s + (x ? x.f + x.a : 0); }, 0);

  // ordenação
  const val = p => {
    const k = E.ordem.k;
    if(k === 'codigo' || k === 'descricao' || k === 'cor' || k === 'genero' || k === 'codCliente' || k === 'faixa') return String(p[k] || '');
    if(k === 'pdv') return p.pdv || 0;
    if(k === 'venda') return meses.reduce((s, m) => s + ((p.m[m] || {}).v || 0), 0);
    if(k === 'ks:1') return kTot(p, S1);
    if(k === 'ks:2') return kTot(p, S2);
    const [tipo, mes] = k.split(':');
    const x = p.m[mes] || {};
    if(tipo === 'v') return x.v || 0;
    if(tipo === 'e') return x.e || 0;
    if(tipo === 'c'){ const c = cobertura(x.v || 0, x.e || 0); return c === null ? -1 : c === Infinity ? 1e9 : c; }
    if(tipo === 'o') return obsEfetiva(p, mes);
    if(tipo === 'k') return kTot(p, [mes]);
    return 0;
  };
  lista.sort((a, b) => {
    const x = val(a), y = val(b);
    return (typeof x === 'string' ? x.localeCompare(y, 'pt-BR', { numeric:true }) : x - y) * E.ordem.dir;
  });

  // KPIs do mês mais recente e do ano
  const soma = (m, c) => lista.reduce((s, p) => s + ((p.m[m] || {})[c] || 0), 0);
  const vUlt = soma(ult, 'v'), eUlt = soma(ult, 'e');
  const vAno = meses.reduce((s, m) => s + soma(m, 'v'), 0);
  const cUlt = cobertura(vUlt, eUlt);
  $('kpis').innerHTML = [
    ['Produtos', nf(lista.length), ''],
    [`Venda ${rotuloMes(ult)}`, nf(vUlt), ''],
    [`Estoque ${rotuloMes(ult)}`, nf(eUlt), ''],
    ['Cobertura', cobTexto(cUlt) + (cUlt !== null && cUlt !== Infinity ? ' m' : ''), cobClasse(cUlt)],
    [`Venda ${B.ano}`, nf(vAno), ''],
    ['Média/mês', nf(Math.round(vAno / meses.length)), ''],
    ...(E.cart ? [['Carteira aberta', nf(lista.reduce((s, p) => s + Object.values(p.c || {}).reduce((t, x) => t + x.a, 0), 0)), '']] : []),
  ].map(([l, v, cls]) => `<div class="kpi"><div class="l">${l}</div><div class="v ${cls}">${v}</div></div>`).join('');

  if(!lista.length){
    $('tabela').innerHTML = '<div class="empty">Nenhum produto com esses filtros.</div>';
    return;
  }

  // cabeçalho
  const th = (k, txt, cls = '', extra = '') => {
    const ativo = E.ordem.k === k;
    return `<th class="${cls}${ativo ? ' ord' + (E.ordem.dir > 0 ? ' asc' : '') : ''}" data-ord="${k}" ${extra}>${txt}</th>`;
  };
  // o sino no cabeçalho filtra quem precisa de ação — é o caminho curto
  // para varrer a vitrine só do que está apertado
  const botaoAlerta = () => {
    const n = E.linhas.filter(p => pedeAcao(p)).length;
    if(!n && !E.soAlerta) return '';
    return `<button type="button" class="sino cab${E.soAlerta ? ' on' : ''}" id="btnAlerta" ` +
      `title="${E.soAlerta ? 'Mostrar todos os produtos' : `Só os ${nf(n)} com cobertura até ${cobTexto(COB_ALERTA)} e sem carteira`}" ` +
      `aria-pressed="${E.soAlerta}">${ICONE_SINO}</button>`;
  };
  const seta = `<button type="button" class="btn-extras" id="btnExtras"
      title="${E.extras ? 'Ocultar' : 'Mostrar'} gênero, faixa e código do cliente"
      aria-label="${E.extras ? 'Ocultar' : 'Mostrar'} gênero, faixa e código do cliente"
      aria-expanded="${E.extras}">${E.extras ? '‹' : '›'}</button>`;
  let h1 = th('codigo', 'Código', 'roxo fx1', 'rowspan="2"') + th('descricao', 'Descrição', 'roxo fx2', 'rowspan="2"') +
           th('cor', 'Cor', 'roxo fx3', 'rowspan="2"') +
           th('pdv', `<span class="cor-cab">PDV${seta}</span>`, 'roxo fx4', 'rowspan="2"') +
           (E.extras ? th('genero', 'Gênero', 'roxo', 'rowspan="2"') +
                       th('faixa', 'Faixa', 'roxo', 'rowspan="2"') +
                       th('codCliente', 'Cód. cliente', 'roxo', 'rowspan="2"') : '');
  let h2 = '';
  // Cob. e OBS só no mês mais recente: nos anteriores é histórico, e a
  // decisão se toma olhando o mês atual. Os anteriores ficam só com venda e
  // estoque, e a tabela encolhe pela metade.
  meses.forEach(m => {
    const atual = m === ult;
    h1 += `<th class="roxo mes${atual ? ' hoje' : ''}" colspan="${atual ? 4 : 2}" data-ord="" style="cursor:default">${rotuloMes(m)}</th>`;
    const v = soma(m, 'v'), e = soma(m, 'e'), c = cobertura(v, e);
    h2 += th('v:' + m, `Venda<span class="sub">${nf(v)}</span>`, 'tv mes' + (atual ? ' hoje' : '')) +
          th('e:' + m, `Estoque<span class="sub">${nf(e)}</span>`, 'te' + (atual ? ' hoje' : '')) +
          (atual ? th('c:' + m, `Cob.<span class="sub ${cobClasse(c)}">` +
                     `<span class="cob-cab">${cobTexto(c)}${botaoAlerta()}</span></span>`, 'tc') +
                   th('o:' + m, 'OBS', 'to') : '');
  });

  // carteira: 1S26 e 2S26, cada um com o total do semestre. Recolhido, o
  // 1º semestre some inteiro (meses e total) e o botão para trazê-lo de
  // volta fica no cabeçalho do 2º.
  const somaK = ms => lista.reduce((s, p) => s + kTot(p, ms), 0);
  if(E.cart){
    const setaS1 = s1Aberto
      ? `<button type="button" class="btn-k" id="btnS1" title="Ocultar a carteira do 1º semestre"
          aria-label="Ocultar a carteira do 1º semestre" aria-expanded="true">‹</button>`
      : `<button type="button" class="btn-k larga" id="btnS1" title="Mostrar a carteira do 1º semestre"
          aria-label="Mostrar a carteira do 1º semestre" aria-expanded="false">‹ 1S${ano2}</button>`;
    h1 += (s1Aberto ? `<th class="kh mes" colspan="7" data-ord="" style="cursor:default"><span class="k-cab">Carteira 1S${ano2}${setaS1}</span></th>` : '') +
          `<th class="kh mes" colspan="7" data-ord="" style="cursor:default"><span class="k-cab">${s1Aberto ? '' : setaS1}Carteira 2S${ano2}</span></th>`;
    const semestre = (ms, n) =>
      ms.map((m, i) => th('k:' + m, `${MESES[+m.slice(5) - 1]}<span class="sub">${nf(somaK([m]))}</span>`, 'kt' + (i ? '' : ' mes'))).join('') +
      th('ks:' + n, `${n}S${ano2}<span class="sub">${nf(somaK(ms))}</span>`, 'ks');
    h2 += (s1Aberto ? semestre(S1, 1) : '') + semestre(S2, 2);
  }
  // Quatro estados: verde forte é o que ainda não faturou, verde leve é o que
  // faturou e não chegou ao estoque do cliente, azul é o que já chegou e
  // âmbar é o mês que faturou só uma parte. No parcial a célula mostra o
  // total do mês — o que é de cada lado sai no balão, ao clicar.
  const celK = (p, x, cls = '', mes = '') => {
    const f = x ? x.f : 0, a = x ? x.a : 0;
    if(!f && !a) return `<td class="k${cls}"></td>`;
    const ch = f ? chegadaDe(p, mes, f) : null;
    const dito = !f ? '' : ch.chegou
      ? `${nf(f)} faturado · chegou ao estoque${ch.mes && ch.mes !== mes ? ' em ' + rotuloMes(ch.mes).toLowerCase() : ''}`
      : ch.motivo === 'produto'
        ? `${nf(f)} faturado · este produto não está no plano, sem histórico de estoque`
        : ch.motivo === 'mes'
          ? `${nf(f)} faturado · ${rotuloMes(mes)} ainda não foi lançado no plano`
          : `${nf(f)} faturado · ainda não entrou no estoque${ch.entrou ? ' (entraram ' + nf(ch.entrou) + ')' : ''}`;
    const tit = a && f ? `${nf(a)} em aberto · ${dito}` : a ? `${nf(a)} em aberto` : dito;
    const abre = ` data-mes="${mes}"`;
    if(a && f)
      return `<td class="k kp tem${cls}"${abre} title="Faturamento parcial · ${tit}">${nf(a + f)}</td>`;
    return `<td class="k tem ${a ? 'ka' : (ch.chegou ? 'kc' : 'kf')}${cls}"${abre} title="${tit}">${nf(a || f)}</td>`;
  };
  const celS = (p, ms, cls = '') => {
    const t = kTot(p, ms);
    const a = ms.reduce((s2, m) => { const x = (p.c || {})[m]; return s2 + (x ? x.a : 0); }, 0);
    if(!t) return `<td class="ks${cls}"></td>`;
    return `<td class="ks${cls}" title="${nf(a)} em aberto · ${nf(t - a)} já faturado">${nf(t)}</td>`;
  };

  // corpo: as linhas ficam guardadas em texto; só entram na tela as que
  // aparecem (ver janela())
  const corpo = lista.map(p => {
    let cel = '';
    meses.forEach(m => {
      const x = p.m[m] || {};
      const v = x.v || 0, e = x.e || 0, c = cobertura(v, e);
      // produto que só existe na carteira não tem venda nem estoque no
      // plano: fica em branco, não zero
      const hj = m === ult ? ' hoje' : '';
      cel += `<td class="v mes${hj}${v ? '' : ' zero'}">${v ? nf(v) : p.soCart ? '' : '0'}</td>` +
             `<td class="e${hj}${e ? '' : ' zero'}">${e ? nf(e) : p.soCart ? '' : '0'}</td>`;
      if(m === ult){
        const txt = obsEfetiva(p, m);
        const meu = obsEditada(p) !== undefined;
        const classe = 'obs' + (meu ? ' ed' : '') + (!meu && p.soCart ? ' so' : '');
        cel += `<td class="c ${cobClasse(c)}${c === null ? ' zero' : ''}">` +
               `<span class="cobn">${cobTexto(c)}</span><span class="cobico">${alertaCob(p, c)}</span></td>` +
               `<td class="obsc" data-obs="1" title="${meu ? 'Escrito aqui — clique para mudar' : 'Clique para escrever'}">` +
               `${txt ? `<span class="${classe}">${esc(txt)}</span>` : ''}</td>`;
      }
    });
    if(E.cart){
      const pc = p.c || {};
      if(s1Aberto){
        S1.forEach((m, i) => { cel += celK(p, pc[m], i ? '' : ' mes', m); });
        cel += celS(p, S1);
      }
      S2.forEach((m, i) => { cel += celK(p, pc[m], i ? '' : ' mes', m); });
      cel += celS(p, S2);
    }
    return `<tr data-k="${esc(p.k)}" class="${E.sel === p.k ? 'sel' : ''}">
      <td class="fx1"><span class="cod-t">${esc(p.codigo)}<span class="corm">${esc(p.cor)}</span></span>${fotoDe(p) ? ICONE_FOTO : ''}</td>
      <td class="fx2" title="${esc(p.descricao)}"><span class="desc-t">${esc(p.descricao)}</span>${iconeLoja(p)}</td>
      <td class="fx3" title="${esc(p.cor)}">${esc(p.cor)}</td>
      <td class="fx4">${brl(p.pdv)}</td>
      ${E.extras ? `<td class="gen">${esc(p.genero.charAt(0) + p.genero.slice(1).toLowerCase())}</td>
      <td class="gen">${esc(p.faixa === SEM_FAIXA ? '—' : (p.faixa || '—'))}</td>
      <td class="l">${esc(p.codCliente || '—')}</td>` : ''}
      ${cel}
    </tr>`;
  });

  const sugestoes = [...new Set([...B.produtos.map(p => (p.m[ult] || {}).o), ...Object.values(E.obs)]
    .map(t => String(t || '').trim()).filter(Boolean))].sort();
  $('obsLista').innerHTML = sugestoes.map(t => `<option value="${esc(t)}"></option>`).join('');

  const wrap = $('tabela');
  const x0 = wrap.scrollLeft, y0 = wrap.scrollTop;
  // São ~800 linhas × 40 colunas. Com tudo no DOM, cada quadro da rolagem
  // levava 24 ms; com o que cabe na tela, 15 ms. Então guardamos as linhas
  // em texto e desenhamos só a faixa visível, com duas tiras vazias no
  // lugar do resto para a barra de rolagem continuar certa.
  E.corpo = corpo;
  E.colunas = (h2.match(/<th/g) || []).length + (E.extras ? 7 : 4);
  // Larguras declaradas de uma vez. Sem isto, cada remontagem da faixa fazia
  // o navegador medir todas as células de novo — eram os solavancos de 100 ms
  // na rolagem, e as colunas ainda dançavam de largura.
  const L = { fx1:132, fx2:230, fx3:92, gen:82, pdv:86, faixa:126, cod:166, v:58, e:69, c:62, o:104, k:54, ks:60 };
  let cols = `<col style="width:${L.fx1}px"><col style="width:${L.fx2}px"><col style="width:${L.fx3}px">` +
    `<col style="width:${L.pdv}px">` +
    (E.extras ? `<col style="width:${L.gen}px"><col style="width:${L.faixa}px"><col style="width:${L.cod}px">` : '');
  meses.forEach(m => {
    cols += `<col style="width:${L.v}px"><col style="width:${L.e}px">`;
    if(m === ult) cols += `<col style="width:${L.c}px"><col style="width:${L.o}px">`;
  });
  if(E.cart){
    const nMes = (s1Aberto ? 6 : 0) + 6;
    cols += `<col style="width:${L.k}px">`.repeat(nMes) + `<col style="width:${L.ks}px">`.repeat(s1Aberto ? 2 : 1);
  }
  E.janela = { de:-1, ate:-1 };
  wrap.innerHTML = `<table class="giro"><colgroup>${cols}</colgroup>` +
    `<thead><tr class="h1">${h1}</tr><tr class="h2">${h2}</tr></thead><tbody></tbody></table>`;
  const tbody = wrap.querySelector('tbody');
  E.tbody = tbody;
  janela(true);

  // Na primeira vez a tabela abre no mês mais recente, que é o que se olha;
  // depois ela fica onde a pessoa deixou.
  if(!E.rolou){
    wrap.scrollLeft = wrap.scrollWidth;
    // as fontes chegam depois e alargam as colunas: rola de novo quando
    // elas estiverem prontas, senão a última coluna fica cortada
    if(document.fonts && document.fonts.ready)
      document.fonts.ready.then(() => { wrap.scrollLeft = wrap.scrollWidth; });
    E.rolou = true;
  }else{
    wrap.scrollLeft = x0; wrap.scrollTop = y0;
  }
  // A faixa de linhas foi montada com a tabela ainda no topo (o innerHTML
  // zera a rolagem). Depois de devolver a posição, ela é refeita no lugar
  // certo — senão a tabela aparecia vazia até a pessoa mexer na rolagem,
  // porque o ouvinte via a mesma posição de antes e não tinha o que fazer.
  ultimoY = wrap.scrollTop;
  janela(true);

  const bx = $('btnExtras');
  if(bx) bx.onclick = ev => {
    ev.stopPropagation();
    E.extras = !E.extras;
    guardar('extras', E.extras ? '1' : '0');
    pintar();
    // abrindo, leva a vista até as colunas que acabaram de aparecer
    if(E.extras) $('tabela').scrollLeft = 0;
  };
  const ba = $('btnAlerta');
  if(ba) ba.onclick = ev => {
    ev.stopPropagation();               // senão o clique ordenaria a coluna
    E.soAlerta = !E.soAlerta;
    pintar();
  };
  const bs = $('btnS1');
  if(bs) bs.onclick = ev => {
    ev.stopPropagation();
    E.s1 = s1Aberto ? '0' : '1';
    guardar('s1', E.s1);
    pintar();
  };
  wrap.querySelectorAll('thead [data-ord]').forEach(t => {
    if(!t.dataset.ord) return;
    t.onclick = () => {
      const k = t.dataset.ord;
      if(E.ordem.k === k) E.ordem.dir *= -1;
      else E.ordem = { k, dir: /^(codigo|descricao|cor|genero|faixa|codCliente|o:)/.test(k) ? 1 : -1 };
      pintar();
    };
  });
  fabs();
  requestAnimationFrame(() => { medirTabela(); if(altoCab) acompanharCab(); });
  // um ouvinte só para todas as linhas, inclusive as que chegam depois
  tbody.onclick = ev => {
    const kcel = ev.target.closest('td.k.tem');
    if(kcel){ ev.stopPropagation(); abrirBalao(kcel); return; }
    const foto = ev.target.closest('[data-foto]');
    if(foto){ abrirFoto(foto.closest('tr').dataset.k); return; }
    const vit = ev.target.closest('[data-vit]');
    if(vit){ abrirVitrine(vit.closest('tr').dataset.k); return; }
    const lj = ev.target.closest('[data-loja]');
    if(lj){ abrirLojaALoja(lj.closest('tr').dataset.k); return; }
    const cel = ev.target.closest('td.obsc');
    if(cel){ editarObs(cel); return; }   // a OBS abre para escrever, não seleciona
    const tr = ev.target.closest('tr');
    if(!tr) return;
    E.sel = E.sel === tr.dataset.k ? null : tr.dataset.k;
    tbody.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
    if(E.sel) tr.classList.add('sel');
  };
}


/* ── filtros de lista (faixa e PDV) ──────────────────────────────────── */
/* Os dois funcionam igual: uma lista com marcação múltipla e os pares de
   cada opção. Os pares são a venda do ano e a conta respeita os outros
   filtros, mas não o próprio — marcar um valor não pode sumir com os
   outros da lista. */
const SEM_PDV = 'Sem PDV';
const valorPdv = p => p.pdv ? String(p.pdv) : SEM_PDV;
const valorFaixa = p => p.faixa || SEM_FAIXA;

const FILTROS = [
  { id:'fx', sel:'faixaSel', valor:valorFaixa, rotulo:v => v, nome:'Faixa',
    vazio:'Nenhuma marcada', conta:n => `${n} marcada${n > 1 ? 's' : ''}`,
    temDados:() => E.linhas.some(p => p.faixa && p.faixa !== SEM_FAIXA),
    ordem:(a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'pt-BR') },
  { id:'pd', sel:'pdvSel', valor:valorPdv, rotulo:v => v === SEM_PDV ? v : brl(Number(v)), nome:'PDV',
    vazio:'Nenhum marcado', conta:n => `${n} marcado${n > 1 ? 's' : ''}`,
    temDados:() => E.linhas.some(p => p.pdv),
    // preço desce do mais caro para o mais barato; sem PDV fica no fim
    ordem:(a, b) => (a[0] === SEM_PDV ? 1 : b[0] === SEM_PDV ? -1 : Number(b[0]) - Number(a[0])) },
];

function pintarFiltro(f){
  const B = E.base; if(!B) return;
  const chip = $(f.id + 'Chip');
  chip.parentElement.hidden = !f.temDados();
  if(chip.parentElement.hidden) return;
  const sel = E[f.sel];
  const termos = gruposDaBusca(E.busca);
  // tudo menos este filtro
  const base = E.linhas.filter(p =>
    (!E.genero || p.genero === E.genero) && (!E.marca || p.marca === E.marca) &&
    (!E.comCart || temAberto(p)) && (!termos.length || casaBusca(p, termos)) &&
    FILTROS.every(o => o === f || !E[o.sel].size || E[o.sel].has(o.valor(p))));
  const pares = new Map();
  base.forEach(p => {
    const v = f.valor(p);
    pares.set(v, (pares.get(v) || 0) + B.meses.reduce((s2, m) => s2 + ((p.m[m] || {}).v || 0), 0));
  });
  $(f.id + 'Lista').innerHTML = [...pares.entries()].sort(f.ordem).map(([v, q]) =>
    `<button type="button" class="fx-item${sel.has(v) ? ' on' : ''}" data-v="${esc(v)}" ` +
    `role="checkbox" aria-checked="${sel.has(v)}"><span class="fx-cx">${sel.has(v) ? '✓' : ''}</span>` +
    `<span class="fx-nome">${esc(f.rotulo(v))}</span><span class="fx-pares">${nf(q)} pares</span></button>`).join('');
  const n = sel.size;
  $(f.id + 'Quantos').textContent = n ? f.conta(n) : f.vazio;
  chip.textContent = n === 1 ? f.rotulo([...sel][0]) : n ? `${f.nome} · ${n}` : f.nome;
  chip.classList.toggle('on', !!n);
  chip.title = n ? `${f.nome}: ` + [...sel].map(f.rotulo).join(', ') : `Filtrar por ${f.nome.toLowerCase()}`;
  $(f.id + 'Lista').querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    sel.has(v) ? sel.delete(v) : sel.add(v);
    pintar();
  });
}
function pintarFiltros(){ FILTROS.forEach(pintarFiltro); }

function abrirPop(id, sim){
  FILTROS.forEach(f => {
    const aberto = sim && f.id === id;
    $(f.id + 'Pop').classList.toggle('aberta', aberto);
    $(f.id + 'Chip').setAttribute('aria-expanded', String(aberto));
  });
}
FILTROS.forEach(f => {
  $(f.id + 'Chip').onclick = ev => {
    ev.stopPropagation();
    abrirPop(f.id, !$(f.id + 'Pop').classList.contains('aberta'));
  };
  $(f.id + 'Pop').onclick = ev => ev.stopPropagation();
  $(f.id + 'Tudo').onclick = () => { E.linhas.forEach(p => E[f.sel].add(f.valor(p))); pintar(); };
  $(f.id + 'Limpar').onclick = () => { E[f.sel].clear(); pintar(); };
});
document.addEventListener('click', () => abrirPop(null, false));
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') abrirPop(null, false); });

/* ── balão da célula: as notas daquele mês ───────────────────────────── */
const diaBR = d => d == null || d < 0 ? '—' : new Date(d * 864e5).toLocaleDateString('pt-BR', { timeZone:'UTC' });

function abrirBalao(td){
  const tr = td.closest('tr');
  const p = E.linhas.find(x => x.k === tr.dataset.k);
  const mes = td.dataset.mes;
  const x = p && (p.c || {})[mes];
  if(!x || !(x.n || []).length) return;
  const fat = x.n.filter(n => n.t === 'f').sort((a, b) => b.d - a.d);
  const abertos = x.n.filter(n => n.t === 'a').sort((a, b) => a.d - b.d);
  $('balaoTit').innerHTML = `${esc(p.descricao)} · ${esc(p.cor)}<small>${rotuloMes(mes)} · ` +
    `${x.f ? nf(x.f) + ' faturado' : ''}${x.f && x.a ? ' · ' : ''}${x.a ? nf(x.a) + ' em aberto' : ''}</small>`;
  $('balaoCorpo').innerHTML =
    fat.map(n => `<div class="balao-l"><span class="doc">${n.nf ? 'NF ' + esc(n.nf) : 'sem NF'}</span>` +
      `<span class="dia">${diaBR(n.d)}</span><span class="q">${nf(n.q)}</span></div>`).join('') +
    abertos.map(n => `<div class="balao-l"><span class="doc">${n.gci ? 'GCI ' + esc(n.gci) : 'em aberto'}</span>` +
      `<span class="dia">prev. ${diaBR(n.d)}</span><span class="q">${nf(n.q)}</span></div>`).join('');
  const pe = $('balaoPe');
  if(x.f){
    const ch = chegadaDe(p, mes, x.f);
    pe.className = 'balao-pe ' + (ch.chegou ? 'chegou' : 'espera');
    pe.innerHTML = `<span class="pt"></span>` + (ch.chegou
      ? `Chegou ao estoque${ch.mes && ch.mes !== mes ? ' em ' + rotuloMes(ch.mes).toLowerCase() : ''}`
      : ch.motivo === 'produto' ? 'Produto fora do plano: sem histórico de estoque'
      : ch.motivo === 'mes' ? `${rotuloMes(mes)} ainda não foi lançado no plano`
      : `Ainda não entrou no estoque${ch.entrou ? ' · entraram ' + nf(ch.entrou) : ''}`);
  }else{
    pe.className = 'balao-pe';
    pe.innerHTML = '<span class="pt"></span>Ainda não faturado';
  }
  const b = $('balao');
  b.hidden = false;
  // preso na célula, mas sempre dentro da tela
  const r = td.getBoundingClientRect(), cx = b.getBoundingClientRect();
  const x0 = Math.min(Math.max(8, r.left + r.width / 2 - cx.width / 2), innerWidth - cx.width - 8);
  const y0 = r.bottom + 8 + cx.height > innerHeight ? Math.max(8, r.top - cx.height - 8) : r.bottom + 8;
  b.style.left = Math.round(x0) + 'px';
  b.style.top = Math.round(y0) + 'px';
}
/* ── loja a loja ─────────────────────────────────────────────────────── */
function abrirLojaALoja(k){
  const q = new URLSearchParams({ k, marca: MARCA, embed:'1' });
  $('ljQuadro').src = 'loja-a-loja.html?' + q;
  $('ljFundo').hidden = false;
  document.body.style.overflow = 'hidden';
}
function fecharLojaALoja(){
  $('ljFundo').hidden = true;
  $('ljQuadro').src = 'about:blank';
  document.body.style.overflow = '';
}
addEventListener('message', ev => {
  if(ev.data && ev.data.lojaALoja === 'fechar') fecharLojaALoja();
});

const fecharBalao = () => { $('balao').hidden = true; };
$('balaoX').onclick = fecharBalao;
$('balao').onclick = ev => ev.stopPropagation();
document.addEventListener('click', fecharBalao);
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') fecharBalao(); });
$('tabela').addEventListener('scroll', fecharBalao, { passive:true });

/* ── escrever a OBS ──────────────────────────────────────────────────── */
function editarObs(cel){
  if(cel.querySelector('input')) return;
  const tr = cel.closest('tr');
  const k = tr.dataset.k;
  const p = E.linhas.find(x => x.k === k);
  if(!p) return;
  const ult = E.base.meses[E.base.meses.length - 1];
  const antes = obsEfetiva(p, ult);
  const guardadoAntes = cel.innerHTML;
  cel.innerHTML = `<input class="obs-edit" list="obsLista" value="${esc(antes)}" maxlength="40" ` +
    `aria-label="Observação do produto" autocomplete="off">`;
  const campo = cel.querySelector('input');
  E.editando = true;                       // a faixa de linhas não se refaz enquanto escreve
  campo.focus(); campo.select();
  let fechado = false;
  const fechar = salvar => {
    if(fechado) return;
    fechado = true; E.editando = false;
    const novo = salvar ? campo.value.trim().toUpperCase() : null;
    if(novo === null || novo === antes){ cel.innerHTML = guardadoAntes; return; }
    // voltou a ser igual ao da planilha: deixa de ser edição
    if(novo === obsDoPlano(p, ult)) delete E.obs[p.k];
    else E.obs[p.k] = novo;
    guardarObs(E.base.cliente.id);
    pintar();
  };
  campo.onkeydown = ev => {
    ev.stopPropagation();
    if(ev.key === 'Enter') fechar(true);
    if(ev.key === 'Escape') fechar(false);
  };
  campo.onblur = () => fechar(true);
  campo.onclick = ev => ev.stopPropagation();
}

/* ── só as linhas visíveis ───────────────────────────────────────────── */
/* A altura da linha é a mesma para todas (fixada no CSS), então dá para
   saber onde cada uma cai sem medir nenhuma. */
const FOLGA = 20;   // linhas desenhadas a mais, acima e abaixo da vista
// Medidas da tabela. Lê-las a cada quadro obrigava o navegador a refazer o
// layout no meio da rolagem — era daí que vinha boa parte do arrasto. Agora
// só são medidas quando a tabela muda ou a janela é redimensionada.
function medirTabela(){
  const wrap = $('tabela');
  if(!wrap) return;
  const hCab = CAB ? CAB.getBoundingClientRect().height : 0;
  E.med = { area: wrap.clientHeight + hCab, rolagem: wrap.scrollHeight - wrap.clientHeight - hCab };
}
function janela(forcar){
  const wrap = $('tabela'), tbody = E.tbody, corpo = E.corpo;
  if(!tbody || !corpo) return;
  const alt = E.alturaLinha;
  const total = corpo.length;
  const cabem = Math.ceil((E.med.area || 600) / alt);
  // o que a pessoa vê agora; a faixa desenhada é maior, com a folga dos dois
  // lados, e só se refaz quando a vista sai dela
  const vis0 = Math.floor(wrap.scrollTop / alt);
  const visN = Math.min(total, vis0 + cabem + 1);
  if(E.editando && !forcar) return;
  if(!forcar && vis0 >= E.janela.de && visN <= E.janela.ate) return;
  const de = Math.max(0, vis0 - FOLGA);
  const ate = Math.min(total, visN + FOLGA);
  const J = E.janela;
  // Rolagem normal: a faixa anda um pouco, então só entram e saem as linhas
  // das pontas. Montar as 60 de novo a cada vez custava 100 ms.
  const emendar = !forcar && J.de >= 0 && de < J.ate && ate > J.de;
  if(emendar){
    const topo = tbody.firstElementChild, fim = tbody.lastElementChild;
    for(let i = J.de; i < de; i++) topo.nextElementSibling.remove();
    for(let i = J.ate; i > ate; i--) fim.previousElementSibling.remove();
    if(de < J.de) topo.insertAdjacentHTML('afterend', corpo.slice(de, J.de).join(''));
    if(ate > J.ate) fim.insertAdjacentHTML('beforebegin', corpo.slice(J.ate, ate).join(''));
    topo.style.height = (de * alt) + 'px';
    fim.style.height = ((total - ate) * alt) + 'px';
  }else{
    const vazia = n => `<tr class="vazia" style="height:${Math.max(0, n) * alt}px"><td colspan="${E.colunas}"></td></tr>`;
    tbody.innerHTML = vazia(de) + corpo.slice(de, ate).join('') + vazia(total - ate);
  }
  E.janela = { de, ate };
  if(!forcar) return;
  // ao montar de novo, confere a altura real da linha e refaz se for outra
  const tr = tbody.querySelector('tr:not(.vazia)');
  if(tr){
    const h = Math.round(tr.getBoundingClientRect().height);
    if(h && Math.abs(h - alt) > 0.5){ E.alturaLinha = h; E.janela = { de:-1, ate:-1 }; janela(true); }
  }
}

/* ── topo recolhido e botões flutuantes ──────────────────────────────── */
const temFiltro = () => !!(E.busca || E.genero || E.marca || E.comCart || E.faixaSel.size || E.pdvSel.size || E.soAlerta);

// A linha do cliente encolhe exatamente o que a tabela rolou: rolou 20px,
// ela perde 20px. Some no fim do próprio gesto e volta na subida, sem atraso
// nem animação.
const CAB = document.querySelector('.cab-anim');
let altoCab = 0;
/* O topo sobe por etapas, na ordem em que a informação deixa de ser
   necessária enquanto se lê a tabela: primeiro o nome do cliente, depois os
   números do topo e, no tablet e no celular, também a fita de marcas. A
   busca e o gênero nunca somem — são o que a pessoa usa no meio da leitura.
   Tudo acompanha a rolagem na medida exata, sem animação. */
const CHIPS = document.querySelectorAll('.toolbar')[1];
const soTela = () => window.innerWidth <= 900;       // tablet e celular
const ETAPAS = [
  { el:CAB,       alto:0, sempre:true },
  { el:$('kpis'), alto:0, sempre:false },
  { el:CHIPS,     alto:0, sempre:false },
];
const alturaCheia = el => {
  const st = getComputedStyle(el);
  return el.offsetHeight + (parseFloat(st.marginBottom) || 0);
};

function medirCab(){
  ETAPAS.forEach(e => {
    e.el.style.height = e.el.style.marginBottom = e.el.style.opacity = e.el.style.paddingBottom = '';
    e.feito = null;
  });
  // a folga até a barra de baixo entra na conta, senão sobra uma tira
  altoCab = alturaCheia(CAB.firstElementChild);
  ETAPAS[0].alto = altoCab;
  ETAPAS[1].alto = soTela() ? alturaCheia($('kpis')) : 0;
  ETAPAS[2].alto = soTela() ? alturaCheia(CHIPS) : 0;
  medirTabela();
  acompanharCab();
}
function acompanharCab(){
  // Só escreve: as medidas vêm de medirTabela(). Pouca coisa na tela e nada
  // recolhe — recolher faria a tabela caber inteira, a rolagem voltar a zero
  // e o topo reaparecer, que era o tremor.
  const total = ETAPAS.reduce((s2, e) => s2 + e.alto, 0);
  let resto = (E.med.rolagem || 0) < total + 4 ? 0 : $('tabela').scrollTop;
  for(const e of ETAPAS){
    if(!e.alto){ resto = Math.max(0, resto); continue; }
    const h = Math.max(0, e.alto - resto);
    resto = Math.max(0, resto - e.alto);
    if(h === e.feito) continue;
    e.feito = h;
    e.el.style.height = h + 'px';
    e.el.style.overflow = 'hidden';
    e.el.style.marginBottom = '0px';
    // a folga de baixo (a dos KPIs, para a barra de rolagem) também encolhe,
    // senão sobra uma tira de 4px depois de recolhido
    e.el.style.paddingBottom = h < e.alto ? '0px' : '';
    e.el.style.opacity = Math.min(1, (h / e.alto) * 2.2);
  }
}
function fabs(){
  $('fabTopo').classList.toggle('on', $('tabela').scrollTop > 40);
  const tem = temFiltro();
  $('fabLimpar').classList.toggle('on', tem);
  $('limparChip').classList.toggle('on', tem);
}
let noQuadro = false;
let ultimoY = 0;
$('tabela').addEventListener('scroll', () => {
  if(noQuadro) return;
  noQuadro = true;
  requestAnimationFrame(() => {
    noQuadro = false;
    const y = $('tabela').scrollTop;
    // de lado não muda nem as linhas nem o cabeçalho: não custa nada
    if(y === ultimoY) return;
    ultimoY = y;
    janela(false);
    acompanharCab();
    fabs();
  });
}, { passive:true });
window.addEventListener('resize', medirCab);
$('fabTopo').onclick = () => {
  $('tabela').scrollTo({ top:0, behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth' });
};
$('limparChip').onclick = () => $('fabLimpar').onclick();
$('fabLimpar').onclick = () => {
  E.busca = ''; E.genero = ''; E.marca = ''; E.comCart = false; E.soAlerta = false;
  E.faixaSel.clear(); E.pdvSel.clear();
  $('busca').value = ''; $('buscaWrap').classList.remove('tem'); $('genero').value = '';
  pintar(); fabs();
};

carregar();
})();
</script>
