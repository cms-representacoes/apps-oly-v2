/* ══════════════════════════════════════════════════════════════════════════
   MIX 1S27 — quanto cada vendedor quer de cada cor

   A convenção destacou 42 cores com estrela. Em vez de perguntar "qual cor
   você prefere", esta tela pergunta o que o vendedor de fato decide: COMO
   ELE REPARTE a compra de cada tênis entre as cores destacadas. Cada modelo
   fecha quando os percentuais somam 100%.

   O visual é o da vitrine CMS: mesmo papel, mesma carta, mesma tipografia.
   ══════════════════════════════════════════════════════════════════════════ */
/* A mesma roupa da vitrine CMS no tema escuro: fundo quente quase preto com
   as figurinhas em âmbar, cards cor de osso e o âmbar da casa como marca.
   O âmbar puro não se lê como texto sobre o card — para isso existe o
   --marca-tinta, o mesmo laranja queimado que a vitrine usa. */
:root{
  --papel:#14110A;
  --barra:rgba(20,17,10,.86);
  --carta:#FAF7F1;
  --suave:#F2EDE4;
  --tinta:#0F172A;
  --texto:#1E293B;
  --fraco:#6B7280;
  --tenue:#94A3B8;
  --linha:#E5E7EB;
  --linha-forte:#D6DAE1;

  --marca:#FFBE0B;
  --marca-claro:#FFD35A;
  --marca-escuro:#D99A00;
  --marca-fundo:#FFEFC2;
  --sobre-marca:#1A1407;
  --marca-tinta:#B45309;

  --ok:#0E6B47;       --ok-fundo:#DEEFE7;
  --falta:#B45309;    --falta-fundo:#FFF7E6;
  --estrela:#F2B632;
  --estrela-azul:#8FB7E8;

  --sombra:0 1px 2px rgba(0,0,0,.30), 0 10px 28px -16px rgba(0,0,0,.55);
  /* Os cartões são claros: só o fundo é escuro. Com "dark" aqui o navegador
     pinta os campos de preto por conta própria — é o mesmo motivo pelo qual a
     vitrine CMS declara "light". */
  color-scheme: light;
}
*{ box-sizing:border-box; margin:0; padding:0 }
html{ background:var(--papel); color:var(--texto); }
body{ background:transparent; color:var(--texto); }

/* ── fundo em figuras, o mesmo da vitrine CMS ──
   Tênis, vestuário, meias, acessórios e as logos, em traço, no âmbar bem
   clarinho. É uma máscara: a cor vem daqui e acompanha a marca. */

body{
  font-family:'Plus Jakarta Sans', Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  /* o bastante para o último cartão não ficar sob as peças flutuantes */
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
button{ font:inherit; cursor:pointer; border:0; background:none; color:inherit }
input{ font:inherit }
.mono{ font-variant-numeric:tabular-nums }

/* ── cabeçalho ───────────────────────────────────────────────────────── */
.topo{
  position:sticky; top:0; z-index:20; background:var(--barra);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--linha); padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
.topo{ -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.08) }
.topo-in{ max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:12px; flex-wrap:wrap }
.selo{ width:38px; height:38px; border-radius:12px; flex:none; display:flex; align-items:center;
  justify-content:center; font-size:11px; font-weight:800; color:#fff; letter-spacing:.02em;
  background:linear-gradient(145deg,#a970ff 0%,#8b5cf6 48%,#7439e0 100%);
  box-shadow:0 5px 14px rgba(124,58,237,.38), inset 0 1px 0 rgba(255,255,255,.28) }
/* ── as duas marcas ──
   A que está valendo fica acesa; a outra, apagada e esperando o clique. */
.marcas{ display:flex; align-items:center; gap:6px; flex:none }
/* Cada botão é a pastilha da marca, no azul da Olympikus e no vermelho da
   Under Armour. A que não está valendo perde a cor e espera o clique. */
.marca-bt{ display:grid; place-items:center; width:44px; height:36px; border-radius:11px;
  border:1px solid rgba(255,255,255,.10); background:#3A3A3A; cursor:pointer;
  filter:grayscale(1) brightness(1.5); opacity:.6;
  transition:filter .18s ease, opacity .18s ease, background .18s ease, box-shadow .18s ease }
.marca-bt[data-marca="oly"]{ background:#0034D8 }
.marca-bt[data-marca="ua"]{  background:#E52125 }
.marca-bt img{ object-fit:contain; display:block }
.marca-bt[data-marca="oly"] img{ width:28px }
.marca-bt[data-marca="ua"]  img{ height:18px }
.marca-bt:hover{ filter:grayscale(.3) brightness(1.08); opacity:.9 }
.marca-bt.on{ filter:none; opacity:1; border-color:rgba(255,255,255,.28);
  box-shadow:0 0 0 2px rgba(255,255,255,.14) }
.marca-bt:focus-visible{ outline:2px solid var(--marca); outline-offset:2px }

/* No painel do resultado elas ficam sobre papel claro: a apagada ganha um
   contorno que não some no branco e a acesa, um halo escuro. */
.res-marcas{ flex:none }
.res-marcas .marca-bt{ width:38px; height:30px; border-radius:9px;
  border-color:rgba(0,0,0,.14) }
.res-marcas .marca-bt[data-marca="oly"] img{ width:24px }
.res-marcas .marca-bt[data-marca="ua"]  img{ height:15px }
.res-marcas .marca-bt.on{ border-color:rgba(0,0,0,.22);
  box-shadow:0 0 0 2px rgba(0,0,0,.08) }

.tit{ flex:1 1 auto; min-width:0 }
.tit b{ display:block; font-size:15.5px; font-weight:800; letter-spacing:-.01em; color:#F5F1E8 }
.tit span{ display:block; font-size:12px; font-weight:600; color:#B9B2A3 }
.topo-acoes{ display:flex; align-items:center; gap:8px; flex:none }

/* o botão de Portal padronizado das outras telas */
.portal-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  flex:none; height:36px; padding:0 12px; border-radius:999px;
  border:1px solid #E2E8F0; background:#FFFFFF; color:#475569;
  font-family:inherit; font-size:14px; font-weight:700; line-height:1;
  text-decoration:none; cursor:pointer; white-space:nowrap;
  transition:background .15s ease, border-color .15s ease;
}
.portal-btn:hover{ background:#F8FAFC; border-color:#CBD5E1; color:#334155 }
.portal-btn svg{ width:14px; height:14px; flex:none }
.portal-btn[hidden]{ display:none }

.bt{ display:inline-flex; align-items:center; justify-content:center; gap:7px; height:36px;
  padding:0 14px; border-radius:999px; font-size:13.5px; font-weight:800; white-space:nowrap;
  border:1px solid var(--linha-forte); background:var(--carta); color:var(--texto) }
.bt:hover{ border-color:var(--marca-escuro); color:var(--marca-tinta) }
/* sobre o âmbar, tinta escura: branco sobre ele não se lê */
.bt.forte{ background:linear-gradient(145deg,var(--marca-claro),var(--marca) 55%,var(--marca-escuro));
  border-color:transparent; color:var(--sobre-marca);
  box-shadow:0 6px 16px -8px rgba(255,190,11,.65), inset 0 1px 0 rgba(255,255,255,.3) }
.bt.forte:hover{ filter:brightness(1.05); color:var(--sobre-marca) }
.bt[hidden]{ display:none }
.bt svg{ width:15px; height:15px; flex:none }

/* ── o corpo ─────────────────────────────────────────────────────────── */
.env{ max-width:1180px; margin:0 auto; padding:16px }

.grupo-rot{ display:flex; align-items:center; gap:10px; margin:6px 2px 10px }
.grupo-rot:not(:first-child){ margin-top:22px }
.grupo-rot b{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:#B9B2A3 }
.grupo-rot i{ flex:1; height:1px; background:rgba(255,255,255,.12); display:block }

/* ── o cartão de um tênis ────────────────────────────────────────────── */
.prod{ background:var(--carta); border:1px solid var(--linha); border-radius:18px;
  box-shadow:var(--sombra); margin-bottom:14px; overflow:hidden;
  transition:border-color .18s ease }
.prod.fechado{ border-color:#BFE3D2 }
.prod-cab{ display:flex; align-items:center; gap:10px; padding:13px 16px; flex-wrap:wrap;
  border-bottom:1px dashed var(--linha) }
.prod-nome{ font-size:15px; font-weight:800; color:var(--tinta); letter-spacing:-.01em }
.prod-sub{ font-size:12px; font-weight:600; color:var(--fraco) }
.chip{ display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 9px;
  font-size:10.5px; font-weight:800; border:1px solid var(--linha-forte); color:var(--fraco);
  background:var(--suave) }
.chip.destaque{ background:#FFF8E6; border-color:#F6DFA4; color:#8A6400 }
.chip.destaque svg{ width:11px; height:11px; fill:var(--estrela) }

/* ── quanto já foi repartido ──
   Fica embaixo das cores, no meio, e é a única coisa grande do cartão depois
   das fotos: é ela que diz se o modelo está pronto ou não. Em falta, âmbar
   com o número que falta; fechada, verde. */
.soma{ display:flex; flex-direction:column; align-items:center; gap:7px;
  padding:13px 16px 16px; border-top:1px dashed var(--linha); background:var(--suave) }
.soma .linha1{ display:flex; align-items:baseline; gap:8px; justify-content:center; flex-wrap:wrap }
.soma .n{ font-size:30px; font-weight:800; line-height:1; letter-spacing:-.02em;
  color:var(--falta); font-variant-numeric:tabular-nums }
.soma .n.ok{ color:var(--ok) }
.soma .rot{ font-size:13px; font-weight:800; color:var(--fraco) }
.soma.pronta .rot{ color:var(--ok) }
.soma .barra{ width:min(340px,100%); height:9px; border-radius:99px; background:#E7E1D6;
  border:1px solid var(--linha); overflow:hidden }
.soma .barra i{ display:block; height:100%; width:0;
  background:linear-gradient(90deg,var(--marca-claro),var(--marca-escuro));
  transition:width .22s ease, background .22s ease }
.soma .barra i.ok{ background:linear-gradient(90deg,#34C38F,var(--ok)) }
/* fechado, o cartão inteiro muda de tom: dá para varrer a página e ver o que
   falta sem ler número nenhum */
.prod.fechado .soma{ background:var(--ok-fundo); border-top-color:#BFE3D2 }

/* as cores, lado a lado */
.cores{ display:grid; gap:12px; padding:14px 16px 16px;
  grid-template-columns:repeat(auto-fit, minmax(176px, 1fr)) }
.cor{ border:1px solid var(--linha); border-radius:14px; overflow:hidden; background:var(--carta);
  display:flex; flex-direction:column; transition:border-color .16s ease, box-shadow .16s ease }
.cor:focus-within{ border-color:var(--marca); box-shadow:0 0 0 3px var(--marca-fundo) }
.cor.tem{ border-color:var(--marca); box-shadow:0 0 0 1px var(--marca) }
.cor-foto{ position:relative; aspect-ratio:4/3; background:#fff; display:block; overflow:hidden }
/* As fotos da Under Armour vem sobre um cinza claro; o quadro acompanha,
   senao sobra faixa branca dos lados. */
body[data-marca="ua"] .cor-foto{ background:#F0F0F0 }
.cor-foto img{ width:100%; height:100%; object-fit:contain; display:block }
.cor-foto .star{ position:absolute; top:7px; right:7px; width:19px; height:19px;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)) }
.cor-foto .star path{ fill:var(--estrela); stroke:#B98900; stroke-width:1 }
.cor-foto .star.azul path{ fill:var(--estrela-azul); stroke:#4D7CB5 }
.cor-pe{ padding:9px 10px 11px; display:flex; flex-direction:column; gap:7px }
.cor-nome{ font-size:12.5px; font-weight:800; color:var(--tinta); line-height:1.25 }
.cor-cod{ font-size:10px; font-weight:700; color:var(--tenue); letter-spacing:.04em }
.campo{ display:flex; align-items:center; justify-content:center; gap:3px;
  height:40px; border-radius:11px; border:1px solid var(--linha-forte);
  background:var(--suave); cursor:text;
  transition:border-color .14s ease, background .14s ease }
.campo:focus-within{ border-color:var(--marca-escuro); background:#fff;
  box-shadow:0 0 0 3px rgba(255,190,11,.22) }
/* Decidido, o campo fica com a cor do botão: âmbar cheio e tinta escura por
   cima — a mesma peça do "Enviar". É o que faz a tela mostrar de longe quanto
   do modelo já está de pé. */
.cor.tem .campo{
  background:linear-gradient(145deg,var(--marca-claro),var(--marca) 55%,var(--marca-escuro));
  border-color:transparent;
  box-shadow:0 6px 16px -8px rgba(255,190,11,.65), inset 0 1px 0 rgba(255,255,255,.30) }
.cor.tem .campo input,
.cor.tem .campo .pc{ color:var(--sobre-marca) }
/* focado, o âmbar fica: trocar para branco no clique faria a cor piscar a
   cada correção. O anel é que diz onde o cursor está. */
.cor.tem .campo:focus-within{
  background:linear-gradient(145deg,var(--marca-claro),var(--marca) 55%,var(--marca-escuro));
  box-shadow:0 0 0 3px rgba(255,190,11,.35), inset 0 1px 0 rgba(255,255,255,.30) }
.campo input{ width:2.7em; flex:none; height:100%; border:0; background:none; color:var(--tinta);
  font-size:17px; font-weight:800; text-align:right; padding:0;
  font-variant-numeric:tabular-nums; outline:none }
.campo input::-webkit-outer-spin-button,
.campo input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0 }
.campo input[type=number]{ -moz-appearance:textfield }
.campo .pc{ font-size:14px; font-weight:800; color:var(--fraco); flex:none }
/* sem número digitado o "%" seria um enfeite solto: ele acende junto */
.campo .pc{ opacity:.45 }
.cor.tem .campo .pc, .campo:focus-within .pc{ opacity:1 }

/* depois de enviado, a tela vira leitura */
.enviado .campo{ background:var(--papel) }
.enviado .campo input{ pointer-events:none; color:var(--fraco) }

/* ── as duas peças flutuantes ────────────────────────────────────────
   A barra atravessava a tela inteira e tapava a última linha de campos.
   Agora são duas peças nas pontas: o quanto falta à esquerda, o enviar à
   direita. O meio, onde ficam as fotos e os números, fica livre. */
.pe{ position:fixed; left:0; right:0; bottom:0; z-index:30; pointer-events:none;
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
  padding:0 16px calc(16px + env(safe-area-inset-bottom)) }
.pe > *{ pointer-events:auto }
.pe[hidden]{ display:none }

.pe-conta{ display:inline-flex; align-items:center; gap:7px; max-width:min(52vw,420px);
  height:40px; padding:0 15px; border-radius:999px;
  background:rgba(20,17,10,.86); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.14); color:#D9D2C4;
  font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 8px 22px -10px rgba(0,0,0,.8) }
.pe-conta b{ color:#F5F1E8; font-weight:800 }
.pe-conta .pino{ width:8px; height:8px; border-radius:999px; background:var(--marca); flex:none }
.pe-conta.cheio .pino{ background:#34C38F }

.pe .bt{ height:48px; padding:0 22px; font-size:14.5px; border-radius:999px }

/* ── avisos e modais ─────────────────────────────────────────────────── */
.aviso{ background:var(--carta); border:1px solid var(--linha); border-left:3px solid var(--falta);
  border-radius:12px; padding:11px 14px; font-size:13px; color:var(--texto); margin-bottom:14px }
.aviso b{ color:var(--tinta) }
.fundo{ position:fixed; inset:0; z-index:60; background:rgba(22,24,26,.55);
  display:flex; align-items:center; justify-content:center; padding:16px }
/* o resultado é uma tela de trabalho: toma tudo o que a janela der */
#modalRes{ padding:10px }
#modalRes .cx{ width:100% !important; max-width:none; height:calc(100vh - 20px); max-height:none }
#modalRes .res-rolo{ max-height:none; flex:1 1 auto }
#modalRes .cx-corpo{ display:flex; flex-direction:column; gap:14px; min-height:0 }
.fundo[hidden]{ display:none }
.cx{ background:var(--carta); border-radius:20px; width:min(1360px,100%); max-height:94vh;
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px rgba(22,24,26,.35) }
.cx-cab{ display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--linha) }
.cx-cab h2{ font-size:16px; font-weight:800; color:var(--tinta); flex:1 1 auto }
.cx-corpo{ overflow-y:auto; padding:16px 18px; flex:1 1 auto }
.cx-pe{ padding:12px 18px; border-top:1px solid var(--linha); display:flex; gap:9px; justify-content:flex-end }
.icone{ width:34px; height:34px; border-radius:999px; border:1px solid var(--linha-forte);
  background:var(--carta); display:inline-flex; align-items:center; justify-content:center;
  font-size:15px; color:var(--fraco); flex:none }
.icone:hover{ border-color:var(--marca); color:var(--marca) }

/* ── exportar ──
   A mesma textura do selo da vitrine: gradiente na diagonal, um fio de luz
   no topo e a sombra na cor do próprio botão. Verde do Excel, vermelho do
   PDF — as cores que todo mundo já reconhece no ícone. */
.bt-exp{ display:inline-flex; align-items:center; justify-content:center; gap:7px; flex:none;
  height:36px; padding:0 15px; border-radius:999px; border:0; cursor:pointer;
  font-size:13.5px; font-weight:800; color:#fff; white-space:nowrap;
  transition:transform .14s ease, box-shadow .14s ease, filter .14s ease }
.bt-exp i{ font-size:14px }
.bt-exp:hover{ transform:translateY(-1px); filter:brightness(1.05) }
.bt-exp:active{ transform:translateY(0) }
.bt-exp.xlsx{ background:linear-gradient(145deg,#34C98A 0%,#17A467 48%,#0B7A4A 100%);
  box-shadow:0 5px 14px -4px rgba(16,138,86,.55), inset 0 1px 0 rgba(255,255,255,.30) }
.bt-exp.xlsx:hover{ box-shadow:0 8px 20px -6px rgba(16,138,86,.65), inset 0 1px 0 rgba(255,255,255,.30) }
.bt-exp.pdf{ background:linear-gradient(145deg,#F2706B 0%,#DC2626 48%,#99160F 100%);
  box-shadow:0 5px 14px -4px rgba(190,30,25,.55), inset 0 1px 0 rgba(255,255,255,.30) }
.bt-exp.pdf:hover{ box-shadow:0 8px 20px -6px rgba(190,30,25,.65), inset 0 1px 0 rgba(255,255,255,.30) }
.bt-exp[disabled]{ opacity:.55; cursor:progress; transform:none }

/* ── entrar como (só no ambiente local) ──────────────────────────────── */
.quem{ background:var(--carta); border:1px solid var(--linha); border-radius:16px;
  padding:16px; box-shadow:var(--sombra); max-width:560px }
.quem h2{ font-size:16px; font-weight:800; color:var(--tinta) }
.quem p{ margin-top:5px; font-size:13px; color:var(--fraco) }
.quem-lista{ display:flex; gap:8px; flex-wrap:wrap; margin-top:13px }
.quem-lista button{ border:1px solid var(--linha-forte); background:var(--suave);
  border-radius:999px; padding:8px 15px; font-size:13.5px; font-weight:800; color:var(--texto) }
.quem-lista button:hover{ border-color:var(--marca); color:var(--marca); background:var(--marca-fundo) }
.bt-trocar{ font-size:11.5px; font-weight:700; color:var(--fraco); text-decoration:underline;
  text-underline-offset:2px }
.bt-trocar:hover{ color:var(--marca) }

/* ── o painel do resultado ───────────────────────────────────────────── */
.res-topo{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px }
.res-kpi{ background:var(--suave); border:1px solid var(--linha); border-radius:12px;
  padding:8px 13px; font-size:12px; font-weight:700; color:var(--fraco) }
.res-kpi b{ display:block; font-size:19px; font-weight:800; color:var(--tinta); line-height:1.1 }
/* ── a tabela de trabalho ──
   Quem vai digitar o pedido lê linha a linha, então cada linha se basta:
   artigo, produto e cor repetidos, sem célula vazia para completar de
   cabeça. A foto é miniátura, do tamanho da que a Detalhada usa. */
.res-busca{ display:flex; align-items:center; gap:8px; flex:1 1 220px; min-width:0;
  border:1px solid var(--linha-forte); background:var(--suave); border-radius:999px; padding:0 13px; height:36px }
.res-busca input{ flex:1 1 auto; min-width:0; border:0; background:none; outline:none;
  font-size:13.5px; font-weight:600; color:var(--tinta) }
.res-busca svg{ width:14px; height:14px; flex:none; color:var(--fraco) }

.res-rolo{ border:1px solid var(--linha); border-radius:14px; overflow:auto; min-height:0 }
.res-tab{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px }
.res-tab th,.res-tab td{ padding:6px 10px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--linha) }
.res-tab th:first-child,.res-tab td:first-child{ text-align:left }
.res-tab thead th{ position:sticky; top:0; z-index:2; background:var(--suave);
  font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  color:var(--fraco); border-bottom:1px solid var(--linha-forte) }
.res-tab tbody tr:hover td{ background:#FFFDF6 }
.res-tab thead th{ text-align:right }
.res-tab tbody tr.troca-prod td{ border-top:2px solid var(--linha-forte) }
/* Prefixo rt- em tudo: .prod e .cor já são os cartões da tela de cima, e as
   células estavam herdando deles borda, fundo e sombra de cartão. */
.res-tab td{ vertical-align:middle; background:none; border-radius:0; box-shadow:none }
.res-tab .rt-mini{ width:54px; padding:5px 0 5px 10px }
.res-tab .rt-mini img{ width:54px; height:54px; border-radius:9px; object-fit:contain;
  background:#fff; border:1px solid var(--linha); display:block; cursor:zoom-in }
.res-tab .rt-art{ font-variant-numeric:tabular-nums; font-weight:700; color:var(--fraco);
  font-size:12.5px; text-align:left }
.res-tab .rt-prod{ font-weight:800; color:var(--tinta); text-align:left; line-height:1.25 }
.res-tab .rt-prod small{ display:block; font-weight:600; color:var(--tenue); font-size:11px;
  letter-spacing:0 }
.res-tab .rt-cor{ font-weight:700; color:var(--texto); text-align:left; line-height:1.25 }
.res-tab .rt-cor small{ display:block; font-weight:600; color:var(--tenue); font-size:10.5px;
  letter-spacing:.04em }
.res-tab .rt-vend{ font-variant-numeric:tabular-nums; color:var(--texto); font-weight:600 }
.res-tab .rt-zero{ color:#C9CDD4; font-weight:600 }
.res-tab .rt-mix{ font-variant-numeric:tabular-nums; font-size:16px; font-weight:800;
  color:var(--marca-tinta); background:#FFFBEF; border-left:1px solid var(--linha) }
.res-tab tbody tr:hover .rt-mix{ background:#FFF6DE }
.res-foto{ position:fixed; inset:0; z-index:80; background:rgba(10,8,4,.82);
  display:flex; align-items:center; justify-content:center; padding:24px; cursor:zoom-out }
.res-foto[hidden]{ display:none }
.res-foto img{ max-width:min(760px,92vw); max-height:86vh; background:#fff;
  border-radius:16px; padding:10px }
.res-vazio{ text-align:center; padding:30px 10px; color:var(--fraco) }
.res-vazio b{ display:block; color:var(--tinta); font-size:15px; margin-bottom:4px }

/* ── tablet ── */
@media(max-width:1024px){
  .env{ padding:14px }
  .cx-cab{ padding:13px 14px; gap:8px }
  .cx-corpo{ padding:14px }
}

/* ── celular, do iPhone SE 2 (375) para cima ── */
@media(max-width:700px){
  .env{ padding:11px }
  .cores{ grid-template-columns:repeat(auto-fit, minmax(138px, 1fr)); gap:9px; padding:10px 11px 12px }
  .prod-cab{ padding:11px 12px; gap:7px }
  .prod-nome{ font-size:14.5px }
  .prod-sub{ font-size:11.5px }
  .soma{ padding:11px 12px 13px }
  .soma .n{ font-size:26px }
  .soma .rot{ font-size:12px }
  .cor-foto{ aspect-ratio:1 }
  .campo{ height:38px }
  .campo input{ font-size:16px }       /* abaixo de 16 o iOS dá zoom ao focar */
  .topo{ padding:calc(9px + env(safe-area-inset-top)) 12px 9px }
  .selo{ width:34px; height:34px; border-radius:10px }
  .marcas{ gap:4px }
  .marca-bt{ width:36px; height:32px; border-radius:9px }
  .marca-bt[data-marca="oly"] img{ width:24px }
  .marca-bt[data-marca="ua"]  img{ height:16px }
  .tit b{ font-size:14.5px }
  .tit span{ font-size:11px }
  .pe{ padding:0 12px calc(12px + env(safe-area-inset-bottom)) }
  .pe-conta{ height:38px; font-size:12px; padding:0 13px; max-width:58vw }
  .pe .bt{ height:44px; padding:0 18px }

  /* o modal encosta nas bordas: cada pixel conta numa tela de 375 */
  #modalRes{ padding:0 }
  #modalRes .cx{ height:100vh; border-radius:0 }
  .cx-cab{ padding:10px 12px; gap:7px; flex-wrap:wrap }
  .cx-cab h2{ font-size:14.5px; flex:1 1 100% }
  .res-marcas .marca-bt{ width:32px; height:28px; border-radius:8px }
  .res-marcas .marca-bt[data-marca="oly"] img{ width:20px }
  .res-marcas .marca-bt[data-marca="ua"]  img{ height:13px }
  .res-busca{ flex:1 1 100%; height:34px; order:9 }   /* a busca ganha a linha dela */
  .bt-exp{ height:34px; padding:0 12px; font-size:12.5px }
  .cx-corpo{ padding:11px 12px; gap:10px }
  .res-kpi{ padding:6px 10px; font-size:11px }
  .res-kpi b{ font-size:16px }

  /* A tabela perde o que é contexto e guarda o que identifica a linha.
     A foto e o produto ficam presos à esquerda: rolando para ver os
     vendedores, ainda se sabe de que cor se está falando. */
  .res-tab{ font-size:12px }
  .res-tab th, .res-tab td{ padding:5px 7px }
  .res-tab .rt-art{ display:none }
  .res-tab .rt-prod small{ display:none }
  .res-tab .rt-mini{ position:sticky; left:0; z-index:1; background:var(--carta);
    width:44px; padding:4px 0 4px 6px }
  .res-tab .rt-mini img{ width:44px; height:44px; border-radius:7px }
  .res-tab .rt-prod{ position:sticky; left:50px; z-index:1; background:var(--carta);
    font-size:12px; max-width:92px; white-space:normal; line-height:1.2 }
  .res-tab thead th.rt-mini, .res-tab thead th.rt-prod{ z-index:3; background:var(--suave) }
  .res-tab tbody tr:hover .rt-mini, .res-tab tbody tr:hover .rt-prod{ background:#FFFDF6 }
  .res-tab .rt-cor{ font-size:11.5px; white-space:normal; line-height:1.2; max-width:86px }
  .res-tab .rt-mix{ font-size:14px }
}

/* ── iPhone SE 2 e afins: 375 de largura ── */
@media(max-width:400px){
  .selo{ display:none }          /* numa tela de 375 as logos valem mais que o selo */
  .cores{ grid-template-columns:repeat(2, 1fr); gap:8px }
  .cor-nome{ font-size:12px }

  .res-tab .rt-mini img{ width:40px; height:40px }
}
@media (prefers-reduced-motion:reduce){ *{ transition:none !important } }
</style>
</head>

<script>
/* ══ quem está na tela ══════════════════════════════════════════════════
   A sessão é a mesma do Portal, gravada pelo login de lá. Sem ela não há
   como saber de quem é o mix — e a tela não serve. */
const PORTAL_KEY = 'cms_portal_session_v1';
const EH_LOCAL = ['localhost','127.0.0.1',''].includes(location.hostname);
const URL_PORTAL = EH_LOCAL ? 'http://127.0.0.1:5500/' : 'https://cms-representacoes.github.io/apps-oly/';
const NOMES_CMS = ['CMS', 'MARCOS (DEV)'];

const $ = id => document.getElementById(id);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* A equipe, para o ambiente local. No ar quem diz quem é você é o Portal. */
const VENDEDORES = [
  { codigo:'25846',   nome:'CMS' },
  { codigo:'3616654', nome:'MARCOS (DEV)' },
  { codigo:'25745',   nome:'LEANDRO' },
  { codigo:'4322318', nome:'CHRISTIAN LUCAS' },
  { codigo:'114611',  nome:'JORGE' },
  { codigo:'109839',  nome:'MARIANA' },
  { codigo:'1333497', nome:'RAFAEL' },
  { codigo:'25471',   nome:'WILLAME' }
];

function sessao(){
  try{
    const s = JSON.parse(localStorage.getItem(PORTAL_KEY) || 'null');
    if(!s || !s.expiraEm || new Date(s.expiraEm).getTime() < Date.now()) return null;
    return s;
  }catch(_){ return null; }
}
/* No ar, o catálogo e o Portal moram no mesmo endereço e a sessão é a mesma.
   Na máquina de casa eles são duas portas — 5500 e 3000 —, e o navegador
   guarda o login por endereço: a sessão do Portal não chega aqui. Por isso,
   e SÓ no ambiente local, a tela pergunta quem está usando. */
function entrarComo(v){
  localStorage.setItem(PORTAL_KEY, JSON.stringify({
    nome: v.nome, codigo: v.codigo,
    expiraEm: new Date(Date.now() + 12 * 3600e3).toISOString()
  }));
  location.reload();
}
function pedirQuemE(){
  document.querySelector('.pe').hidden = true;
  $('lista').innerHTML = `
    <div class="quem">
      <h2>Quem está testando?</h2>
      <p>No seu computador o Portal (porta 5500) e o catálogo (porta 3000) são
         endereços diferentes, e o login de lá não chega aqui. Escolha um nome
         para ver a tela como ele — no ar isso não aparece.</p>
      <div class="quem-lista">${VENDEDORES.map((v, i) =>
        `<button type="button" data-vend="${i}">${esc(v.nome)}</button>`).join('')}</div>
    </div>`;
  $('lista').addEventListener('click', ev => {
    const b = ev.target.closest('[data-vend]');
    if(b) entrarComo(VENDEDORES[Number(b.dataset.vend)]);
  });
}

const SESSAO = sessao();
const ehCms = () => NOMES_CMS.includes(String((SESSAO && SESSAO.nome) || '').toUpperCase());
const meuCodigo = () => String((SESSAO && SESSAO.codigo) || '').trim();
const meuNome = () => String((SESSAO && SESSAO.nome) || '').trim();

/* ══ onde o mix é guardado ══════════════════════════════════════════════
   O lugar certo é o Worker, para a CMS ver o de todo mundo. Enquanto o
   endpoint não estiver no ar, o mix fica neste aparelho e a tela diz isso
   em voz alta — melhor do que fingir que foi enviado. */
const WORKER_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev/';
const chaveLocal = (m) => MARCAS[m || MARCA].chave;
let MODO_LOCAL = false;

async function lerTodosOsMixes(m){
  m = m || MARCA;
  try{
    const r = await fetch(WORKER_URL, { method:'PATCH',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'getMixGtm', colecao:'1S27', marca:m }) });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if(!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('resposta estranha');
    MODO_LOCAL = false;
    return d;
  }catch(_){
    MODO_LOCAL = true;
    try{ return JSON.parse(localStorage.getItem(chaveLocal(m)) || '{}'); }catch(__){ return {}; }
  }
}
async function gravarMeuMix(registro){
  if(!MODO_LOCAL){
    try{
      const r = await fetch(WORKER_URL, { method:'PATCH',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ action:'saveMixGtm', colecao:'1S27', marca:MARCA, mix:registro }) });
      if(r.ok) return true;
    }catch(_){ /* cai para o aparelho */ }
    MODO_LOCAL = true;
  }
  const todos = (() => { try{ return JSON.parse(localStorage.getItem(chaveLocal()) || '{}'); }
                         catch(_){ return {}; } })();
  todos[registro.codigo] = registro;
  localStorage.setItem(chaveLocal(), JSON.stringify(todos));
  return true;
}

/* ══ os dados ═══════════════════════════════════════════════════════════ */
/* ══ as duas marcas ═══════════════════════════════════════════
   Cada uma tem a sua folha do GTM e o seu mix. A tela abre na Olympikus; a
   escolha vai para a URL, para o link poder apontar direto para uma delas.
   As fotos das duas moram na mesma pasta. */
const MARCAS = {
  oly: { nome:'Olympikus',    arquivo:'../data/gtm-1s27.json',    chave:'gtm_mix_1s27_v1' },
  ua:  { nome:'Under Armour', arquivo:'../data/gtm-ua-1s27.json', chave:'gtm_mix_ua_1s27_v1' },
};
function marcaDaUrl(){
  const m = String(new URLSearchParams(location.search).get('marca') || '').toLowerCase();
  return MARCAS[m] ? m : 'oly';
}
let MARCA = marcaDaUrl();

const IMG_BASE = '../imagens_olympikus/';
let GTM = null, MIXES = {}, MEU = null;
const valores = {};            // artigo|cor -> número digitado

const fotoDe = (artigo, cor) =>
  IMG_BASE + artigo + '_' + String(cor).replace(/[^\w]+/g, '_').toUpperCase() + '.jpg';
const chave = (artigo, cor) => artigo + '|' + cor;

function somaDoProduto(p){
  return p.cores.reduce((a, c) => a + (Number(valores[chave(p.artigo, c.cor)]) || 0), 0);
}
const produtosFechados = () => (GTM.produtos || []).filter(p => somaDoProduto(p) === 100).length;

/* ══ a tela ═════════════════════════════════════════════════════════════ */
const ESTRELA = '<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4 6.2 20.4l1.1-6.4L2.6 9.4l6.5-.9L12 2.6z"/></svg>';

function pintar(){
  const lista = $('lista');
  const porGrupo = new Map();
  for(const p of GTM.produtos) (porGrupo.get(p.grupo) || porGrupo.set(p.grupo, []).get(p.grupo)).push(p);

  let html = '';
  for(const [grupo, produtos] of porGrupo){
    html += `<div class="grupo-rot"><b>${esc(grupo)}</b><i></i></div>`;
    for(const p of produtos) html += cardProduto(p);
  }
  lista.innerHTML = html;
  for(const p of GTM.produtos) atualizarSoma(p.artigo);
  pintarRodape();
}

function cardProduto(p){
  const enviado = !!MEU;
  const cores = p.cores.map(c => {
    const k = chave(p.artigo, c.cor);
    const v = valores[k];
    const azul = c.estrela === 'azul' ? ' azul' : '';
    return `
    <div class="cor${v > 0 ? ' tem' : ''}" data-cor="${esc(k)}">
      <span class="cor-foto">
        <img src="${esc(fotoDe(p.artigo, c.cor))}" alt="${esc(p.nome)} ${esc(c.rotulo)}"
             loading="lazy" decoding="async"
             onerror="this.style.visibility='hidden'">
        ${ESTRELA.replace('class="star"', 'class="star' + azul + '"')}
      </span>
      <span class="cor-pe">
        <span class="cor-nome">${esc(c.rotulo)}</span>
        ${c.rotulo === c.cor ? '' : '<span class="cor-cod">' + esc(c.cor) + '</span>'}
        <span class="campo">
          <input type="number" inputmode="numeric" min="0" max="100" step="1"
                 value="${v > 0 ? v : ''}" placeholder="0"
                 data-k="${esc(k)}" data-art="${esc(p.artigo)}"
                 aria-label="Percentual de ${esc(c.rotulo)}"${enviado ? ' readonly' : ''}>
          <b class="pc">%</b>
        </span>
      </span>
    </div>`;
  }).join('');

  return `
  <section class="prod${enviado ? ' enviado' : ''}" id="prod-${esc(p.artigo)}">
    <header class="prod-cab">
      <span>
        <span class="prod-nome">${esc(p.nome)}</span>
        <span class="prod-sub">${esc(p.preco)} · ${esc(p.publico)} · Art. ${esc(p.artigo)}</span>
      </span>
      ${p.destaque ? `<span class="chip destaque"><svg viewBox="0 0 24 24"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.4L12 17.4 6.2 20.4l1.1-6.4L2.6 9.4l6.5-.9L12 2.6z"/></svg>destaque</span>` : ''}
    </header>
    <div class="cores">${cores}</div>
    <div class="soma" data-soma="${esc(p.artigo)}">
      <span class="linha1">
        <b class="n mono">0%</b>
        <span class="rot">faltam 100% para fechar</span>
      </span>
      <span class="barra"><i></i></span>
    </div>
  </section>`;
}

function atualizarSoma(artigo){
  const p = GTM.produtos.find(x => x.artigo === artigo);
  if(!p) return;
  const total = somaDoProduto(p);
  const wrap = document.querySelector(`[data-soma="${CSS.escape(artigo)}"]`);
  if(!wrap) return;
  const ok = total === 100;
  wrap.querySelector('.n').textContent = total + '%';
  wrap.querySelector('.n').classList.toggle('ok', ok);
  wrap.classList.toggle('pronta', ok);
  const barra = wrap.querySelector('.barra i');
  barra.style.width = Math.min(100, total) + '%';
  barra.classList.toggle('ok', ok);
  wrap.querySelector('.rot').textContent = ok ? 'fechado ✓'
    : total === 0 ? 'reparta 100% entre as cores'
    : ('faltam ' + (100 - total) + '% para fechar');
  $('prod-' + artigo)?.classList.toggle('fechado', ok);
  for(const c of p.cores){
    const el = document.querySelector(`[data-cor="${CSS.escape(chave(artigo, c.cor))}"]`);
    if(el) el.classList.toggle('tem', (Number(valores[chave(artigo, c.cor)]) || 0) > 0);
  }
}

function pintarRodape(){
  const total = (GTM.produtos || []).length;
  const fechados = produtosFechados();
  const txt = $('peConta');
  const pino = '<i class="pino"></i>';
  if(MEU){
    txt.innerHTML = pino + `Mix enviado ${esc(quandoCurto(MEU.em))}`;
    txt.classList.add('cheio');
    $('btEnviar').hidden = true;
  }else{
    txt.innerHTML = pino + `<b>${fechados}</b> de <b>${total}</b> fechados`;
    txt.classList.toggle('cheio', fechados === total);
  }
}

const quandoCurto = iso => {
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const p2 = n => String(n).padStart(2, '0');
  return 'em ' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' às ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
};

/* ══ digitação ══════════════════════════════════════════════════════════
   O campo não deixa a soma do modelo passar de 100: o teto de cada cor é o
   que ainda falta. Assim o vendedor nunca precisa apagar para encaixar. */
document.addEventListener('input', ev => {
  const el = ev.target.closest('input[data-k]');
  if(!el || MEU) return;
  const art = el.dataset.art;
  const p = GTM.produtos.find(x => x.artigo === art);
  const k = el.dataset.k;
  let v = Math.floor(Number(el.value));
  if(!isFinite(v) || v < 0) v = 0;
  const outros = p.cores.reduce((a, c) => {
    const kk = chave(art, c.cor);
    return a + (kk === k ? 0 : (Number(valores[kk]) || 0));
  }, 0);
  const teto = Math.max(0, 100 - outros);
  if(v > teto){ v = teto; el.value = v || ''; }
  valores[k] = v;
  atualizarSoma(art);
  pintarRodape();
});

/* O Tab já anda pelos campos sozinho, porque dentro da lista não há mais
   nada focalizavél. O Enter anda junto: quem digita o mix inteiro no teclado
   não precisa trocar de mão. No último campo ele pára e tira o foco. */
/* a moldura inteira é área de clique: mirar o número de 2,7em no celular
   seria pedir demais */
document.addEventListener('click', ev => {
  const campo = ev.target.closest('.campo');
  if(campo && !ev.target.closest('input')) campo.querySelector('input')?.focus();
});

const camposNaOrdem = () => [...document.querySelectorAll('.cores input[data-k]')];
/* Mudou de modelo? A tela vai junto. O cabeçalho e a barra de baixo são
   fixos, então rolar "para o elemento" deixaria o tínis atrás deles — a conta
   abaixo põe o cartão inteiro na faixa que sobra entre os dois. */
function trazerModeloParaVista(campo){
  const card = campo.closest('.prod');
  if(!card) return;
  const topo = document.querySelector('.topo')?.getBoundingClientRect().height || 0;
  // as peças flutuantes não ocupam a largura toda, mas comem altura na ponta
  const pe = (document.querySelector('.pe .bt')?.getBoundingClientRect().height || 0) + 26;
  const r = card.getBoundingClientRect();
  const folga = 10;
  const sobra = innerHeight - topo - pe;
  // já cabe inteiro na faixa visível? então não mexe
  if(r.top >= topo + folga && r.bottom <= innerHeight - pe - folga) return;
  // cabe inteiro na tela: encosta o topo dele abaixo do cabeçalho
  // não cabe: mostra o começo, que é onde estão o nome e as fotos
  const alvo = scrollY + r.top - topo - folga;
  scrollTo({ top: Math.max(0, alvo), behavior:'smooth' });
}

document.addEventListener('keydown', ev => {
  if(ev.key !== 'Enter') return;
  const el = ev.target.closest('input[data-k]');
  if(!el) return;
  ev.preventDefault();
  const todos = camposNaOrdem();
  const i = todos.indexOf(el);
  const proximo = todos[i + (ev.shiftKey ? -1 : 1)];
  if(!proximo){ el.blur(); return; }
  const mudouDeModelo = proximo.dataset.art !== el.dataset.art;
  proximo.focus(); proximo.select();
  if(mudouDeModelo) trazerModeloParaVista(proximo);
});
/* O mesmo pelo Tab, que é o caminho de quem vem do teclado do Windows. */
document.addEventListener('focusin', ev => {
  const el = ev.target.closest('input[data-k]');
  if(!el || !_ultimoArtigo) { if(el) _ultimoArtigo = el.dataset.art; return; }
  if(el.dataset.art !== _ultimoArtigo) trazerModeloParaVista(el);
  _ultimoArtigo = el.dataset.art;
});
let _ultimoArtigo = null;
/* Entrar no campo seleciona o que está lá: digitar por cima é o normal aqui,
   e sem isso o número novo grudava no antigo. */
document.addEventListener('focusin', ev => {
  const el = ev.target.closest('input[data-k]');
  // o quadro seguinte: dentro do próprio focusin o navegador ainda mexe no
  // cursor depois de nós, e a seleção se perdia
  if(el && !MEU) requestAnimationFrame(() => { try{ el.select(); }catch(_){} });
});

/* ══ enviar ═════════════════════════════════════════════════════════════ */
$('btEnviar').addEventListener('click', () => {
  const total = GTM.produtos.length;
  const fechados = produtosFechados();
  const abertos = GTM.produtos.filter(p => { const s = somaDoProduto(p); return s > 0 && s !== 100; });
  const vazios = GTM.produtos.filter(p => somaDoProduto(p) === 0);
  let corpo = `<p>O mix vai assinado como <b>${esc(meuNome())}</b> e <b>não pode ser trocado depois</b>.</p>`;
  corpo += `<p style="margin-top:9px">Fechados em 100%: <b>${fechados}</b> de ${total}.</p>`;
  if(abertos.length) corpo += `<p style="margin-top:9px;color:var(--falta)">` +
    `<b>${abertos.length}</b> modelo(s) com soma diferente de 100 vão como estão: ` +
    esc(abertos.map(p => p.nome).join(', ')) + `.</p>`;
  if(vazios.length) corpo += `<p style="margin-top:9px;color:var(--fraco)">` +
    `${vazios.length} modelo(s) sem nada preenchido ficam em branco.</p>`;
  if(MODO_LOCAL) corpo += `<p style="margin-top:9px;color:var(--falta)">` +
    `O servidor não respondeu: o mix fica <b>guardado só neste aparelho</b> ` +
    `e a CMS não vai enxergá-lo.</p>`;
  $('confCorpo').innerHTML = corpo;
  $('modalConfirma').hidden = false;
});

$('btConfirmaEnvio').addEventListener('click', async () => {
  const itens = [];
  for(const p of GTM.produtos){
    for(const c of p.cores){
      const v = Number(valores[chave(p.artigo, c.cor)]) || 0;
      if(v > 0) itens.push({ artigo:p.artigo, produto:p.nome, cor:c.cor, rotulo:c.rotulo, pct:v });
    }
  }
  const registro = { codigo: meuCodigo(), nome: meuNome(), em: new Date().toISOString(), itens };
  $('btConfirmaEnvio').disabled = true;
  await gravarMeuMix(registro);
  MEU = registro;
  MIXES[registro.codigo] = registro;
  $('modalConfirma').hidden = true;
  $('btConfirmaEnvio').disabled = false;
  pintar();
  window.scrollTo({ top:0, behavior:'smooth' });
});

/* ══ o resultado ════════════════════════════════════════════════════════ */
/* Há um painel por marca, e o painel tem marca própria: quem vai digitar o
   pedido troca de Olympikus para Under Armour sem fechar nada e sem perder
   o que estava preenchendo nos cartões. */
let MARCA_RES = MARCA;      /* a marca do painel */
let GTM_RES = null;         /* a folha dessa marca */
const FOLHAS = {};          /* cada folha é lida uma vez só */

async function folhaDa(m){
  if(FOLHAS[m]) return FOLHAS[m];
  const r = await fetch(MARCAS[m].arquivo + '?t=' + Date.now(), { cache:'no-store' });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return (FOLHAS[m] = await r.json());
}

async function abrirPainel(m){
  MARCA_RES = m;
  for(const bt of document.querySelectorAll('#marcasRes .marca-bt')){
    const dela = bt.dataset.marca === m;
    bt.classList.toggle('on', dela);
    bt.setAttribute('aria-pressed', dela ? 'true' : 'false');
  }
  $('tituloRes').textContent = 'Mix por cor · 1S27 · ' + MARCAS[m].nome;
  $('resCorpo').innerHTML = '<div class="res-vazio"><b>Lendo…</b></div>';
  try{
    GTM_RES = await folhaDa(m);
  }catch(e){
    $('resCorpo').innerHTML = '<div class="res-vazio"><b>Não consegui ler a lista de ' +
      esc(MARCAS[m].nome) + '.</b><p>' + esc(e.message) + '</p></div>';
    RES = { quem: [], linhas: [], exemplo: false };
    return;
  }
  mostrarResultado(m === MARCA ? MIXES : await lerTodosOsMixes(m));
}

$('btResultado').addEventListener('click', () => {
  $('modalRes').hidden = false;
  abrirPainel(MARCA_RES);
});
$('marcasRes').addEventListener('click', ev => {
  const bt = ev.target.closest('.marca-bt');
  if(bt && bt.dataset.marca !== MARCA_RES) abrirPainel(bt.dataset.marca);
});

/* O que está na tela do resultado agora, para a busca e o copiar lerem a
   mesma coisa que o olho vê. */
let RES = { quem: [], linhas: [], exemplo: false };

function mostrarResultado(mixes, exemplo){
  const quem = Object.values(mixes || {})
    .sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
  const corpo = $('resCorpo');
  RES = { quem, linhas: [], exemplo: !!exemplo };
  if(!quem.length){
    corpo.innerHTML = `<div class="res-vazio"><b>Ninguém enviou ainda</b>
      <p>Assim que a equipe mandar o mix, a tabela aparece aqui.</p>
      <p style="margin-top:10px;font-size:12.5px">Para ver só o formato,
         use <b>Exemplo</b> — são números inventados.</p></div>`;
    return;
  }
  const porCor = {};
  for(const m of quem) for(const it of (m.itens || []))
    (porCor[chave(it.artigo, it.cor)] = porCor[chave(it.artigo, it.cor)] || {})[m.codigo] = it.pct;

  // uma linha por artigo+cor, na ordem dos modelos. O mix de cada cor é a
  // média entre quem repartiu AQUELE modelo: contar como zero quem nem
  // chegou nele puxaria o produto para baixo e as cores não fechariam 100%.
  for(const p of (GTM_RES || GTM).produtos){
    const responderam = quem.filter(m =>
      (m.itens || []).some(it => String(it.artigo) === String(p.artigo)));
    p.cores.forEach((c, i) => {
      const votos = porCor[chave(p.artigo, c.cor)] || {};
      const soma = responderam.reduce((a, m) => a + (Number(votos[m.codigo]) || 0), 0);
      RES.linhas.push({
        p, c, votos, responderam: responderam.length,
        mix: responderam.length ? soma / responderam.length : 0,
        primeiraDoModelo: i === 0,
        ultimaDoModelo: i === p.cores.length - 1,
        busca: normalizar([p.nome, p.artigo, c.rotulo, c.cor, p.grupo, p.publico].join(' ')),
      });
    });
  }
  pintarTabela();
  corpo.scrollTop = 0;
}

const normalizar = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

function pintarTabela(){
  const q = normalizar(($('resBusca')?.value || '').trim());
  const linhas = q ? RES.linhas.filter(l => l.busca.includes(q)) : RES.linhas;
  const quem = RES.quem;
  let html = '';
  html += `<div class="res-topo">
    <span class="res-kpi"><b>${quem.length}</b>vendedor${quem.length === 1 ? '' : 'es'}</span>
    <span class="res-kpi"><b>${linhas.length}</b>${q ? 'linhas na busca' : 'cores'}</span>
    <span class="res-kpi"><b>${(GTM_RES || GTM).produtos.length}</b>modelos</span>
  </div>`;

  if(!linhas.length){
    html += `<div class="res-vazio"><b>Nada com esse termo</b></div>`;
    $('resCorpo').innerHTML = html;
    return;
  }

  html += `<div class="res-rolo"><table class="res-tab">
    <thead><tr>
      <th class="rt-mini"></th><th class="rt-art">Artigo</th>
      <th class="rt-prod">Produto</th><th class="rt-cor">Cor</th>
      ${quem.map(m => `<th>${esc(primeiroNome(m.nome))}</th>`).join('')}
      <th>Mix</th>
    </tr></thead>
    <tbody>${linhas.map((l, i) => {
      const trocou = i > 0 && linhas[i-1].p.artigo !== l.p.artigo;
      return `<tr class="${trocou ? 'troca-prod' : ''}">
        <td class="rt-mini"><img src="${esc(fotoDe(l.p.artigo, l.c.cor))}" alt="${esc(l.p.nome)} ${esc(l.c.rotulo)}"
             loading="lazy" data-ampliar="${esc(fotoDe(l.p.artigo, l.c.cor))}"
             onerror="this.style.visibility='hidden'"></td>
        <td class="rt-art">${esc(l.p.artigo)}</td>
        <td class="rt-prod">${esc(l.p.nome)}<small>${esc(l.p.preco)} · ${esc(l.p.publico)}</small></td>
        <td class="rt-cor">${esc(l.c.rotulo)}${l.c.rotulo === l.c.cor ? '' : '<small>' + esc(l.c.cor) + '</small>'}</td>
        ${quem.map(m => { const v = Number(l.votos[m.codigo]) || 0;
          return `<td class="${v ? 'rt-vend' : 'rt-zero'}">${v ? v + '%' : '—'}</td>`; }).join('')}
        <td class="rt-mix" title="média entre ${l.responderam} ${l.responderam === 1 ? 'vendedor que repartiu' : 'vendedores que repartiram'} este modelo">${Math.round(l.mix)}%</td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
  $('resCorpo').innerHTML = html;
}

/* A miniátura amplia, como na Detalhada: quem digita quer conferir a cor
   antes de lançar, e 54px não bastam para isso. */
document.addEventListener('click', ev => {
  const img = ev.target.closest('[data-ampliar]');
  if(img){
    const cx = $('resFoto');
    cx.querySelector('img').src = img.dataset.ampliar;
    cx.hidden = false;
    return;
  }
  if(ev.target.closest('#resFoto')) $('resFoto').hidden = true;
});

const primeiroNome = n => String(n || '').trim().split(/\s+/)[0];


$('resBusca')?.addEventListener('input', () => pintarTabela());


/* A mesma tabela que está na tela, em linhas prontas para exportar. */
function linhasParaExportar(){
  const cab = ['Artigo', 'Produto', 'Preço', 'Público', 'Cor', 'Código da cor',
               ...RES.quem.map(m => m.nome), 'Mix'];
  const corpo = RES.linhas.map(l => [
    l.p.artigo, l.p.nome, l.p.preco, l.p.publico, l.c.rotulo, l.c.cor,
    ...RES.quem.map(m => Number(l.votos[m.codigo]) || 0),
    Math.round(l.mix)
  ]);
  return { cab, corpo };
}
const carimbo = () => {
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  return d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes());
};

$('btXlsx').addEventListener('click', () => {
  if(!RES.linhas.length){ alert('Não há nada na tabela ainda.'); return; }
  if(!window.XLSX){ alert('A biblioteca do Excel não carregou. Atualize a página.'); return; }
  const { cab, corpo } = linhasParaExportar();
  const ws = XLSX.utils.aoa_to_sheet([cab, ...corpo]);
  /* a largura de cada coluna, para a planilha abrir legível em vez de pedir
     que alguém arraste sete divisórias antes de ler */
  ws['!cols'] = [{ wch:11 }, { wch:18 }, { wch:11 }, { wch:11 }, { wch:19 }, { wch:14 },
                 ...RES.quem.map(() => ({ wch:12 })), { wch:8 }];
  ws['!freeze'] = { xSplit:0, ySplit:1 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Mix 1S27');
  XLSX.writeFile(wb, 'mix-1s27-' + MARCA_RES + '-' + carimbo() + '.xlsx');
});

$('btPdf').addEventListener('click', () => {
  if(!RES.linhas.length){ alert('Não há nada na tabela ainda.'); return; }
  const motor = window.jspdf && window.jspdf.jsPDF;
  if(!motor){ alert('A biblioteca do PDF não carregou. Atualize a página.'); return; }
  const bt = $('btPdf');
  bt.disabled = true;
  try{
    // deitado: são seis colunas fixas mais uma por vendedor
    const doc = new motor({ orientation:'landscape', unit:'mm', format:'a4' });
    const larg = doc.internal.pageSize.getWidth();
    doc.setFont('helvetica', 'bold'); doc.setFontSize(14);
    doc.text('Mix por cor · coleção 1S27 · ' + MARCAS[MARCA_RES].nome, 12, 14);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.setTextColor(110);
    doc.text(RES.quem.length + ' vendedor' + (RES.quem.length === 1 ? '' : 'es') +
             ' · ' + RES.linhas.length + ' cores · ' +
             new Date().toLocaleDateString('pt-BR'), 12, 19.5);
    if(RES.exemplo){
      doc.setTextColor(180, 83, 9);
      doc.text('NÚMEROS INVENTADOS — só para conferir o formato', larg - 12, 19.5, { align:'right' });
    }
    const { cab, corpo } = linhasParaExportar();
    const iMix = 6 + RES.quem.length;
    doc.autoTable({
      head: [cab],
      body: corpo.map(l => l.map((v, i) => i >= 6 ? v + '%' : v)),
      startY: 24,
      styles: { font:'helvetica', fontSize:8, cellPadding:1.8, overflow:'linebreak' },
      headStyles: { fillColor:[26,20,7], textColor:[255,222,120], fontStyle:'bold', fontSize:7.5 },
      alternateRowStyles: { fillColor:[250,247,241] },
      columnStyles: Object.assign(
        { 0:{ cellWidth:20 }, 1:{ cellWidth:30, fontStyle:'bold' }, 2:{ cellWidth:20 },
          3:{ cellWidth:20 }, 4:{ cellWidth:34 }, 5:{ cellWidth:20 } },
        Object.fromEntries(RES.quem.map((_, i) => [6 + i, { halign:'right' }])),
        { [iMix]: { halign:'right', fontStyle:'bold', textColor:[180,83,9], fillColor:[255,251,239] } }
      ),
      margin: { left:12, right:12 },
    });
    doc.save('mix-1s27-' + MARCA_RES + '-' + carimbo() + '.pdf');
  }catch(e){
    alert('Não consegui gerar o PDF: ' + e.message);
  }finally{ bt.disabled = false; }
});

document.addEventListener('click', ev => {
  const f = ev.target.closest('[data-fecha]');
  if(f) $(f.dataset.fecha).hidden = true;
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape'){ $('modalConfirma').hidden = true; $('modalRes').hidden = true; }
});

/* A marca escolhida vai para a URL e a página recarrega: o estado inteiro
   (lista, mix, resultado) nasce da marca, e recomeçar é mais honesto que
   remendar cada pedaço na mão. De quebra, o link pode apontar direto. */
function pintarMarca(){
  const m = MARCAS[MARCA];
  document.title = 'Mix 1S27 · ' + m.nome;
  document.body.dataset.marca = MARCA;
  $('tituloTela').textContent = 'Mix 1S27';
  for(const bt of document.querySelectorAll('.marca-bt')){
    const dela = bt.dataset.marca === MARCA;
    bt.classList.toggle('on', dela);
    bt.setAttribute('aria-pressed', dela ? 'true' : 'false');
  }
}
document.getElementById('marcas').addEventListener('click', ev => {
  const bt = ev.target.closest('.marca-bt');
  if(!bt || bt.dataset.marca === MARCA) return;
  const u = new URL(location.href);
  u.searchParams.set('marca', bt.dataset.marca);
  location.href = u.toString();
});

/* ══ abertura ═══════════════════════════════════════════════════════════ */
(async function iniciar(){
  $('linkPortal').href = URL_PORTAL;
  pintarMarca();
  if(!SESSAO){
    $('subTopo').textContent = EH_LOCAL ? 'escolha quem está testando' : 'entre pelo Portal';
    if(EH_LOCAL){ pedirQuemE(); return; }
    $('avisos').innerHTML = `<div class="aviso"><b>Entre pelo Portal do Vendedor.</b>
      O mix é assinado com o seu nome, e sem a sessão não há como saber de quem ele é.
      <a href="${esc(URL_PORTAL)}" style="color:var(--marca);font-weight:800">Ir para o portal</a></div>`;
    $('btEnviar').hidden = true;
    return;
  }
  $('subTopo').innerHTML = esc(meuNome()) + ' · ' + esc(MARCAS[MARCA].nome) + ' · 1S27' +
    (EH_LOCAL ? ' · <button type="button" class="bt-trocar" id="btTrocar">trocar</button>' : '');
  if(EH_LOCAL) setTimeout(() => {
    $('btTrocar')?.addEventListener('click', () => {
      localStorage.removeItem(PORTAL_KEY);
      location.reload();
    });
  }, 0);
  $('btResultado').hidden = !ehCms();

  try{
    const r = await fetch(MARCAS[MARCA].arquivo + '?t=' + Date.now(), { cache:'no-store' });
    GTM = await r.json();
    FOLHAS[MARCA] = GTM;   /* a folha desta marca o painel já tem */
  }catch(e){
    $('avisos').innerHTML = `<div class="aviso"><b>Não consegui ler a lista do GTM.</b>
      ${esc(e.message)}</div>`;
    return;
  }

  MIXES = await lerTodosOsMixes();
  MEU = MIXES[meuCodigo()] || null;
  if(MEU) for(const it of (MEU.itens || [])) valores[chave(it.artigo, it.cor)] = it.pct;

  pintar();
})();
