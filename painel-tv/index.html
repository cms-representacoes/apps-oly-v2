<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS · Painel TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CMS · PAINEL TV - modo vitrine (10-foot UI)
   Escala: 1rem = 1vw. Numa TV 1920px, 1rem = 19,2px.
   Dados: ../data/tv_data.json (publicado pelo tv-admin)
   ============================================================ */
:root{
  --bg:#0C0918; --card:rgba(23,18,48,.55); --line:rgba(155,107,240,.16);
  --tx:#EDEBF7; --tx2:#B9B3D1; --mute:#8F87AD; --dim:#6E6787; --off:#3A3355;
  --roxo:#7C3AED; --roxo2:#9B6BF0; --roxo3:#C9B8F7;
  --ambar:#F0A030; --ambar2:#FFDCA6; --ambar3:#D9A868;
  --verde:#2BC48A; --verde2:#8FE5C4;
}
/* MODO CLARO (controlado pelo admin): tons profundos sobre fundo claro,
   contraste alto de propósito — nada de cinza lavado em TV */
body.claro{
  --bg:#F3F1FA; --card:rgba(255,255,255,.92); --line:rgba(109,40,217,.22);
  --tx:#1E1A3C; --tx2:#332D58; --mute:#4E4770; --dim:#6B6590; --off:#C6C1DC;
  --roxo:#6D28D9; --roxo2:#7C3AED; --roxo3:#5B21B6;
  --ambar:#B45E00; --ambar2:#8A4500; --ambar3:#9A5B10;
  --verde:#0B7A52; --verde2:#0B7A52;
}
body.claro #glow{background:radial-gradient(closest-side,rgba(124,58,237,.14),transparent 70%)}
body.claro #glow2{background:radial-gradient(closest-side,rgba(240,160,48,.12),transparent 70%)}
body.claro #grain{opacity:.05;mix-blend-mode:multiply}
body.claro .card{box-shadow:inset 0 .06rem 0 rgba(255,255,255,.9),0 .5rem 1.8rem rgba(30,26,60,.12)}
body.claro .c1-num{text-shadow:none;color:#2A1465}
body.claro .c1-bar{box-shadow:0 .2rem 1rem rgba(109,40,217,.35)}
body.claro .c2-falta{background:linear-gradient(155deg,rgba(240,160,48,.22),rgba(240,160,48,.08) 65%);
  outline-color:rgba(180,94,0,.5);box-shadow:inset 0 .06rem 0 rgba(255,255,255,.8),0 .6rem 2rem rgba(30,26,60,.12)}
body.claro .c2-fnum{color:#7A3D00;text-shadow:none}
body.claro .pilula{background:rgba(30,26,60,.06);border-color:rgba(30,26,60,.16);color:#1E1A3C}
body.claro .trilha{background:rgba(30,26,60,.12)}
body.claro #marca{background:#1E1A3C;opacity:.7}
body.claro #topo #logo{box-shadow:0 .2rem 1rem rgba(109,40,217,.3)}
body.claro #live.on{background:rgba(11,122,82,.1);border-color:rgba(11,122,82,.4);color:#0B7A52}
body.claro #live.off{background:rgba(180,94,0,.1);border-color:rgba(180,94,0,.4);color:#8A4500}
body.claro #barra{background:rgba(255,255,255,.9);border-top-color:rgba(109,40,217,.2)}
body.claro #ticktxt{color:#332D58}
body.claro .mrow.head{background:rgba(109,40,217,.12);border-color:rgba(109,40,217,.3)}
body.claro .mrow.head span{color:#3B2E7E;text-shadow:none}
body.claro .mrow.head span:first-child{color:#4E4770}
body.claro .mrow.zero{background:rgba(30,26,60,.04);border-color:rgba(30,26,60,.08)}
body.claro .mrow.zero .m-prep{color:#A29CBE}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:1vw}
body{background:var(--bg);color:var(--tx);font-family:"Inter",sans-serif;
  height:100vh;overflow:hidden;cursor:default}
body.idle{cursor:none}
.sg{font-family:"Space Grotesk",sans-serif}
.tnum{font-variant-numeric:tabular-nums}

#glow,#glow2{position:fixed;transform:translate(-50%,-50%);pointer-events:none;filter:blur(1rem)}
#glow{left:52%;top:40%;width:70vw;height:90vh;
  background:radial-gradient(closest-side,rgba(124,58,237,.20),transparent 70%)}
#glow2{left:80%;top:62%;width:50vw;height:70vh;
  background:radial-gradient(closest-side,rgba(240,160,48,.07),transparent 70%)}
#grain{position:fixed;inset:0;width:100%;height:100%;opacity:.028;pointer-events:none;mix-blend-mode:overlay}

#topo{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;
  gap:1rem;padding:1.4rem 2.2rem;z-index:6}
#logo{position:relative;overflow:hidden;width:2.6rem;height:2.6rem;border-radius:.8rem;
  background:linear-gradient(135deg,#9B6BF0,#7C3AED);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:.95rem;font-weight:600;
  box-shadow:0 .2rem 1.2rem rgba(124,58,237,.4)}
#logoshine{position:absolute;top:-30%;left:-90%;width:55%;height:160%;
  transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent)}
.brand{font-size:1.2rem;font-weight:600;letter-spacing:-.01em}
.brand-sub{color:var(--dim);font-size:.8rem;letter-spacing:.16em;font-weight:500}
#clock{color:var(--tx2);font-size:1.25rem;font-weight:600}
#live{display:inline-flex;align-items:center;gap:.45rem;border-radius:99rem;
  padding:.3rem .85rem;font-size:.78rem;font-weight:600;letter-spacing:.1em}
#live.on{background:rgba(43,196,138,.12);border:.06rem solid rgba(43,196,138,.3);color:#7FE0BC}
#live.off{background:rgba(240,160,48,.1);border:.06rem solid rgba(240,160,48,.3);color:var(--ambar3)}
#livedot{width:.55rem;height:.55rem;border-radius:99rem;background:var(--verde);
  animation:pulso 1.8s ease-out infinite}
#live.off #livedot{background:var(--ambar);animation:none}
@keyframes pulso{from{box-shadow:0 0 0 0 rgba(43,196,138,.6)}to{box-shadow:0 0 0 .55rem rgba(43,196,138,0)}}

#palco{position:fixed;inset:5.4rem 2.4rem 4.6rem;z-index:5}
.cena{position:absolute;inset:0;opacity:0}
.stag{opacity:0}
.eyebrow{color:var(--mute);font-size:1rem;letter-spacing:.18em;font-weight:600}
.card{background:var(--card);border:.06rem solid var(--line);border-radius:1.1rem;
  backdrop-filter:blur(.4rem);
  box-shadow:inset 0 .06rem 0 rgba(237,235,247,.07),0 .6rem 2.2rem rgba(0,0,0,.25)}
.pilula{display:inline-flex;align-items:center;gap:.45rem;background:rgba(255,255,255,.05);
  border:.06rem solid rgba(255,255,255,.1);border-radius:99rem;padding:.35rem .9rem;
  color:var(--tx);font-size:.95rem;font-weight:600}

.c1{display:flex;height:100%;gap:2rem;align-items:center}
.c1-esq{flex:0 0 38%}
.c1-num{font-size:4.6rem;font-weight:700;letter-spacing:-.02em;line-height:1;
  text-shadow:0 0 3rem rgba(124,58,237,.35)}
.c1-sub{color:var(--roxo2);font-size:1.15rem;font-weight:600;margin-top:.7rem}
.c1-chart{flex:1;height:84%;padding:1.4rem 1.6rem 1rem;display:flex;align-items:flex-end;gap:1.2rem}
.c1-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.5rem}
.c1-val{font-size:1rem;font-weight:600}
.c1-bar{width:100%;max-width:4.4rem;height:0;border-radius:.6rem .6rem .25rem .25rem;
  background:linear-gradient(180deg,#9B6BF0,#7C3AED);box-shadow:0 0 1.4rem rgba(124,58,237,.35)}
.c1-mes{color:var(--mute);font-size:.85rem;letter-spacing:.12em;font-weight:600}

.c2{display:flex;height:100%;gap:1.8rem;align-items:stretch}
.c2-esq{flex:1.02;display:flex;flex-direction:column;justify-content:center}
.c2-num{font-size:3.6rem;font-weight:700;letter-spacing:-.02em}
.c2-un{color:var(--roxo2);font-size:1.15rem;font-weight:600;margin-left:.7rem}
.trilha{position:relative;height:1rem;background:rgba(36,30,58,.9);border-radius:99rem;margin-top:1.2rem}
#ritmo{position:absolute;left:0;top:0;height:100%;width:0;border-radius:99rem;
  background:linear-gradient(90deg,#7C3AED,#9B6BF0)}
#ponta{position:absolute;top:50%;width:.7rem;height:.7rem;border-radius:99rem;background:var(--roxo3);
  box-shadow:0 0 .9rem .18rem rgba(155,107,240,.8);transform:translate(-50%,-50%);left:0;opacity:0}
#marca{position:absolute;top:-.35rem;width:.16rem;height:1.7rem;background:var(--tx);opacity:.55;border-radius:.1rem}
.trilha-leg{display:flex;justify-content:space-between;margin-top:.55rem;color:var(--mute);font-size:.92rem}
.c2-falta{flex:1;border-radius:1.3rem;padding:1.8rem 2.2rem;display:flex;flex-direction:column;
  justify-content:center;position:relative;overflow:hidden;
  background:linear-gradient(155deg,rgba(240,160,48,.13),rgba(240,160,48,.03) 65%);
  outline:.06rem solid rgba(240,160,48,.32);backdrop-filter:blur(.4rem);
  box-shadow:inset 0 .06rem 0 rgba(255,220,160,.18),0 .7rem 2.6rem rgba(0,0,0,.3)}
#brilho{position:absolute;top:-30%;left:-70%;width:42%;height:160%;transform:rotate(16deg);
  background:linear-gradient(90deg,transparent,rgba(255,214,150,.13),transparent)}
.c2-flag{display:flex;align-items:center;gap:.6rem;color:var(--ambar);font-size:1rem;
  font-weight:600;letter-spacing:.16em}
.c2-fnum{color:var(--ambar2);font-size:5rem;font-weight:700;letter-spacing:-.025em;
  line-height:1.02;margin-top:.6rem;text-shadow:0 0 3rem rgba(240,160,48,.25)}
.c2-fsub{color:var(--ambar3);font-size:1.15rem;font-weight:600}

.c34{height:100%;display:flex;flex-direction:column}
.c34-top{display:flex;align-items:center;gap:.8rem;margin-bottom:.9rem}
.selo{color:#fff;font-size:.9rem;font-weight:600;border-radius:99rem;padding:.28rem 1rem;letter-spacing:.05em}
.c34-tit{color:var(--mute);font-size:.95rem;letter-spacing:.12em;font-weight:500}
.c34-tot{color:var(--verde);font-size:1.2rem;font-weight:600;margin-left:auto}
.mtz{flex:1;display:flex;flex-direction:column;gap:.4rem}
.mrow{flex:1;display:grid;grid-template-columns:1.2fr repeat(5,1fr) .8fr;gap:.55rem;
  align-items:center;padding:0 1.1rem;border-radius:.9rem}
.mrow.head{flex:0 0 auto;padding:.35rem 1.1rem .5rem;background:rgba(124,58,237,.10);
  border:.06rem solid rgba(155,107,240,.22);border-radius:.7rem;margin-bottom:.15rem}
.mrow.head span{color:#D8D2EE;font-size:1.05rem;letter-spacing:.14em;font-weight:700;
  text-align:center;font-family:"Space Grotesk",sans-serif;text-shadow:0 .05rem .4rem rgba(0,0,0,.4)}
.mrow.head span:first-child{text-align:left;color:var(--mute)}
.mrow.zero{background:rgba(19,16,34,.4);border:.06rem solid rgba(155,107,240,.06)}
.m-prep{font-size:1.05rem;font-weight:600}
.mrow.zero .m-prep{color:#57506E}
.m-cel{text-align:center}
.m-pill{display:inline-block;min-width:4rem;font-size:.95rem;font-weight:600;border-radius:.6rem;padding:.2rem .6rem}
.m-off{color:var(--off);font-size:.95rem;text-align:center}
.m-tot{text-align:center;color:var(--verde);font-size:1.1rem;font-weight:600}
.mrow.zero .m-tot{color:var(--off)}

/* cena 5 · performance (visão consolidada da carta campanha) */
.c5{height:100%;display:flex;flex-direction:column}
.c5-top{display:flex;align-items:baseline;gap:.8rem;margin-bottom:.8rem}
.c5-res{color:var(--verde);font-size:1.1rem;font-weight:600;margin-left:auto}
.c5-upd{color:var(--dim);font-size:.85rem}
.plist{flex:1;display:flex;flex-direction:column;gap:.4rem}
.prow{flex:1;display:grid;align-items:center;gap:.7rem;padding:0 1.2rem;border-radius:.9rem;
  grid-template-columns:2rem 7.5rem 1.05fr 1.05fr 1.3fr 4.6rem 7.2rem}
.prow.head{flex:0 0 auto;padding-top:.35rem;padding-bottom:.5rem;background:rgba(124,58,237,.10);
  border:.06rem solid rgba(155,107,240,.22);border-radius:.7rem;margin-bottom:.15rem}
.prow.head span{color:#D8D2EE;font-size:.95rem;letter-spacing:.12em;font-weight:700;
  font-family:"Space Grotesk",sans-serif;text-align:right}
.prow.head span:nth-child(1),.prow.head span:nth-child(2){text-align:left;color:var(--mute)}
.prow.head span:nth-child(5),.prow.head span:nth-child(6),.prow.head span:nth-child(7){text-align:center}
body.claro .prow.head{background:rgba(109,40,217,.12);border-color:rgba(109,40,217,.3)}
body.claro .prow.head span{color:#3B2E7E}
.p-rank{color:var(--dim);font-size:.95rem;font-weight:600}
.p-nome{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#9B6BF0,#7C3AED);
  color:#fff;font-size:1rem;font-weight:600;border-radius:.55rem;padding:.3rem .8rem;justify-self:start}
.p-val{text-align:right;color:var(--tx);font-size:1.15rem;font-weight:600}
.p-trilha{position:relative;height:.75rem;background:rgba(128,120,160,.22);border-radius:99rem}
body.claro .p-trilha{background:rgba(30,26,60,.12)}
.p-fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:99rem;
  background:linear-gradient(90deg,#7C3AED,#B794F6)}
.p-meta{position:absolute;left:75%;top:-.3rem;width:.14rem;height:1.35rem;background:var(--tx);opacity:.5;border-radius:.1rem}
.p-pct{text-align:center;font-size:1.25rem;font-weight:700}
.p-pct.ok{color:var(--verde)} .p-pct.low{color:var(--ambar)}
.p-selo{justify-self:center;font-size:.85rem;font-weight:600;border-radius:99rem;padding:.28rem .9rem;white-space:nowrap}
.p-selo.ok{background:rgba(43,196,138,.13);border:.06rem solid rgba(43,196,138,.4);color:var(--verde2)}
.p-selo.low{background:rgba(240,160,48,.12);border:.06rem solid rgba(240,160,48,.4);color:var(--ambar3)}

/* cenas 6/7 · ranking horizontal (vendedores em 30d, saldo em estoque) */
.c6{height:100%;display:flex;flex-direction:column}
.c6-top{display:flex;align-items:baseline;gap:.8rem;margin-bottom:.9rem}
.rk{flex:1;display:flex;flex-direction:column;gap:.55rem;justify-content:center}
.rk-row{display:grid;grid-template-columns:2.2rem 11rem 1fr 6.5rem;gap:1rem;align-items:center;
  padding:.55rem 1.2rem;border-radius:.9rem}
.rk-rank{color:var(--dim);font-size:1rem;font-weight:600}
.rk-name{font-size:1.15rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-sub{color:var(--mute);font-size:.85rem;margin-top:.1rem}
.rk-trilha{position:relative;height:.85rem;background:rgba(128,120,160,.2);border-radius:99rem}
body.claro .rk-trilha{background:rgba(30,26,60,.1)}
.rk-fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:99rem}
.rk-val{text-align:right;font-size:1.25rem;font-weight:700}
body.claro .p-selo.ok{background:rgba(11,122,82,.1);color:#0B7A52}
body.claro .p-selo.low{background:rgba(180,94,0,.1);color:#8A4500}

#dots{position:fixed;bottom:3.4rem;left:0;right:0;display:flex;justify-content:center;gap:.55rem;z-index:6}
#dots span{width:.55rem;height:.55rem;border-radius:99rem;background:var(--off);transition:all .35s}
#dots span.on{width:1.7rem;background:linear-gradient(90deg,#9B6BF0,#7C3AED)}
#barra{position:fixed;bottom:0;left:0;right:0;height:2.6rem;background:rgba(16,12,30,.85);
  border-top:.06rem solid rgba(155,107,240,.15);backdrop-filter:blur(.6rem);
  display:flex;align-items:center;padding:0 1.6rem;gap:.8rem;z-index:6;overflow:hidden}
#tickpill{display:inline-flex;align-items:center;gap:.6rem;opacity:0}
#tickdot{width:.55rem;height:.55rem;border-radius:99rem;background:var(--verde);flex:none}
#ticktxt{color:#C9C3DE;font-size:1rem;font-weight:500;white-space:nowrap}
#aviso{position:fixed;inset:0;display:none;place-items:center;z-index:8;text-align:center}
#aviso.show{display:grid}
#aviso .box{max-width:44rem}
#aviso h1{font-size:1.8rem;font-weight:600;margin:1rem 0 .5rem}
#aviso p{color:var(--mute);font-size:1.05rem;line-height:1.6}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div id="glow"></div><div id="glow2"></div>
<svg id="grain"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#nz)"/></svg>

<div id="topo">
  <span id="logo" class="sg">CMS<span id="logoshine"></span></span>
  <span class="brand sg">CMS Representações</span>
  <span class="brand-sub">OLYMPIKUS · UNDER ARMOUR</span>
  <span style="flex:1"></span>
  <span id="clock" class="sg tnum"></span>
  <span id="live" class="on"><span id="livedot"></span><span id="livetxt">AO VIVO</span></span>
</div>

<div id="palco"></div>

<div id="dots"></div>

<div id="barra">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" style="flex:none"><path d="M12 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0-4 0M7.5 7.5a6.4 6.4 0 0 0 0 9M16.5 7.5a6.4 6.4 0 0 1 0 9M4.7 4.7a10.4 10.4 0 0 0 0 14.6M19.3 4.7a10.4 10.4 0 0 1 0 14.6"/></svg>
  <div id="tickpill"><span id="tickdot"></span><span id="ticktxt"></span></div>
</div>

<div id="aviso"><div class="box">
  <span class="sg" style="display:inline-flex;width:4rem;height:4rem;border-radius:1.1rem;background:linear-gradient(135deg,#9B6BF0,#7C3AED);color:#fff;align-items:center;justify-content:center;font-size:1.4rem;font-weight:600">CMS</span>
  <h1 class="sg">Aguardando a primeira publicação</h1>
  <p>Abra o <b>tv-admin</b>, importe a DETALHADA do dia e publique.<br>Esta tela atualiza sozinha em seguida.</p>
</div></div>

<script>
/* CONFIG */
const DATA_URL = '../data/tv_data.json';   // mesmo domínio (GitHub Pages)
const POLL_MS  = 10*60*1000;               // re-consulta a cada 10 min
let CENA_MS    = 18*1000;                  // duração de cada cena (o admin pode ajustar)
const CATS = ['TÊNIS','MEIAS','ACESSÓRIOS','CONFECÇÃO','CHINELO'];
const fmt = n => Math.round(n).toLocaleString('pt-BR');
const mil = n => n>=1000 ? (n/1000).toLocaleString('pt-BR',{maximumFractionDigits:0})+' mil' : fmt(n);

let DATA = null;
let PERF = null;   // widget_performance.json (gerado pela automação do Performance)
let VEND = null;   // ranking de vendedores 30d (direto do worker de repasses)
let ESTQ = null;   // saldo em estoque (direto do worker de repasses)

function contar(el, alvo, dur){
  const t0 = performance.now();
  (function up(t){
    let p = Math.min((t-t0)/dur, 1);
    const e = p < .82 ? (p/.82)*.95 : .95 + (1-Math.pow(1-(p-.82)/.18,3))*.05;
    el.textContent = fmt(alvo*e);
    if(p<1) requestAnimationFrame(up);
  })(t0);
}
function stagger(el){
  el.querySelectorAll('.stag').forEach((s,i)=> s.animate(
    [{opacity:0, transform:'translateY(1rem) scale(.985)'},
     {opacity:1, transform:'translateY(0) scale(1)'}],
    {duration:600, delay:180+i*80, easing:'cubic-bezier(.16,1.1,.3,1)', fill:'forwards'}));
}

/* CENAS */
function cenaCarteira(el){
  const c = DATA.carteira;
  el.innerHTML = `<div class="c1">
    <div class="c1-esq">
      <div class="stag eyebrow">CARTEIRA ABERTA</div>
      <div class="stag"><span id="bign" class="sg tnum c1-num">0</span></div>
      <div class="stag c1-sub">pares a faturar · ${c.horizonte}</div>
    </div>
    <div class="stag card c1-chart" id="bchart"></div>
  </div>`;
  stagger(el);
  contar(el.querySelector('#bign'), c.total, 1600);
  const max = Math.max(...c.meses.map(m=>m.v), 1);
  const bc = el.querySelector('#bchart');
  c.meses.forEach((m,i)=>{
    const col = document.createElement('div'); col.className='c1-col';
    col.innerHTML = `<span class="c1-val tnum sg">${mil(m.v)}</span>
      <span class="c1-bar"></span><span class="c1-mes">${m.label}</span>`;
    bc.appendChild(col);
    col.querySelector('.c1-bar').animate([{height:'0%'},{height:Math.round(m.v/max*86)+'%'}],
      {duration:800, delay:400+i*130, easing:'cubic-bezier(.16,1,.3,1)', fill:'forwards'});
  });
}

function cenaMes(el){
  const m = DATA.mes;
  el.innerHTML = `<div class="c2">
    <div class="c2-esq">
      <div class="stag eyebrow">${m.label} · FATURADO ATÉ DIA ${m.dia}</div>

  m.appendChild(head);
  (cfg.linhas||[]).forEach(([nome, vals])=>{

/* DADOS */
const PERF_URL = '../data/widget_performance.json';
const REPASSE_URL = 'https://repasse-worker-cms.marcosrep-cms.workers.dev';
function unidadesItem(item){
  if(!item) return 0;
  const t = Number(item.totalUnits||0);
  if(t>0) return t;
  return (item.grade||[]).reduce((s,g)=>s+Number(g.qty||0),0);
}
function statusCanon(s){
  const n = String(s||'').trim().toLowerCase();
  if(['aprovado','finalizado','faturado'].includes(n)) return 'Aprovado';
  if(['cancelado','cancelada'].includes(n)) return 'Cancelado';
  return 'Pendente';
}
async function carregarRepasse(){
  try{
    const [ordRes, dispoRes] = await Promise.all([
      fetch(REPASSE_URL+'?t='+Date.now(), {cache:'no-store'}),
      fetch(REPASSE_URL, {method:'PATCH', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({action:'getDispo'}), cache:'no-store'}),
    ]);
    const ordJson = ordRes.ok ? await ordRes.json() : [];
    const orders = Array.isArray(ordJson) ? ordJson : (ordJson.orders||[]);
    const dispoJson = dispoRes.ok ? await dispoRes.json() : [];
    const dispoRows = Array.isArray(dispoJson) ? dispoJson : [];

    const cutoff = Date.now() - 30*24*60*60*1000;
    const periodo = orders.filter(o => new Date(o.createdAt||o.updatedAt||0).getTime() >= cutoff);

    const mapa = new Map();
    for(const o of periodo){
      const st = statusCanon(o.status);
      if(st==='Cancelado') continue;
      const nome = o.preposto?.nome || o.preposto?.codigo || '—';
      if(!mapa.has(nome)) mapa.set(nome, {pares:0, pedidos:0});
      const e = mapa.get(nome);
      e.pedidos++;
      e.pares += (o.items||[]).reduce((s,i)=>s+unidadesItem(i),0);
    }
    VEND = [...mapa.entries()].filter(([,d])=>d.pedidos>0)
      .sort((a,b)=>b[1].pares-a[1].pares)
      .map(([nome,d])=>({nome, pedidos:d.pedidos, pares:d.pares}));

    const pendMap=new Map(), aprovMap=new Map();
    for(const o of orders){
      const st = statusCanon(o.status);
      if(st==='Cancelado') continue;
      for(const item of (o.items||[])){
        const key = String(item.gci||item.codigo||'').trim(); if(!key) continue;
        const u = unidadesItem(item);
        if(st==='Pendente') pendMap.set(key,(pendMap.get(key)||0)+u);
        else aprovMap.set(key,(aprovMap.get(key)||0)+u);
      }
    }
    const porProduto = new Map();
    for(const r of dispoRows){
      const produto = String(r.produto||'').trim(); if(!produto) continue;
      const key = String(r.gci||'').trim() || String(r.codigo||'').trim();
      const saldoReal = Number(r.saldo||0) - (pendMap.get(key)||0) - (aprovMap.get(key)||0);
      if(!porProduto.has(produto)) porProduto.set(produto, {saldo:0, cores:new Set()});
      const g = porProduto.get(produto);
      g.saldo += saldoReal;
      g.cores.add(String(r.cor||'').trim());
    }
    ESTQ = [...porProduto.entries()].map(([produto,g])=>({produto, saldo:Math.round(g.saldo), cores:g.cores.size}))
      .filter(p=>p.saldo>0).sort((a,b)=>b.saldo-a.saldo);
    try{ localStorage.setItem('tv_cache_repasse', JSON.stringify({VEND,ESTQ})); }catch(_){}
    return true;
  }catch(_){
    if(!VEND && !ESTQ){
      try{ const c=JSON.parse(localStorage.getItem('tv_cache_repasse'));
        if(c){ VEND=c.VEND; ESTQ=c.ESTQ; return true; } }catch(_){}
    }
    return false;
  }
}
async function carregarPerf(){
  try{
    const r = await fetch(PERF_URL + '?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw 0;
    const p = await r.json();
    const mudou = !PERF || p.atualizado !== PERF.atualizado;
    PERF = p;
    try{ localStorage.setItem('tv_cache_perf', JSON.stringify(p)); }catch(_){}
    return mudou;
  }catch(_){
    if(!PERF){ try{ PERF = JSON.parse(localStorage.getItem('tv_cache_perf')); }catch(_){}
      return !!PERF; }
    return false;   // mantém o último válido
  }
}
async function carregar(primeira){
  const perfMudou = await carregarPerf();
  const repasseMudou = await carregarRepasse();
  try{
    const res = await fetch(DATA_URL + '?v=' + Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const novo = await res.json();
    const mudou = perfMudou || repasseMudou || !DATA || novo.generatedAt !== DATA.generatedAt;
    DATA = novo;
    if(DATA.config && DATA.config.cenaSeg) CENA_MS = DATA.config.cenaSeg*1000;
    document.body.classList.toggle('claro', DATA.config && DATA.config.tema==='claro');
    try{ localStorage.setItem('tv_cache', JSON.stringify(novo)); }catch(_){}
    document.getElementById('aviso').classList.remove('show');
    if(primeira || mudou){ montarCenas(); montarTicker(); mostrar(0); girar(); }
  }catch(e){
    if(!DATA){
      try{ DATA = JSON.parse(localStorage.getItem('tv_cache')); }catch(_){}
      if(DATA){
        if(DATA.config && DATA.config.cenaSeg) CENA_MS = DATA.config.cenaSeg*1000;
        document.body.classList.toggle('claro', DATA.config && DATA.config.tema==='claro');
        montarCenas(); montarTicker(); mostrar(0); girar(); }
      else document.getElementById('aviso').classList.add('show');
    }
    /* com dado em tela, falha de rede é silenciosa: a TV nunca quebra */
  }
  atualizarLive();
}
function atualizarLive(){
  const el = document.getElementById('live'), tx = document.getElementById('livetxt');
  if(!DATA){ el.className='off'; tx.textContent='SEM DADOS'; return; }
  const idade = Date.now() - new Date(DATA.generatedAt).getTime();
  if(idade < 60*60*1000){ el.className='on'; tx.textContent='AO VIVO'; }
  else{
    el.className='off';
    const d = new Date(DATA.generatedAt);
    tx.textContent = 'ATUALIZADO ' + String(d.getDate()).padStart(2,'0') + '/' +
      String(d.getMonth()+1).padStart(2,'0') + ' ' +
      String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }
}

/* TICKER */
let fatos = [], fi = 0, tickerTimer = null;
function montarTicker(){
  fatos = (DATA.ticker || []).map(f => [f.c, f.t]);
  if(PERF && PERF.resumo) fatos.push(['#9B6BF0', 'carta campanha: '+PERF.resumo]);
  if(!fatos.length) return;
  const pill = document.getElementById('tickpill');
  const dot = document.getElementById('tickdot'), txt = document.getElementById('ticktxt');
  fi = 0;
  dot.style.background = fatos[0][0]; txt.textContent = fatos[0][1]; fi = 1;
  pill.animate([{opacity:0},{opacity:1}],{duration:400, delay:600, fill:'forwards'});
  clearInterval(tickerTimer);
  tickerTimer = setInterval(()=>{
    pill.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-.6rem)'}],
      {duration:280, easing:'ease-in', fill:'forwards'}).onfinish = ()=>{
      const [c,t] = fatos[fi % fatos.length]; fi++;
      dot.style.background = c; txt.textContent = t;
      pill.animate([{opacity:0,transform:'translateY(.6rem)'},{opacity:1,transform:'translateY(0)'}],
        {duration:320, easing:'cubic-bezier(.16,1,.3,1)', fill:'forwards'});
    };
  }, 5000);
}
